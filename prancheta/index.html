// Cria os motores de todos os jogos do dia atual.
function createDayEngines(userLive){
  const s = state.save, d = s.calendar[s.day];
  return dayMatches(d).map(x => {
    const m = x.m, home = T(m.h), away = T(m.a), seed = matchSeed(m);
    const isUser = involvesUser(x), uHome = m.h === s.userTeamId;
    const tH = isUser && uHome ? s.tactic : aiTactic(home, away, seed + 1);
    const tA = isUser && !uHome ? s.tactic : aiTactic(away, home, seed + 2);
    const eng = new MatchEngine(home, away, tH, tA, seed, { log: isUser, userSide: isUser && userLive ? (uHome ? 0 : 1) : -1, ko: x.ko, comp: x.comp, label: compLabel(d, x) });
    eng.fixture = m; eng.ref = x;
    return eng;
  });
}
// Simula o dia atual instantaneamente (o time do usuário usa a tática dele; a IA faz as trocas).
function simulateDayQuick(){
  const s = state.save, mine = userMatchOfDay(s.calendar[s.day]);
  let saved = null;
  if (mine){
    validateUserLineup();
    // no modo rápido o auxiliar poupa quem está cansado (só neste jogo)
    saved = s.tactic.lineup;
    s.tactic.lineup = restedLineup();
  }
  const engines = createDayEngines(false);
  if (saved) s.tactic.lineup = saved;
  engines.forEach(e => e.runToEnd());
  const ue = engines.find(e => involvesUser(e.ref));
  finalizeDay(engines);
  return ue;
}
// Simula os dias sem jogo do usuário até o próximo compromisso dele.
function simulateUntilUserDay(){
  const s = state.save; let n = 0;
  while (s.phase === 'season' && s.day < s.calendar.length && !userMatchOfDay(s.calendar[s.day])){ simulateDayQuick(); n++; }
  return n;
}
// Aplica os resultados de um dia ao estado e avança o calendário.
function finalizeDay(engines){
  const s = state.save, d = s.calendar[s.day], league = d.t === 'L';
  if (league) for (const t of Object.values(s.teams)) for (const p of t.squad) if (p.injury > 0) p.injury--;
  for (const e of engines){
    const f = e.fixture;
    f.hg = e.score[0]; f.ag = e.score[1];
    f.goals = e.goals.map(g => ({ s: g.side, n: shortP(T(g.side ? f.a : f.h).squad.find(p => p.id === g.pid) || { name: g.name }), m: g.min, p: g.pen ? 1 : 0 }));
    f.stats = { poss: e.possPct(), shots: e.stats.shots.slice(), onT: e.stats.onT.slice() };
    if (e.pens) f.pens = e.pens.slice();
    applyMatchToPlayers(e, e.ref.comp);
    if (f.h === s.userTeamId) finAdd(gateIncome(T(f.h), e.ref.comp), `Bilheteria (${COMP_TAG[e.ref.comp]}) × ${T(f.a).short}`);
    Hooks.run('afterMatch', { engine: e, fixture: f, day: d });
  }
  if (d.t === 'C') progressCup(d, engines);
  const ue = engines.find(e => involvesUser(e.ref));
  if (ue) afterUserMatch(ue, d);
  if (league){ weeklyUpdate(); s.round++; }
  recoverAll(restAfter(s.day));
  Hooks.run('afterDay', { day: d });
  s.day++;
  if (s.day >= s.calendar.length) endSeason();
  else checkBoard();
  saveGame();
}
function restAfter(i){
  const c = state.save.calendar, cur = c[i], next = c[i + 1];
  if (!next) return 29;
  if (cur.t === 'L' && next.t === 'C') return 16;
  if (cur.t === 'C' && next.t === 'L') return 20;
  return 29;
}
function recoverAll(base){
  const s = state.save, tr = INTENSITY[s.training.intensity] || INTENSITY.normal;
  for (const t of Object.values(s.teams)){
    const bonus = t.id === s.userTeamId ? tr.rec * base / 29 : 0;
    for (const p of t.squad){
      const k = p.age <= 29 ? 1 : p.age <= 32 ? 0.87 : 0.7;
      p.fitness = clamp(Math.round(p.fitness + base * k + bonus), 0, 100);
      if (base >= 29) p.morale = clamp(Math.round(p.morale + (68 - p.morale) * 0.08), 15, 100);
    }
  }
}
function applyMatchToPlayers(e, comp){
  const s = state.save;
  for (let i = 0; i < 2; i++){
    const side = e.sides[i], team = side.team;
    const gf = e.score[i], ga = e.score[1 - i];
    const res = gf > ga ? 1 : gf < ga ? -1 : 0;
    const strength = teamOvr(team), mine = team.id === s.userTeamId;
    const played = new Set();
    for (const en of [...side.field, ...side.out, ...side.sentOff]){
      en.p.fitness = Math.round(en.fit); en.p.apps++; played.add(en.p.id); en.p.lastDay = s.day;
      if (side.starters.has(en.p.id)) en.p.starts++;
      en.p.morale = clamp(en.p.morale + res * 4 + 1, 15, 100);
    }
    // suspensões: quem estava suspenso cumpriu um jogo; depois aplica as novas
    for (const p of team.squad) if (p.suspension > 0 && !played.has(p.id)) p.suspension--;
    for (const en of side.sentOff){
      en.p.red++; en.p.morale = clamp(en.p.morale - 4, 15, 100);
      en.p.suspension = en.kind === 'red' ? 2 : 1;
      if (mine) addNews(`${en.p.name} foi expulso e cumprirá ${en.p.suspension} jogo${en.p.suspension > 1 ? 's' : ''} de suspensão.`, 'bad');
    }
    for (const en of [...side.field, ...side.out]) if (en.cards === 1){
      en.p.yellow++; en.p.yAcc = (en.p.yAcc || 0) + 1;
      if (en.p.yAcc >= 3){ en.p.yAcc = 0; en.p.suspension = (en.p.suspension || 0) + 1; if (mine) addNews(`${en.p.name} recebeu o 3º amarelo e está suspenso para o próximo jogo.`, 'bad'); }
    }
    for (const p of team.squad) if (!played.has(p.id)) p.morale = clamp(p.morale + res * 2 - (p.ovr >= strength ? 1 : 0), 15, 100);
  }
  for (const inj of e.injuries){
    const team = e.sides[inj.side].team, p = findPlayer(team, inj.pid); if (!p) continue;
    p.injury = Math.max(p.injury || 0, inj.weeks);
    if (team.id === s.userTeamId) addNews(`🚑 ${p.name} se lesionou: fora por ${inj.weeks} semana${inj.weeks > 1 ? 's' : ''}.`, 'bad');
  }
  for (const g of e.goals){
    const team = e.sides[g.side].team;
    const sc = findPlayer(team, g.pid);
    if (sc){ if (comp === 'L') sc.goals++; else { sc.cg = sc.cg || { cdb: 0, lib: 0 }; sc.cg[comp]++; } sc.morale = clamp(sc.morale + 3, 15, 100); }
    const as = g.assist && findPlayer(team, g.assist); if (as && comp === 'L') as.assists++;
  }
}
// Avança as copas: define vencedores, sorteia a fase seguinte, paga prêmios.
function progressCup(d, engines){
  const s = state.save, cup = s.cups[d.c], uid = s.userTeamId;
  if (d.st === 'G'){
    if (d.i !== 5) return;
    const tables = cup.groups.map(groupTable);
    const ties = tables.map((t, gi) => makeTie(tables[7 - gi][1].id, t[0].id, true));   // 2º manda a ida
    cup.ko.R16 = ties; cup.stage = 'R16';
    tables.forEach((t, gi) => {
      const pos = t.findIndex(r => r.id === uid);
      if (pos >= 0){
        if (pos <= 1){ addNews(`Libertadores: classificado às oitavas em ${pos + 1}º do grupo ${String.fromCharCode(65 + gi)}!`, 'good'); finAdd(PRIZE.lib.R16, 'Prêmio: oitavas da Libertadores'); boardDelta(3); }
        else { addNews(`Libertadores: eliminado na fase de grupos (${pos + 1}º do grupo ${String.fromCharCode(65 + gi)}).`, 'bad'); boardDelta(-5); }
      }
    });
    return;
  }
  for (const e of engines){
    if (!e.ref.ko) continue;
    const t = e.ref.tie; t.w = e.koWinner() === 0 ? e.fixture.h : e.fixture.a; t.pens = e.pens;
    if (t.a === uid || t.b === uid){
      const won = t.w === uid, order = CUP_ORDER[d.c], next = order[order.indexOf(d.st) + 1];
      if (won && d.st === 'F'){ /* tratado abaixo */ }
      else if (won){ addNews(`${COMP_NAME[d.c]}: classificado para ${STAGE_NAME[next].toLowerCase()}!`, 'good'); finAdd(PRIZE[d.c][next] || 0, `Prêmio: ${STAGE_NAME[next].toLowerCase()} (${COMP_TAG[d.c]})`); boardDelta(2); }
      else { addNews(`${COMP_NAME[d.c]}: eliminado na ${STAGE_NAME[d.st].toLowerCase()} pelo ${T(t.w).short}.`, 'bad'); boardDelta(d.st === 'R32' ? -6 : -2); }
    }
  }
  const ties = cup.ko[d.st];
  if (!ties.every(t => t.w)) return;
  if (d.st === 'F'){
    cup.champion = ties[0].w; cup.stage = 'done';
    addNews(`🏆 ${T(cup.champion).name} é campeão da ${COMP_NAME[d.c]}!`, cup.champion === uid ? 'good' : 'info');
    if (cup.champion === uid){ finAdd(PRIZE[d.c].champion, `Título da ${COMP_NAME[d.c]}`); boardDelta(d.c === 'lib' ? 30 : 18); }
    return;
  }
  const order = CUP_ORDER[d.c], next = order[order.indexOf(d.st) + 1];
  const r = makeRng(`${s.seed}|${d.c}|${next}|${s.season}`);
  const winners = r.shuffle(ties.map(t => t.w));
  const single = d.c === 'lib' && next === 'F';
  cup.ko[next] = [];
  for (let i = 0; i < winners.length; i += 2) cup.ko[next].push(makeTie(winners[i], winners[i + 1], !single, single));
  cup.stage = next;
}
// Classificação: pontos, vitórias, saldo, gols pró (critérios do Brasileirão).
function standings(save = state.save){
  const rows = {};
  for (const id of save.league) rows[id] = { id, P:0, J:0, V:0, E:0, D:0, GP:0, GC:0, SG:0 };
  for (const rd of save.fixtures) for (const m of rd.matches){
    if (m.hg == null || !rows[m.h] || !rows[m.a]) continue;
    const h = rows[m.h], a = rows[m.a];
    h.J++; a.J++; h.GP += m.hg; h.GC += m.ag; a.GP += m.ag; a.GC += m.hg;
    if (m.hg > m.ag){ h.V++; h.P += 3; a.D++; } else if (m.hg < m.ag){ a.V++; a.P += 3; h.D++; } else { h.E++; a.E++; h.P++; a.P++; }
  }
  return Object.values(rows).map(r => (r.SG = r.GP - r.GC, r))
    .sort((x, y) => y.P - x.P || y.V - x.V || y.SG - x.SG || y.GP - x.GP || (T(x.id).name).localeCompare(T(y.id).name));
}
function topScorers(comp = 'L', limit = 20){
  const s = state.save, list = [];
  const ids = comp === 'L' ? s.league : (s.cups && s.cups[comp] ? s.cups[comp].teams : []);
  for (const id of ids){ const t = T(id); if (!t) continue; for (const p of t.squad){ const g = comp === 'L' ? p.goals : (p.cg ? p.cg[comp] : 0); if (g > 0) list.push({ p, team: t, g }); } }
  return list.sort((a, b) => b.g - a.g || b.p.assists - a.p.assists || a.p.apps - b.p.apps).slice(0, limit);
}
function teamForm(teamId, n = 5){
  const s = state.save, out = [];
  for (let i = s.day - 1; i >= 0 && out.length < n; i--){
    const x = dayMatches(s.calendar[i]).find(y => y.m.h === teamId || y.m.a === teamId);
    if (!x || x.m.hg == null) continue;
    const m = x.m, gf = m.h === teamId ? m.hg : m.ag, ga = m.h === teamId ? m.ag : m.hg;
    out.unshift(gf > ga ? 'V' : gf < ga ? 'D' : 'E');
  }
  return out;
}
function expectedPosition(teamId){
  const s = state.save;
  return s.league.slice().sort((a, b) => teamOvr(T(b)) - teamOvr(T(a))).indexOf(teamId) + 1;
}
function endSeason(){
  const s = state.save;
  s.phase = 'ended';
  const rep = s.lastReport = computeSeasonReport();
  finAdd(leaguePrize(rep.userPos), `Premiação do Brasileirão (${rep.userPos}º)`);
  boardDelta((s.board.expect - rep.userPos) * 2.5 + (rep.userPos === 1 ? 20 : 0));
  addNews(`Fim da temporada ${s.season}! Você terminou em ${rep.userPos}º (a meta era ~${s.board.expect}º). Veja o resumo no Início.`, 'info');
  checkBoard(true);
}
function computeSeasonReport(){
  const st = standings(), s = state.save, top = topScorers('L', 1)[0];
  return {
    season: s.season,
    champion: st[0].id, libertadores: st.slice(0, 6).map(r => r.id), relegated: st.slice(-4).map(r => r.id),
    userPos: st.findIndex(r => r.id === s.userTeamId) + 1, userPts: (st.find(r => r.id === s.userTeamId) || {}).P,
    topScorer: top ? { name: top.p.name, team: top.team.short, goals: top.g } : null,
    cdbChampion: s.cups && s.cups.cdb.champion, libChampion: s.cups && s.cups.lib.champion
  };
}
// Evolução anual por idade (o crescimento dos jovens vem principalmente do treino semanal).
function evolvePlayer(p, r){
  const a = p.age; let d;
  if (a <= 20) d = r.int(0, 3); else if (a <= 23) d = r.int(-1, 2); else if (a <= 27) d = r.int(-1, 2);
  else if (a <= 30) d = r.int(-2, 1); else if (a <= 32) d = r.int(-4, 0); else d = r.int(-6, -1);
  if (a <= 23 && p.apps >= 15) d += 1;
  if (p.pot != null && d > 0 && p.ovr + d > p.pot + 1) d = Math.max(0, p.pot + 1 - p.ovr);
  const before = p.ovr;
  setPlayerOverall(p, p.ovr + d, false);
  p.age++;
  return p.ovr - before;
}
// Vira a temporada: acesso/rebaixamento, evolução, copas, mercado e base.
function startNextSeason(){
  const s = state.save, rep = s.lastReport || computeSeasonReport();
  s.history.push({ season: s.season, champion: T(rep.champion).name, userTeam: userTeam() ? userTeam().name : '', userPos: rep.userPos, topScorer: rep.topScorer,
    cdb: rep.cdbChampion ? T(rep.cdbChampion) && T(rep.cdbChampion).name : null, lib: rep.libChampion ? T(rep.libChampion) && T(rep.libChampion).name : null });
  Hooks.run('seasonEnd', { report: rep });
  const userRelegated = rep.relegated.includes(s.userTeamId);
  // vagas na próxima Libertadores: G6 + campeões das copas (até 8 brasileiros)
  const libQ = rep.libertadores.filter(id => !rep.relegated.includes(id));
  for (const c of [rep.cdbChampion, rep.libChampion]) if (c && T(c) && T(c).kind !== 'ext' && !libQ.includes(c) && !rep.relegated.includes(c)) libQ.push(c);
  s.libQualified = libQ.slice(0, 8);
  // 1) rebaixados descem (continuam existindo e disputam a Copa do Brasil)
  s.league = s.league.filter(id => !rep.relegated.includes(id));
  rep.relegated.forEach(id => { T(id).kind = 'br2'; });
  const promoted = [];
  const names = new Set(s.league.map(id => deaccent(T(id).name)));
  for (const raw of s.pendingPromoted || []){
    if (promoted.length >= 4) break;
    const t = normalizeTeam(raw, s.season + 1);
    if (t && !names.has(deaccent(t.name))){ t.kind = 'br'; promoted.push(t); names.add(deaccent(t.name)); }
  }
  s.pendingPromoted = [];
  // os demais vêm dos clubes de divisões inferiores (os mais fortes têm mais chance)
  const pr = makeRng(s.seed + '|promo|' + s.season);
  const pool = Object.values(s.teams).filter(t => t.kind === 'br2' && !rep.relegated.includes(t.id) && !names.has(deaccent(t.name)));
  while (promoted.length < 4 && pool.length){
    const t = pr.weighted(pool, x => Math.pow(teamOvr(x) - 55, 2));
    pool.splice(pool.indexOf(t), 1); t.kind = 'br'; promoted.push(t);
  }
  while (promoted.length < 4){
    const [n, tla, c] = PROMOTION_POOL.find(([n]) => !names.has(deaccent(n)) && !s.teams['t' + hashStr('gen|' + n)]) || ['Clube ' + promoted.length, 'CLB', ['#555','#ddd']];
    const t = generateClub(n, tla, c, 65, 'p' + s.season); promoted.push(t); names.add(deaccent(n));
  }
  promoted.forEach(t => { s.teams[t.id] = t; s.league.push(t.id); });
  // 2) evolução, aposentadorias e reposição pela base (todos os clubes)
  const evo = [];
  const r = makeRng(s.seed + '|evo|' + s.season);
  for (const team of Object.values(s.teams)){
    delete team._formCache;
    const keep = [];
    for (const p of team.squad){
      const retire = p.age >= 38 || (p.age >= 35 && r.next() < (p.age - 34) * 0.28);
      if (retire){
        const y = generatePlayer(team, p.pos, r.int(17, 19), `${team.id}|base|${s.season}|${p.id}`, -10, team.kind === 'ext');
        y.youth = true; keep.push(y);
        if (team.id === s.userTeamId) evo.push(`${p.name} se aposentou.`);
        continue;
      }
      const d = evolvePlayer(p, r);
      if (team.id === s.userTeamId && Math.abs(d) >= 3) evo.push(`${p.name} ${d > 0 ? '+' : ''}${d} (agora ${p.ovr}).`);
      Object.assign(p, { apps: 0, goals: 0, assists: 0, yellow: 0, red: 0, yAcc: 0, starts: 0, suspension: 0, fitness: 100, morale: 70, cg: { cdb: 0, lib: 0 }, injury: Math.max(0, (p.injury || 0) - 6) });
      keep.push(p);
    }
    team.squad = keep;
    if (team.id !== s.userTeamId) aiSquadMaintenance(team);
  }
  // 3) nova temporada
  s.season++; s.round = 0; s.day = 0; s.phase = 'season'; s.lastReport = null;
  s.fixtures = generateFixtures(s.league, s.seed + ':' + s.season, s.season);
  s.calendar = buildCalendar(true);
  ensureLowerClubs();
  s.cups = newCups();
  s.market.free = generateFreeAgents().concat((s.market.free || []).filter(p => p.released && p.age < 34).slice(0, 10));
  s.market.offers = [];
  s.trainLog = [];
  addNews(`Subiram para a Série A: ${promoted.map(t => t.short).join(', ')}.`, 'info');
  if (userRelegated){
    s.phase = 'choose-club'; s.userTeamId = null; s.tactic = null;
    addNews('Seu clube foi rebaixado e a diretoria encerrou seu contrato. Escolha um novo clube na Série A.', 'bad');
  } else {
    const ut = userTeam();
    for (const p of ut.squad) p.listed = false;
    if (evo.length) addNews('Evolução do elenco: ' + evo.slice(0, 8).join(' '), 'info');
    youthNewSeason();
    s.board.expect = expectedPosition(ut.id);
    s.board.conf = clamp(s.board.conf, 35, 85);
    if (s.cups.lib.teams.includes(ut.id)) finAdd(PRIZE.lib.G, 'Participação na Libertadores');
    addNews(`Meta da diretoria para ${s.season}: terminar por volta do ${s.board.expect}º lugar.`, 'info');
    validateUserLineup();
  }
  saveGame();
}
function chooseNewClub(teamId){
  const s = state.save; s.userTeamId = teamId; s.phase = 'season';
  setupClubForUser(T(teamId), false);
  addNews(`Você assumiu o ${T(teamId).name}. Meta: terminar por volta do ${s.board.expect}º lugar.`, 'good');
  saveGame();

/* ═══ 9b. FINANÇAS E MERCADO ═══════════════════════════════════════
   Valores em R$ milhões. Salários são por temporada e pagos a cada
   rodada da liga (1/38). Receitas: TV, bilheteria e premiações.
   Janelas: pré-temporada (rodadas 1–4), meio do ano (18–21) e férias. */
const round1 = v => Math.round(v * 10) / 10;
const fmtM = v => (v < 0 ? '−' : '') + 'R$ ' + String(round1(Math.abs(v))).replace('.', ',') + ' mi';
function initialBalance(team){ return round1(10 + Math.pow(Math.max(0, team.rep - 62), 2) * 0.35); }
function playerValue(p){
  const ageF = p.age <= 21 ? 1.45 : p.age <= 24 ? 1.25 : p.age <= 28 ? 1 : p.age <= 30 ? 0.75 : p.age <= 32 ? 0.5 : p.age <= 34 ? 0.3 : 0.15;
  const potF = p.age <= 23 ? 1 + Math.max(0, potentialOf(p) - p.ovr) * 0.03 : 1;
  return Math.max(0.1, round1(1.5 * Math.exp(0.14 * (p.ovr - 60)) * ageF * potF));
}
const defaultWage = p => Math.round((0.12 + 0.2 * Math.exp(0.14 * (p.ovr - 60))) * 100) / 100;
const wageOf = p => p.wage != null ? p.wage : defaultWage(p);
const wageBill = team => team.squad.reduce((s, p) => s + wageOf(p), 0);
const tvIncome = team => round1(0.12 + Math.max(0, team.rep - 55) * 0.025);
const gateIncome = (team, comp) => round1(Math.max(0.2, (team.rep - 50) * 0.05) * (comp === 'lib' ? 1.6 : comp === 'cdb' ? 1.3 : 1));
function finAdd(amount, text){
  const s = state.save; if (!s.fin || !amount) return;
  s.fin.balance = round1(s.fin.balance + amount);
  s.fin.log.unshift({ season: s.season, round: s.round, text, amount: round1(amount) });
  s.fin.log.length = Math.min(s.fin.log.length, 80);
}
function windowOpen(){ const s = state.save; return s.phase === 'ended' || s.round < 4 || (s.round >= 17 && s.round < 21); }
function windowText(){
  const s = state.save;
  if (windowOpen()) return s.phase === 'ended' ? 'Janela aberta (férias)' : s.round < 4 ? `Janela aberta até a rodada ${4}` : 'Janela aberta até a rodada 21';
  return s.round < 17 ? 'Janela fechada · reabre na rodada 18' : 'Janela fechada · reabre nas férias';
}
// Titulares pedem mais caro.
function askingPrice(p, team){
  if (!team) return 0;
  const key = team.squad.slice().sort((a, b) => b.ovr - a.ovr).slice(0, 13).includes(p);
  return round1(playerValue(p) * (key ? 1.4 : 1.1));
}
function wageDemand(p, from, to){
  const gap = from ? Math.max(0, from.rep - to.rep) : 0;
  return Math.round(defaultWage(p) * (1 + gap * 0.05) * (from ? 1.1 : 1.15) * 100) / 100;
}
function generateFreeAgents(){
  const s = state.save, r = makeRng(s.seed + '|free|' + s.season), out = [];
  const pseudo = { rep: 64, id: 'free' };
  for (let i = 0; i < 26; i++){
    const pos = r.pick(['GOL','ZAG','ZAG','LAT','LAT','VOL','VOL','MEI','MEI','ATA','ATA','ATA']);
    const p = generatePlayer(pseudo, pos, r.int(21, 34), `free|${s.season}|${i}`, r.int(-6, 5));
    p.free = true; out.push(p);
  }
  return out;
}
// Procura um jogador em qualquer clube (ou entre os livres).
function locatePlayer(pid){
  const s = state.save;
  for (const t of Object.values(s.teams)){ const p = t.squad.find(x => x.id === pid); if (p) return { p, team: t }; }
  const f = s.market.free.find(x => x.id === pid);
  return f ? { p: f, team: null } : null;
}
function movePlayer(p, from, to){
  const s = state.save;
  if (from) from.squad = from.squad.filter(x => x !== p); else s.market.free = s.market.free.filter(x => x !== p);
  p.listed = false; p.free = false; p.released = false; p.morale = 74; p.ovrManual = p.ovrManual || false;
  if (to){ to.squad.push(p); delete to._formCache; }
  if (from){ delete from._formCache; if (from.id !== s.userTeamId) aiSquadMaintenance(from); }
  if (to && to.id !== s.userTeamId) aiSquadMaintenance(to);
}
// IA mantém elenco entre 22 e 32 (contrata livres ou dispensa os piores).
function aiSquadMaintenance(team){
  const s = state.save;
  while (team.squad.length > 32){
    const worst = team.squad.slice().sort((a, b) => a.ovr - b.ovr)[0];
    team.squad = team.squad.filter(x => x !== worst); worst.free = true; worst.released = true; s.market.free.push(worst);
  }
  if (team.squad.length < 22) fillSquad(team, s.season);
}
// Proposta do usuário. Devolve { ok, msg }.
function makeOffer(pid, fee, wage){
  const s = state.save, ut = userTeam(), loc = locatePlayer(pid);
  if (!loc) return { ok: false, msg: 'Jogador não encontrado.' };
  const { p, team } = loc;
  if (!windowOpen()) return { ok: false, msg: 'A janela de transferências está fechada.' };
  if (team && team.id === ut.id) return { ok: false, msg: 'Ele já é seu jogador.' };
  if (ut.squad.length >= 32) return { ok: false, msg: 'Elenco cheio (máx. 32). Venda ou dispense alguém antes.' };
  if (fee > s.fin.balance) return { ok: false, msg: `Caixa insuficiente: você tem ${fmtM(s.fin.balance)}.` };
  if (team){
    const ask = askingPrice(p, team);
    if (team.squad.length <= 20) return { ok: false, msg: `O ${team.short} não quer vender: elenco curto.` };
    if (fee < ask) return { ok: false, msg: `O ${team.short} recusou. Pedem pelo menos ${fmtM(ask)}.` };
    if (team.rep - ut.rep > 7 && p.ovr >= 78) return { ok: false, msg: `${p.name} não quer deixar o ${team.short} para jogar num clube menor.` };
  }
  const demand = wageDemand(p, team, ut);
  if (wage < demand) return { ok: false, msg: `${p.name} recusou o salário. Quer pelo menos ${fmtM(demand)} por temporada.` };
  if (fee > 0) finAdd(-fee, `Contratação: ${p.name}${team ? ' (' + team.short + ')' : ''}`);
  movePlayer(p, team, ut); p.wage = Math.round(wage * 100) / 100;
  addNews(`✍️ Contratado: ${p.name} (${p.pos}, ${p.ovr}) ${team ? 'do ' + team.short + ' por ' + fmtM(fee) : 'sem custo de transferência'}.`, 'good');
  saveGame();
  return { ok: true, msg: `${p.name} é o novo reforço!` };
}
function acceptOffer(offerId){
  const s = state.save, ut = userTeam(), o = s.market.offers.find(x => x.id === offerId);
  if (!o) return 'Proposta expirou.';
  const p = findPlayer(ut, o.pid), buyer = T(o.from);
  s.market.offers = s.market.offers.filter(x => x !== o);
  if (!p || !buyer) return 'Proposta inválida.';
  if (ut.squad.length <= 18) return 'Elenco mínimo é 18 jogadores. Contrate antes de vender.';
  finAdd(o.amount, `Venda: ${p.name} (${buyer.short})`);
  movePlayer(p, ut, buyer);
  s.promises = s.promises.filter(x => x.pid !== p.id);
  validateUserLineup();
  addNews(`💰 ${p.name} foi vendido ao ${buyer.short} por ${fmtM(o.amount)}.`, 'info');
  saveGame();
  return null;
}
function releasePlayer(pid){
  const s = state.save, ut = userTeam(), p = findPlayer(ut, pid);
  if (!p) return 'Jogador não encontrado.';
  if (ut.squad.length <= 18) return 'Elenco mínimo é 18 jogadores.';
  const cost = round1(wageOf(p) * 0.5);
  if (cost > s.fin.balance) return `Rescisão custa ${fmtM(cost)} e o caixa não cobre.`;
  finAdd(-cost, `Rescisão: ${p.name}`);
  ut.squad = ut.squad.filter(x => x !== p); delete ut._formCache;
  p.free = true; p.released = true; p.listed = false; p.wage = null; s.market.free.push(p);
  s.promises = s.promises.filter(x => x.pid !== p.id);
  validateUserLineup(); addNews(`${p.name} teve o contrato rescindido.`, 'info'); saveGame();
  return null;
}
// Propostas da IA pelos jogadores do usuário (rodam a cada rodada com janela aberta).
function generateOffers(){
  const s = state.save, ut = userTeam(), r = makeRng(`${s.seed}|offers|${s.season}|${s.round}`);
  s.market.offers = s.market.offers.filter(o => o.until > s.round && findPlayer(ut, o.pid));
  if (!windowOpen()) return;
  const buyers = s.league.filter(id => id !== ut.id);
  const strength = teamOvr(ut);
  for (const p of ut.squad){
    if (s.market.offers.length >= 4) break;
    if (s.market.offers.some(o => o.pid === p.id)) continue;
    const chance = p.listed ? 0.5 : (p.ovr >= strength + 1 ? 0.035 : 0);
    if (!r.chance(chance)) continue;
    const from = r.pick(buyers);
    const amount = round1(playerValue(p) * (p.listed ? r.range(0.8, 1.12) : r.range(1.05, 1.4)));
    s.market.offers.push({ id: 'o' + hashStr(p.id + s.round + from), pid: p.id, from, amount, until: s.round + 2 });
    addNews(`📨 O ${T(from).short} ofereceu ${fmtM(amount)} por ${p.name}. Responda no Início.`, 'info');
  }
}

/* ═══ 9c. TREINO E CATEGORIAS DE BASE ═════════════════════════════
   Treino semanal (a cada rodada da liga): jogadores jovens crescem em
   direção ao potencial; o foco melhora atributos específicos; a
   intensidade acelera o crescimento, mas recupera menos e lesiona mais. */
const FOCUS = {
  equil:   { label: 'Equilibrado', attrs: ['fin','pas','dri','mar','fis'] },
  ataque:  { label: 'Finalização', attrs: ['fin','dri'] },
  criacao: { label: 'Criação', attrs: ['pas','dri'] },
  defesa:  { label: 'Defesa', attrs: ['mar','fis'] },
  fisico:  { label: 'Físico', attrs: ['fis'] },
  goleiros:{ label: 'Goleiros', attrs: ['gol'] }
};
const INTENSITY = {
  leve:    { label: 'Leve', grow: 0.75, rec: 5, inj: 0.0005 },
  normal:  { label: 'Normal', grow: 1, rec: 0, inj: 0.0015 },
  intensa: { label: 'Intensa', grow: 1.3, rec: -5, inj: 0.005 }
};
function potentialOf(p){
  if (p.pot == null){
    const r = makeRng('pot|' + p.name + '|' + p.pos);
    p.pot = clamp(Math.round(p.ovr + Math.max(0, 24 - p.age) * r.range(0.6, 1.9)), p.ovr, 92);
  }
  return p.pot;
}
const growthRate = age => age <= 17 ? 0.2 : age <= 19 ? 0.16 : age <= 21 ? 0.12 : age <= 23 ? 0.08 : age <= 26 ? 0.035 : 0;
function trainPlayer(p, focus, inten, r, log){
  if (p.injury > 0) return;
  const s = state.save;
  const played = p.lastDay != null && s.day - p.lastDay <= 2;
  p.tp = (p.tp || 0) + growthRate(p.age) * inten.grow * (played ? 1.3 : 1);
  if (p.tp >= 1){
    if (p.ovr < potentialOf(p)){
      p.tp -= 1;
      setPlayerOverall(p, p.ovr + 1, false);
      if (log) log(p);
    } else p.tp = 1;
  }
  // ganho fino no atributo do foco
  const attrs = focus.attrs.filter(a => a !== 'gol' || p.pos === 'GOL');
  if (attrs.length && p.age <= 31 && r.chance(0.07 * inten.grow)){
    const a = r.pick(attrs);
    if (p.attr[a] < p.ovr + 18) p.attr[a] = Math.min(99, p.attr[a] + 1);
  }
}
function weeklyTraining(){
  const s = state.save, r = makeRng(`${s.seed}|treino|${s.season}|${s.round}`);
  for (const t of Object.values(s.teams)){
    const mine = t.id === s.userTeamId;
    const focus = FOCUS[mine ? s.training.focus : 'equil'], inten = INTENSITY[mine ? s.training.intensity : 'normal'];
    for (const p of t.squad){
      trainPlayer(p, focus, inten, r, mine ? x => { s.trainLog.unshift({ name: x.name, ovr: x.ovr, round: s.round + 1 }); s.trainLog.length = Math.min(s.trainLog.length, 30); } : null);
      if (mine && !p.injury && r.chance(inten.inj)){
        p.injury = r.int(1, 3);
        addNews(`🚑 ${p.name} se machucou no treino (${p.injury} sem.).`, 'bad');
      }
    }
  }
  for (const y of s.youth.players) trainPlayer(y, FOCUS.equil, INTENSITY.normal, r, null);
}
function generateProspects(n){
  const s = state.save, lvl = s.youth.level, r = makeRng(`${s.seed}|base|${s.season}|${s.userTeamId}|${(s.youth.players || []).length}|${n}`);
  const team = userTeam() || { rep: 68, id: 'base' };
  const out = [];
  for (let i = 0; i < n; i++){
    const pos = r.pick(['GOL','ZAG','ZAG','LAT','VOL','MEI','MEI','ATA','ATA']);
    const p = generatePlayer(team, pos, r.int(16, 17), `base|${s.seed}|${s.season}|${team.id}|${i}|${lvl}|${r.next()}`);
    setPlayerOverall(p, r.int(42, 53) + lvl * 2, false);
    p.baseOvr = p.ovr; p.pot = clamp(Math.round(r.int(62, 79) + lvl * 2.5), p.ovr + 8, 92);
    p.youth = true; p.wage = 0.05;
    out.push(p);
  }
  return out;
}
// Potencial "estimado" pelos olheiros: faixa que estreita com uma base melhor.
function potRange(p){
  const lvl = state.save.youth.level, fuzz = 6 - lvl, r = makeRng('olheiro|' + p.id);
  const c = potentialOf(p) + r.int(-fuzz, fuzz);
  return [clamp(c - fuzz, p.ovr, 92), clamp(c + fuzz, p.ovr, 92)];
}
function youthNewSeason(){
  const s = state.save, y = s.youth;
  for (const p of y.players) p.age++;
  const gone = y.players.filter(p => p.age >= 20);
  if (gone.length) addNews(`Base: ${gone.map(p => p.name).join(', ')} completaram 20 anos e deixaram o clube sem serem promovidos.`, 'info');
  y.players = y.players.filter(p => p.age < 20);
  const fresh = generateProspects(3 + (y.level >= 4 ? 1 : 0));
  y.players = y.players.concat(fresh).slice(-10);
  addNews(`Base: ${fresh.length} novos garotos chegaram ao sub-17. Avalie na aba Elenco → Base.`, 'info');
}
const youthUpgradeCost = lvl => lvl * 5;
function promoteYouth(pid){
  const s = state.save, ut = userTeam(), p = s.youth.players.find(x => x.id === pid);
  if (!p) return 'Jogador não encontrado.';
  if (ut.squad.length >= 32) return 'Elenco cheio (máx. 32).';
  s.youth.players = s.youth.players.filter(x => x !== p);
  p.wage = 0.15; p.morale = 80; ut.squad.push(p); delete ut._formCache;
  addNews(`🌱 ${p.name} (${p.pos}, ${p.age} anos) foi promovido ao profissional.`, 'good'); saveGame();
  return null;
}

/* ═══ 9d. DIRETORIA, IMPRENSA E CONVERSAS ═════════════════════════
   Confiança da diretoria (0–100): sobe e desce com resultados, metas e
   copas. Abaixo de 8 (depois da 10ª rodada) o técnico é demitido.
   Coletivas e conversas mexem na moral do elenco e de jogadores.       */
function boardDelta(v){ const b = state.save.board; b.conf = clamp(Math.round((b.conf + v) * 10) / 10, 0, 100); }
function checkBoard(seasonEnd){
  const s = state.save;
  if (!s.userTeamId || s.board.conf > 8 || (!seasonEnd && s.round < 10)) return;
  const old = userTeam();
  addNews(`A diretoria do ${old.short} perdeu a confiança e demitiu você. Escolha um novo clube.`, 'bad');
  s.firedFrom = old.id;
  if (s.phase === 'season'){ s.phase = 'choose-club'; s.userTeamId = null; s.tactic = null; s.resumePhase = 'season'; }
  else { s.pendingFire = true; }
}
const boardText = c => c >= 80 ? 'Excelente' : c >= 60 ? 'Boa' : c >= 40 ? 'Estável' : c >= 22 ? 'Pressionado' : 'Crítica';
function afterUserMatch(e, d){
  const s = state.save, us = e.fixture.h === s.userTeamId ? 0 : 1;
  const gf = e.score[us], ga = e.score[1 - us], opp = e.sides[1 - us].team;
  const res = gf > ga ? 1 : gf < ga ? -1 : 0;
  const diff = teamOvr(opp) - teamOvr(userTeam());
  if (d.t === 'L') boardDelta(res > 0 ? 1.4 + Math.max(0, diff) * 0.2 : res < 0 ? -1.4 + Math.max(0, diff) * 0.15 : Math.max(0, diff) * 0.15);
  const label = d.t === 'L' ? `R${d.r + 1}` : COMP_TAG[d.c];
  const word = res > 0 ? 'Vitória' : res < 0 ? 'Derrota' : 'Empate';
  addNews(`${label}: ${word} ${gf}×${ga} contra o ${opp.short}${e.pens ? ` (pênaltis ${e.pens[us]}×${e.pens[1 - us]})` : ''}.`, res > 0 ? 'good' : res < 0 ? 'bad' : 'info');
  // promessa feita na coletiva
  const pp = s.pressPromise;
  if (pp && pp.day === s.day){
    const ok = res > 0 || (e.pens && e.koWinner() === us);
    teamMorale(ok ? 4 : -5); boardDelta(ok ? 2 : -3);
    addNews(ok ? 'A promessa de vitória na coletiva foi cumprida: elenco confiante.' : 'Você prometeu vitória e não entregou. Imprensa e elenco cobram.', ok ? 'good' : 'bad');
    s.pressPromise = null;
  }
}
function teamMorale(v){ for (const p of userTeam().squad) p.morale = clamp(p.morale + v, 15, 100); }
// Rotina semanal: salários, TV, treino, mercado, promessas e humor do elenco.
function weeklyUpdate(){
  const s = state.save, ut = userTeam();
  weeklyTraining();
  if (!ut) return;
  finAdd(-round1(wageBill(ut) / 38), 'Folha salarial (semana)');
  finAdd(tvIncome(ut), 'Cotas de TV');
  if (s.fin.balance < -15) boardDelta(-1.5);
  generateOffers();
  for (const pr of s.promises.slice()){
    if (s.round + 1 < pr.until) continue;
    const p = findPlayer(ut, pr.pid);
    s.promises = s.promises.filter(x => x !== pr);
    if (!p) continue;
    const started = p.starts - pr.startsAt;
    if (started >= 3){ p.morale = clamp(p.morale + 6, 15, 100); addNews(`${p.name} ficou satisfeito: você cumpriu a promessa de titularidade.`, 'good'); }
    else { p.morale = clamp(p.morale - 20, 15, 100); boardDelta(-1); addNews(`${p.name} reclama publicamente: a promessa de titularidade não foi cumprida.`, 'bad'); }
  }
  for (const p of ut.squad){
    if (p.morale < 28 && !p.listed && p.complained !== s.season){
      p.complained = s.season;
      addNews(`😠 ${p.name} está insatisfeito com a situação e pede para ser negociado.`, 'bad');
    }
  }
}
// Perguntas da coletiva: cada resposta mexe na moral do elenco (team), de um jogador (player) ou na diretoria (board).
const PRESS = [
  { q: 'Como você avalia o momento da equipe?', a: [
    { t: 'Estamos no caminho certo, confio no grupo.', team: 2 },
    { t: 'Precisamos melhorar muito, não estou satisfeito.', team: -2, board: 1.5 },
    { t: 'Prefiro não comentar.', team: 0 }] },
  { q: 'O adversário de hoje é considerado favorito. O que esperar?', a: [
    { t: 'Respeitamos, mas vamos buscar a vitória.', team: 2 },
    { t: 'Eles são melhores no papel; vamos competir.', team: -1, board: 0.5 },
    { t: 'Vamos ganhar, pode escrever.', team: 4, promise: true }] },
  { q: 'A torcida pede reforços. O elenco é suficiente?', a: [
    { t: 'Confio neste elenco.', team: 3, board: -0.5 },
    { t: 'Estamos atentos ao mercado.', team: 0 },
    { t: 'Precisamos de reforços com urgência.', team: -3, board: 1 }] },
  { q: 'Muitos criticam {p}. Ele tem a sua confiança?', player: true, a: [
    { t: 'Confio totalmente nele.', player: 10 },
    { t: 'Ele sabe que precisa render mais.', player: -8, team: 1 },
    { t: 'Todos aqui são cobrados igualmente.', player: 0 }] },
  { q: 'Liga ou copas: qual é a prioridade?', a: [
    { t: 'Todas as competições são importantes.', team: 1 },
    { t: 'O foco é o Brasileirão.', board: 1 },
    { t: 'Queremos taça: as copas são a prioridade.', team: 2, board: -0.5 }] }
];
// Decide se haverá coletiva antes do jogo do usuário (sempre em decisões).
function maybePress(){
  const s = state.save, d = s.calendar[s.day];
  if (s.pressDone === s.day) return null;
  const decisive = d.t === 'C' && d.st !== 'G' && (d.i === 1 || d.st === 'F');
  const r = makeRng(`${s.seed}|press|${s.season}|${s.day}`);
  if (!decisive && !r.chance(0.35)) return null;
  const x = userMatchOfDay(d), opp = T(x.m.h === s.userTeamId ? x.m.a : x.m.h);
  let pool = PRESS.map((q, i) => i).filter(i => i !== 1 || teamOvr(opp) > teamOvr(userTeam()));
  const qi = r.pick(pool), q = PRESS[qi];
  let target = null;
  if (q.player){
    const xi = s.tactic.lineup.map(id => findPlayer(userTeam(), id)).filter(Boolean);
    target = xi.sort((a, b) => a.morale - b.morale)[0];
  }
  return { qi, pid: target ? target.id : null, text: q.q.replace('{p}', target ? target.name : 'o elenco') };
}
function answerPress(press, ai){
  const s = state.save, q = PRESS[press.qi], a = q.a[ai];
  if (a.team) teamMorale(a.team);
  if (a.board) boardDelta(a.board);
  if (a.player && press.pid){ const p = findPlayer(userTeam(), press.pid); if (p) p.morale = clamp(p.morale + a.player, 15, 100); }
  if (a.promise) s.pressPromise = { day: s.day };
  s.pressDone = s.day;
  addNews(`🎙️ Coletiva: "${a.t}"`, 'info');
  saveGame();
}
// Conversa individual com um jogador. Devolve o texto do resultado.
function talkToPlayer(pid, kind){
  const s = state.save, p = findPlayer(userTeam(), pid); if (!p) return '';
  const stamp = s.season * 100 + s.round;
  if (p.talk != null && stamp - p.talk < 3) return `${p.name} já conversou com você há pouco tempo.`;
  p.talk = stamp;
  const r = makeRng(`${s.seed}|talk|${pid}|${stamp}|${kind}`);
  let msg;
  if (kind === 'elogiar'){
    const good = p.lastDay != null && s.day - p.lastDay <= 2 && p.morale >= 50;
    const d = good ? 8 : 3; p.morale = clamp(p.morale + d, 15, 100);
    msg = good ? `${p.name} gostou do elogio e está motivado (+${d}).` : `${p.name} agradece, mas sem muito entusiasmo (+${d}).`;
  } else if (kind === 'cobrar'){
    const ok = p.morale >= 62 ? r.chance(0.7) : r.chance(0.25);
    const d = ok ? 5 : -7; p.morale = clamp(p.morale + d, 15, 100);
    msg = ok ? `${p.name} reagiu bem à cobrança (+${d}).` : `${p.name} não gostou da cobrança (${d}).`;
  } else {
    if (s.promises.some(x => x.pid === pid)) return `Você já prometeu titularidade a ${p.name}.`;
    p.morale = clamp(p.morale + 12, 15, 100);
    s.promises.push({ pid, startsAt: p.starts, until: s.round + 5 });
    msg = `${p.name} ficou animado (+12). Ele espera ser titular em pelo menos 3 das próximas 5 rodadas.`;
  }
  saveGame();
  return msg;
}

/* ═══ 10. PERSISTÊNCIA ════════════════════════════════════════════ */
function serializeSave(){
  return JSON.stringify(state.save, (k, v) => (k.startsWith('_') ? undefined : v));
}
function saveGame(){
  if (!state.save) return true;
  try { localStorage.setItem(K.save, serializeSave()); return true; }
  catch (e){ toast('Não foi possível salvar automaticamente (armazenamento cheio ou bloqueado). Exporte o save em Config.', true); return false; }
}
function loadGame(){
  const s = lsGet(K.save, null);
  if (!s || !s.teams || !s.fixtures) return null;
  return migrateSave(s);
}
// Converte saves antigos. v1 → v2: calendário por dias, finanças, mercado, base, diretoria.
// A temporada v1 em andamento termina sem copas; as próximas já têm tudo.
function migrateSave(s){
  if (!s.version || s.version < 2){
    s.version = 2;
    s.calendar = buildCalendar(false); s.day = s.round; s.cups = null; s.libQualified = null;
    Object.values(s.teams).forEach(t => { t.kind = t.kind || 'br'; t.squad.forEach(p => { p.cg = p.cg || { cdb: 0, lib: 0 }; p.starts = p.starts || 0; p.yAcc = p.yAcc || 0; p.tp = p.tp || 0; }); });
    const prev = state.save; state.save = s;
    const ut = T(s.userTeamId);
    s.fin = { balance: ut ? initialBalance(ut) : 20, log: [] };
    s.market = { free: generateFreeAgents(), offers: [] };
    s.training = { focus: 'equil', intensity: 'normal' }; s.trainLog = [];
    s.youth = { level: ut && ut.rep >= 74 ? 3 : 2, players: [] };
    if (ut) s.youth.players = generateProspects(3);
    s.board = { conf: 60, expect: ut ? expectedPosition(ut.id) : 10 }; s.promises = [];
    state.save = prev;
    delete s.future;
  }
  s.pendingPromoted = s.pendingPromoted || [];
  s.market = s.market || { free: [], offers: [] };
  s.promises = s.promises || [];
  s.trainLog = s.trainLog || [];
  return s;
}
function validateImportedSave(obj){
  if (!obj || typeof obj !== 'object' || !obj.teams || !Array.isArray(obj.fixtures) || !Array.isArray(obj.league)) throw new Error('Arquivo não é um save do Prancheta.');
  return migrateSave(obj);
}
function downloadJson(obj, filename){
  const blob = new Blob([typeof obj === 'string' ? obj : JSON.stringify(obj, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ═══ 11. GANCHOS DE EXTENSÃO ═════════════════════════════════════
   Para novos módulos sem mexer no núcleo:
     Hooks.on('afterMatch', ({engine, fixture, day}) => …)
     Hooks.on('afterDay',   ({day}) => …)
     Hooks.on('seasonEnd',  ({report}) => …)                            */
const Hooks = {
  map: {},
  on(evt, fn){ (this.map[evt] = this.map[evt] || []).push(fn); },
  run(evt, payload){ for (const fn of this.map[evt] || []) { try { fn(payload); } catch (e){ console.error('hook', evt, e); } } }
};

function cupStatus(c){
  const s = state.save, cup = s.cups && s.cups[c], uid = s.userTeamId;
  if (!cup || !cup.teams.includes(uid)) return null;
  if (cup.champion === uid) return '🏆 Campeão!';
  for (const st of CUP_ORDER[c]){
    if (st === 'G'){
      const gi = cup.groups.findIndex(g => g.ids.includes(uid));
      const pos = groupTable(cup.groups[gi]).findIndex(r => r.id === uid) + 1;
      if (!cup.ko.R16) return `Grupo ${String.fromCharCode(65 + gi)} · ${pos}º lugar`;
      if (!cup.ko.R16.some(t => t.a === uid || t.b === uid)) return `Eliminado na fase de grupos`;
      continue;
    }
    const ties = cup.ko[st]; if (!ties) break;
    const t = ties.find(x => x.a === uid || x.b === uid); if (!t) break;
    if (!t.w) return STAGE_NAME[st];
    if (t.w !== uid) return `Eliminado: ${STAGE_NAME[st].toLowerCase()}`;
  }
  return '—';
}

function renderSquadTab(){

function renderSquad(team){
  const s = state.save, mine = team.id === s.userTeamId;

  const sorters = {
    pos: (a, b) => POS_ORDER[a.pos] - POS_ORDER[b.pos] || b.ovr - a.ovr,
    ovr: (a, b) => b.ovr - a.ovr || POS_ORDER[a.pos] - POS_ORDER[b.pos],
    idade: (a, b) => a.age - b.age || b.ovr - a.ovr,
    cond: (a, b) => a.fitness - b.fitness,
    gols: (a, b) => b.goals - a.goals || b.ovr - a.ovr
  };
  const list = team.squad.slice().sort(sorters[state.ui.squadSort] || sorters.pos);
  let h = mine ? '' : `<div class="row between mb"><div class="row">${crestSVG(team, 32)}<h2 style="margin:0">${esc(team.short)}</h2></div><button class="btn sm" data-act="viewTeam" data-id="">Meu elenco</button></div>`;

function renderMarket(){

function renderTactics(){
  const s = state.save, team = userTeam(); validateUserLineup();
  const t = s.tactic, slots = FORMATIONS[t.formation], sel = state.ui.tacSel;
  const r = teamStrengthFromLineup(team, t.formation, t.lineup);
  const inXI = new Set(t.lineup);
  let pitch = `<div class="pitch" id="pitch"><svg class="lines" viewBox="0 0 68 92" preserveAspectRatio="none"><g fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".4"><rect x="1" y="1" width="66" height="90"/><line x1="1" y1="46" x2="67" y2="46"/><circle cx="34" cy="46" r="7"/><rect x="18" y="1" width="32" height="13"/><rect x="18" y="78" width="32" height="13"/><rect x="27" y="1" width="14" height="5"/><rect x="27" y="86" width="14" height="5"/></g></svg>`;
  slots.forEach(([role, x, y], i) => {
    const p = findPlayer(team, t.lineup[i]);
    const c = p ? COMPAT[p.pos][role] : 0;
    const cls = !p ? 'empty' : c < 0.7 ? 'vbad' : c < 0.95 ? 'bad' : '';
    pitch += `<div class="slot ${cls} ${sel && sel.kind === 'slot' && sel.id == i ? 'sel' : ''}" style="left:${x}%;top:${y}%" data-drag="slot" data-drop="slot" data-slot="${i}">
      <div class="dot" style="color:${p ? (p.fitness < 70 ? 'var(--warn)' : '#fff') : '#888'}">${p ? p.ovr : '+'}</div><div class="nm">${p ? esc(shortP(p).split(' ').pop()) : '—'}</div><div class="rl">${role}${p && p.pos !== role ? ' (' + p.pos + ')' : ''}</div></div>`;
  });
  pitch += '</div>';
  const res = team.squad.filter(p => !inXI.has(p.id)).sort((a, b) => (isAvailable(b) - isAvailable(a)) || POS_ORDER[a.pos] - POS_ORDER[b.pos] || b.ovr - a.ovr);
  const slider = (k, label, txt) => `<div class="slider"><div class="row"><b>${label}</b><span class="muted" id="lbl_${k}">${txt(t[k])}</span></div><input type="range" min="0" max="100" step="5" value="${t[k]}" data-input="tactic" data-k="${k}" aria-label="${label}"></div>`;
  return `<div class="row between"><h2 style="margin:0">Tática</h2><button class="btn sm" data-act="autoXI">Escalar automaticamente</button></div>
    <div class="seg mt">${Object.keys(FORMATIONS).map(f => `<button class="chip ${t.formation === f ? 'on' : ''}" data-act="formation" data-f="${f}">${f}</button>`).join('')}</div>
    <p class="tiny muted" style="margin:-4px 0 10px">Arraste jogadores (ou toque em um e depois no destino) para trocar. Borda amarela/vermelha = fora de posição. Lesionados e suspensos não podem ser escalados.</p>
    ${pitch}
    <div class="strength"><div><small class="muted">Ataque</small><b>${r.atk.toFixed(0)}</b></div><div><small class="muted">Meio</small><b>${r.mid.toFixed(0)}</b></div><div><small class="muted">Defesa</small><b>${r.def.toFixed(0)}</b></div></div>
    <div class="card">${slider('mentality', 'Mentalidade', mentalityLabel)}${slider('pressure', 'Pressão', v => levelLabel(v, 'Baixa', 'Média', 'Alta') + ' · cansa ' + levelLabel(v, 'menos', 'normal', 'mais'))}${slider('tempo', 'Ritmo', v => levelLabel(v, 'Lento', 'Normal', 'Rápido'))}
      <p class="tiny muted" style="margin:0">Ofensiva cria mais chances e expõe a defesa. Pressão alta ganha o meio, mas cansa e gera faltas. Ritmo rápido acelera o jogo para os dois lados.</p></div>
    <h3>Reservas (${res.length})</h3><div class="plist" id="reserves">${res.map(p => isAvailable(p)
      ? `<div class="rrow ${sel && sel.kind === 'res' && sel.id === p.id ? 'sel' : ''}" data-drag="res" data-drop="res" data-pid="${p.id}"><span class="handle" aria-hidden="true">⠿</span><span class="pos ${p.pos}">${p.pos}</span><span class="grow ell"><b>${esc(p.name)}</b><br><span class="tiny muted">${p.age} anos · ${p.fitness}% · ${moraleIcon(p.morale)}</span></span><span class="ovr ${ovrClass(p.ovr)}">${p.ovr}</span></div>`
      : `<div class="rrow" style="opacity:.5"><span class="handle"></span><span class="pos ${p.pos}">${p.pos}</span><span class="grow ell"><b>${esc(p.name)}</b><br>${statusTag(p)}</span><span class="ovr">${p.ovr}</span></div>`).join('')}</div>`;
}

function fixtureRow(m, uid, scorers){
  const H = T(m.h), A = T(m.a); if (!H || !A) return '';
  const played = m.hg != null;
  let g = '';
  if (scorers && played && m.goals && m.goals.length){
    const side = k => m.goals.filter(x => x.s === k).map(x => `${esc(x.n.split(' ').pop())} ${x.m}'${x.p ? ' (p)' : ''}`).join(', ');
    g = `<div class="tiny muted" style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-2px"><span style="text-align:right">${side(0)}</span><span>${side(1)}</span></div>`;
  }
  const pens = played && m.pens ? `<div class="tiny muted center" style="grid-column:1/-1;margin-top:-4px">Pênaltis: ${m.pens[0]}×${m.pens[1]}</div>` : '';
  return `<div class="fx ${m.h === uid || m.a === uid ? 'mine' : ''}"><div class="h"><span class="ell">${esc(H.short)}</span>${crestSVG(H, 22)}</div><div class="sc">${played ? `${m.hg} – ${m.ag}` : '×'}</div><div class="a">${crestSVG(A, 22)}<span class="ell">${esc(A.short)}</span></div>${g}${pens}</div>`;
}
function tieRow(t, uid){
  const A = T(t.a), B = T(t.b); if (!A || !B) return '';
  const agg = tieAggregate(t), any = t.legs.some(l => l.hg != null);
  const legs = t.legs.map((l, i) => l.hg != null ? `${t.legs.length > 1 ? (i ? 'Volta' : 'Ida') + ': ' : ''}${T(l.h).tla} ${l.hg}×${l.ag} ${T(l.a).tla}` : `${t.legs.length > 1 ? (i ? 'Volta' : 'Ida') + ': ' : ''}${T(l.h).tla} × ${T(l.a).tla}`).join(' · ');
  const b = id => t.w === id ? 'font-weight:800;color:var(--accent)' : t.w ? 'opacity:.6' : '';
  return `<div class="fx ${t.a === uid || t.b === uid ? 'mine' : ''}"><div class="h"><span class="ell" style="${b(t.a)}">${esc(A.short)}</span>${crestSVG(A, 22)}</div><div class="sc">${any ? `${agg[0]} – ${agg[1]}` : '×'}</div><div class="a">${crestSVG(B, 22)}<span class="ell" style="${b(t.b)}">${esc(B.short)}</span></div>
    <div class="tiny muted center" style="grid-column:1/-1;margin-top:-4px">${legs}${t.pens ? ` · pênaltis ${Math.max(...t.pens)}×${Math.min(...t.pens)}` : ''}</div></div>`;
}
function renderCupKO(c){
  const s = state.save, cup = s.cups && s.cups[c], uid = s.userTeamId;
  if (!cup) return '<div class="empty">Esta competição começa na próxima temporada.</div>';
  const stages = CUP_ORDER[c].filter(st => st !== 'G' && cup.ko[st]);
  if (!stages.length) return '<div class="empty">O mata-mata começa depois da fase de grupos.</div>';
  const cur = stages.includes(state.ui.fxStage) ? state.ui.fxStage : stages[stages.length - 1];
  let h = chipRow(stages.map(st => [st, STAGE_NAME[st].replace(' de final', '')]), cur, 'fxStage');
  h += `<div class="card" style="padding:4px 10px">${cup.ko[cur].map(t => tieRow(t, uid)).join('')}</div>`;
  if (cup.champion) h += `<div class="ok-box center">🏆 Campeão: <b>${esc(T(cup.champion).name)}</b></div>`;
  return h;
}
function renderLibGroups(withMatches){
  const s = state.save, cup = s.cups && s.cups.lib, uid = s.userTeamId;
  if (!cup) return '<div class="empty">A Libertadores começa na próxima temporada.</div>';
  const order = cup.groups.map((g, i) => i).sort((a, b) => cup.groups[b].ids.includes(uid) - cup.groups[a].ids.includes(uid));
  return order.map(gi => {
    const g = cup.groups[gi], rows = groupTable(g);
    let h = `<h3>Grupo ${String.fromCharCode(65 + gi)}</h3><div class="card" style="padding:6px 8px"><table class="tbl"><thead><tr><th>#</th><th style="text-align:left">Clube</th><th>P</th><th>J</th><th>V</th><th>SG</th></tr></thead><tbody>${rows.map((r, i) => `<tr class="${i < 2 ? 'g6' : ''} ${r.id === uid ? 'me' : ''} click" data-act="viewTeam" data-id="${r.id}"><td><span class="posn">${i + 1}</span></td><td class="team"><span class="row" style="gap:7px">${crestSVG(T(r.id), 18)}<span class="ell" style="max-width:130px">${esc(T(r.id).short)}</span></span></td><td><b>${r.P}</b></td><td>${r.J}</td><td>${r.V}</td><td>${r.SG > 0 ? '+' : ''}${r.SG}</td></tr>`).join('')}</tbody></table>`;
    if (withMatches) h += g.md.map((md, i) => `<div class="tiny muted" style="margin-top:6px">${i + 1}ª rodada</div>` + md.map(m => fixtureRow(m, uid)).join('')).join('');

}
function renderFixtures(){
  const s = state.save, uid = s.userTeamId, c = state.ui.fxComp;

}
function renderTable(){
  const mode = state.ui.tableMode;

// Antes do jogo: simula os dias dos outros, coletiva (às vezes) e pré-jogo.
function goToMatch(){
  const n = simulateUntilUserDay();
  if (state.save.phase !== 'season'){ render(); return false; }
  if (n) toast(`${n} dia${n > 1 ? 's' : ''} de outras partidas simulado${n > 1 ? 's' : ''}.`);
  render();
  return true;
}
function openPress(press){
  state.ui.press = press;
  const q = PRESS[press.qi];
  openModal(`<div class="muted small">🎙️ Coletiva de imprensa</div><h2 style="margin-top:6px">"${esc(press.text)}"</h2>

}
function openPrematch(){
  const s = state.save, t = userTeam();
  const removed = validateUserLineup();
  const d = s.calendar[s.day], x = userMatchOfDay(d), f = x.m;
  const home = f.h === t.id, opp = T(home ? f.a : f.h);

  const ot = aiTactic(opp, t, matchSeed(f) + (home ? 2 : 1)), or = teamStrengthFromLineup(opp, ot.formation, ot.lineup);

    <div class="fx" style="border:0"><div class="h"><b class="ell">${esc(T(f.h).short)}</b>${crestSVG(T(f.h), 40)}</div><div class="sc">×</div><div class="a">${crestSVG(T(f.a), 40)}<b class="ell">${esc(T(f.a).short)}</b></div></div>

    ${removed.length ? `<div class="err-box">Fora da escalação: ${removed.map(p => `${esc(shortP(p))} (${p.injury > 0 ? 'lesão' : 'suspensão'})`).join(', ')}. Substituídos automaticamente.</div>` : ''}
    <div class="lstats" style="margin:8px 0 14px"><span>${cmp(r.atk, or.def)}</span><span>Seu ataque × defesa deles</span><span>${or.def.toFixed(0)}</span><span>${cmp(r.mid, or.mid)}</span><span>Meio-campo</span><span>${or.mid.toFixed(0)}</span><span>${cmp(r.def, or.atk)}</span><span>Sua defesa × ataque deles</span><span>${or.atk.toFixed(0)}</span></div>
    <p class="small muted center">Sua formação: <b>${s.tactic.formation}</b> · ${mentalityLabel(s.tactic.mentality)} · provável deles: ${ot.formation}</p>
    ${tiredXI.length ? `<div class="err-box" style="background:rgba(217,166,46,.12);border-color:rgba(217,166,46,.45)">Cansados no time: ${tiredXI.map(p => `${esc(shortP(p))} (${p.fitness}%)`).join(', ')}.<button class="btn sm block mt" data-act="restTired">Poupar cansados</button></div>` : ''}

function startLive(){
  closeModal();
  validateUserLineup();
  const engines = createDayEngines(true);
  const user = engines.find(e => e.userSide >= 0);
  if (!user){ toast('Nenhum jogo seu hoje.', true); return; }
  const prefs = lsGet(K.prefs, {}) || {};
  state.live = { engines, user, dayIdx: state.save.day, speed: prefs.speed || 1, timer: null, paused: false, htShown: false, done: false, shownEv: 0 };
  renderLiveSkeleton();
  setLiveSpeed(state.live.speed);
}
function renderLiveSkeleton(){
  const L = state.live, e = L.user, H = e.sides[0].team, A = e.sides[1].team, d = state.save.calendar[L.dayIdx];
  $('#live').innerHTML = `<div class="scoreboard"><div class="wrap">
    <div class="center tiny muted" style="margin-bottom:6px">${compBadge(e.ref.comp)} ${esc(dayLabel(d))}</div>
    <div class="sbrow"><div class="sbteam">${crestSVG(H, 44)}<span class="ell" style="max-width:100%">${esc(H.short)}</span></div><div><div class="sbscore" id="lvScore">0 – 0</div><div class="sbmin" id="lvMin">0'</div></div><div class="sbteam">${crestSVG(A, 44)}<span class="ell" style="max-width:100%">${esc(A.short)}</span></div></div>
    <div class="possbar"><i id="lvPossH" style="width:50%;background:${H.colors[0] === '#141414' ? '#ddd' : H.colors[0]}"></i><i id="lvPossA" style="width:50%;background:${A.colors[0] === H.colors[0] ? A.colors[1] : A.colors[0]}"></i></div>
    <div class="lstats" id="lvStats"></div></div></div>
    <div class="feed"><div class="wrap" id="lvFeed"></div></div>
    <div class="lctrl"><div class="wrap"><div class="others" id="lvOthers"></div>
      <div class="btns" id="lvCtrl"></div></div></div>`;
  $('#live').classList.add('on'); document.body.style.overflow = 'hidden';

function updateLive(full){
  const L = state.live, e = L.user;
  $('#lvScore').textContent = `${e.score[0]} – ${e.score[1]}`;
  $('#lvMin').textContent = e.finished ? (e.pens ? `Pênaltis ${e.pens[0]}×${e.pens[1]}` : 'Encerrado') : e.minute === 45 && !L.htResumed ? 'Intervalo' : e.minute + "'";
  const pp = e.possPct(); $('#lvPossH').style.width = pp + '%'; $('#lvPossA').style.width = (100 - pp) + '%';
  const st = e.stats;
  $('#lvStats').innerHTML = [[pp + '%', 'Posse', (100 - pp) + '%'], [st.shots[0], 'Finalizações', st.shots[1]], [st.onT[0], 'No gol', st.onT[1]], [st.corners[0], 'Escanteios', st.corners[1]], [st.yellow[0] + (st.red[0] ? ' / ' + st.red[0] + '🟥' : ''), 'Cartões', st.yellow[1] + (st.red[1] ? ' / ' + st.red[1] + '🟥' : '')]].map(([a, l, b]) => `<span>${a}</span><span>${l}</span><span>${b}</span>`).join('');
  const feed = $('#lvFeed');
  const us = e.userSide;
  for (; L.shownEv < e.events.length; L.shownEv++){
    const ev = e.events[L.shownEv];
    const d = document.createElement('div');
    d.className = 'ev ' + (ev.type === 'goal' ? 'goal' + (ev.side !== us ? ' opp' : '') : ev.type === 'big' || ev.type === 'card' ? 'big' : ev.type === 'sys' ? 'sys' : '');
    d.innerHTML = `<span class="m">${ev.min}'</span><span>${ev.type === 'goal' ? '⚽ ' : ''}${esc(ev.text)}</span>`;
    feed.prepend(d);
    if (ev.type === 'goal'){ $('#lvScore').classList.remove('flash'); void $('#lvScore').offsetWidth; $('#lvScore').classList.add('flash'); }
  }
  if (full || e.minute % 3 === 0 || e.finished){
    $('#lvOthers').innerHTML = L.engines.filter(x => x !== e).map(x => `<div>${esc(x.sides[0].team.tla)} ${x.score[0]}–${x.score[1]} ${esc(x.sides[1].team.tla)}</div>`).join('');
  }
  renderLiveControls();
}
function renderLiveControls(){
  const L = state.live, e = L.user, side = e.sides[e.userSide];
  let h;
  if (e.finished) h = `<button class="btn primary" data-act="liveFinish">Ver resultados e continuar</button>`;
  else h = `<button class="btn" data-act="livePause">${L.paused ? '▶' : '⏸'}</button>
    <button class="btn" data-act="liveSpeed">${L.speed}x</button>
    <button class="btn" data-act="liveSubs">🔁 ${MAX_SUBS - side.subsLeft}/${MAX_SUBS}</button>
    <button class="btn" data-act="liveEnd" title="Simular até o fim">⏭</button>`;
  $('#lvCtrl').innerHTML = h;
}
function setLiveSpeed(sp){
  const L = state.live; L.speed = sp;
  clearInterval(L.timer);
  const ms = { 1: 650, 2: 300, 4: 110 }[sp] || 650;
  L.timer = setInterval(liveTick, ms);
}
function liveTick(){
  const L = state.live; if (!L || L.paused || L.done) return;
  const e = L.user;
  if (e.finished){ clearInterval(L.timer); updateLive(true); return; }
  for (const x of L.engines) x.step();
  if (e.minute === 45 && !L.htShown){ L.htShown = true; L.paused = true; updateLive(true); openHalftime(); return; }
  updateLive(false);
  if (e.finished){ clearInterval(L.timer); updateLive(true); }
}
function openHalftime(){
  const L = state.live, e = L.user, t = e.sides[e.userSide].tactic;
  const sl = (k, label, txt) => `<div class="slider"><div class="row"><b>${label}</b><span class="muted" id="ht_${k}">${txt(t[k])}</span></div><input type="range" min="0" max="100" step="5" value="${t[k]}" data-input="liveTactic" data-k="${k}"></div>`;
  openModal(`<h2 style="margin-top:0">Intervalo</h2><p class="muted">${esc(e.sides[0].team.short)} ${e.score[0]} × ${e.score[1]} ${esc(e.sides[1].team.short)} · posse ${e.possPct()}% / ${100 - e.possPct()}%</p>
    ${sl('mentality', 'Mentalidade', mentalityLabel)}${sl('pressure', 'Pressão', v => levelLabel(v, 'Baixa', 'Média', 'Alta'))}${sl('tempo', 'Ritmo', v => levelLabel(v, 'Lento', 'Normal', 'Rápido'))}
    <div class="btns"><button class="btn" data-act="liveSubs">🔁 Substituições</button><button class="btn primary" data-act="liveResume">Voltar para o 2º tempo</button></div>`);
}
function openSubs(){
  const L = state.live, e = L.user, side = e.sides[e.userSide];

/* ═══ 14. ARRASTAR E SOLTAR (TÁTICA) ══════════════════════════════
   Pointer Events (toque, caneta e mouse). Arrastar: vaga↔vaga troca,
   reserva→vaga coloca o reserva. Toque simples: seleciona e depois
   toca no destino (alternativa acessível ao arraste).                */
let drag = null;
document.addEventListener('pointerdown', e => {
  if (state.ui.tab !== 'tatica' || $('#modal').classList.contains('on') || state.live) return;
  const src = e.target.closest('[data-drag]'); if (!src) return;
  drag = { src, kind: src.dataset.drag, id: src.dataset.drag === 'slot' ? Number(src.dataset.slot) : src.dataset.pid, x0: e.clientX, y0: e.clientY, started: false, ghost: null, over: null,
    viaHandle: !!e.target.closest('.handle') || src.dataset.drag === 'slot' || e.pointerType === 'mouse' };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.started){
    if (Math.hypot(dx, dy) < 8) return;
    if (!drag.viaHandle){ drag = null; return; }       // linha de reserva sem a alça: deixa rolar a página
    drag.started = true;
    const g = (drag.kind === 'slot' ? drag.src.querySelector('.dot') : drag.src).cloneNode(true);
    g.classList.add('drag-ghost'); if (drag.kind === 'res') g.style.width = Math.min(drag.src.offsetWidth, 320) + 'px';
    document.body.appendChild(g); drag.ghost = g; drag.src.classList.add('dragging');
  }
  e.preventDefault();
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  if (!drag.raf) drag.raf = requestAnimationFrame(dragAutoScroll);
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const tgt = document.elementFromPoint(e.clientX, e.clientY);
  const over = tgt && tgt.closest('[data-drop]');
  if (drag.over && drag.over !== over) drag.over.classList.remove('over');
  if (over && over !== drag.src){ over.classList.add('over'); drag.over = over; } else drag.over = null;
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.raf) cancelAnimationFrame(d.raf);
  if (d.ghost) d.ghost.remove();
  d.src.classList.remove('dragging'); if (d.over) d.over.classList.remove('over');
  if (d.started){
    const tgt = document.elementFromPoint(e.clientX, e.clientY);
    const over = tgt && tgt.closest('[data-drop]');
    if (over) tacticDrop({ kind: d.kind, id: d.id }, over.dataset.drop === 'slot' ? { kind: 'slot', id: Number(over.dataset.slot) } : { kind: 'res', id: over.dataset.pid });
  } else tacticTap({ kind: d.kind, id: d.id });
});
document.addEventListener('pointercancel', () => {
  if (!drag) return; if (drag.raf) cancelAnimationFrame(drag.raf); if (drag.ghost) drag.ghost.remove(); drag.src.classList.remove('dragging'); if (drag.over) drag.over.classList.remove('over'); drag = null;
});
// Perto das bordas da tela a página rola sozinha (reservas ficam abaixo do campo).
function dragAutoScroll(){
  if (!drag || !drag.started){ return; }
  const y = drag.lastY, edge = 90;
  const v = y < edge ? -Math.ceil((edge - y) / 6) : y > innerHeight - edge - 70 ? Math.ceil((y - (innerHeight - edge - 70)) / 6) : 0;
  if (v) window.scrollBy(0, v);
  drag.raf = requestAnimationFrame(dragAutoScroll);
}
function tacticDrop(a, b){
  const L = state.save.tactic.lineup;
  if (a.kind === 'slot' && b.kind === 'slot'){ if (a.id !== b.id) [L[a.id], L[b.id]] = [L[b.id], L[a.id]]; }
  else if (a.kind === 'res' && b.kind === 'slot') L[b.id] = a.id;
  else if (a.kind === 'slot' && b.kind === 'res') L[a.id] = b.id;
  else return;
  state.ui.tacSel = null; saveGame(); render();
}
function tacticTap(t){
  const sel = state.ui.tacSel;
  if (!sel || (sel.kind === t.kind && sel.id === t.id) || (sel.kind === 'res' && t.kind === 'res')){
    state.ui.tacSel = sel && sel.kind === t.kind && sel.id === t.id ? null : t; render(); return;
  }
  tacticDrop(sel, t);
}

function setupPWA(){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
    g.fillStyle = '#0d1117'; g.fillRect(0, 0, 512, 512);
    g.strokeStyle = '#2fbf5b'; g.lineWidth = 26; g.strokeRect(96, 64, 320, 384);
    g.beginPath(); g.moveTo(96, 256); g.lineTo(416, 256); g.stroke();
    g.beginPath(); g.arc(256, 256, 54, 0, Math.PI * 2); g.stroke();
    const png = c.toDataURL('image/png');
    $('#pwaTouchIcon').href = png;
    const manifest = { name: 'Prancheta — Manager Brasileirão', short_name: 'Prancheta', start_url: location.href.split('#')[0], scope: location.href.replace(/[^/]*$/, ''), display: 'standalone', orientation: 'any', background_color: '#0d1117', theme_color: '#0d1117', icons: [{ src: png, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    $('#pwaManifest').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  } catch (e){}
  // service worker opcional (sw.js ao lado deste arquivo) para abrir sem internet
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

function boot(){
  state.save = loadGame();
  if (state.save && userTeam()) validateUserLineup();
  render();
  setupPWA();
}
boot();
</script>
</body>
</html>
