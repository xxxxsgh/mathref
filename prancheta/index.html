// ── Elenco ──
const POS_ORDER = { GOL:0, ZAG:1, LAT:2, VOL:3, MEI:4, ATA:5 };
function renderSquad(){
  const s = state.save;
  const team = T(state.ui.viewTeam) || userTeam();
  const mine = team.id === s.userTeamId;
  const starters = mine ? new Set(s.tactic.lineup) : new Set();
  const sorters = {
    pos: (a, b) => POS_ORDER[a.pos] - POS_ORDER[b.pos] || b.ovr - a.ovr,
    ovr: (a, b) => b.ovr - a.ovr || POS_ORDER[a.pos] - POS_ORDER[b.pos],
    idade: (a, b) => a.age - b.age || b.ovr - a.ovr,
    cond: (a, b) => a.fitness - b.fitness,
    gols: (a, b) => b.goals - a.goals || b.ovr - a.ovr
  };
  const list = team.squad.slice().sort(sorters[state.ui.squadSort] || sorters.pos);
  const chips = [['pos','Posição'],['ovr','Overall'],['idade','Idade'],['cond','Condição'],['gols','Gols']];
  let h = `<div class="row between mb">${mine ? '<h2 style="margin:0">Elenco</h2>' : `<div class="row">${crestSVG(team, 32)}<h2 style="margin:0">${esc(team.short)}</h2></div><button class="btn sm" data-act="viewTeam" data-id="">Meu elenco</button>`}</div>
    <p class="muted small" style="margin-top:-4px">${team.squad.length} jogadores · média ${avg(team.squad.map(p => p.ovr)).toFixed(1)} · força ${teamOvr(team)}${mine ? ' · barra verde = titular' : ''}</p>
    <div class="seg">${chips.map(([k, l]) => `<button class="chip ${state.ui.squadSort === k ? 'on' : ''}" data-act="squadSort" data-k="${k}">${l}</button>`).join('')}</div><div class="plist">`;
  let lastPos = null;
  for (const p of list){
    if (state.ui.squadSort === 'pos' && p.pos !== lastPos){ lastPos = p.pos; h += `<div class="tiny muted" style="margin:8px 2px 0;font-weight:700;letter-spacing:.08em">${POS_NAME[p.pos].toUpperCase()}S</div>`; }
    h += `<button class="prow ${starters.has(p.id) ? 'starter' : ''}" data-act="player" data-pid="${p.id}" data-team="${team.id}">
      <span class="pos ${p.pos}">${p.pos}</span>
      <span class="grow"><span class="pname ell" style="display:block">${esc(p.name)}${p.ovrManual ? ' ✎' : ''}${p.youth ? ' 🌱' : ''}</span><span class="tiny muted">${p.age} anos${p.goals ? ` · ${p.goals} gol${p.goals > 1 ? 's' : ''}` : ''}${p.apps ? ` · ${p.apps} j` : ''}</span></span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="bar"><i style="width:${p.fitness}%;background:${barColor(p.fitness)}"></i></span><span class="tiny muted">${p.fitness}%</span></span>
      <span class="mor" title="Moral">${moraleIcon(p.morale)}</span>
      <span class="ovr ${ovrClass(p.ovr)}">${p.ovr}</span></button>`;
  }
  return h + '</div>';
}
function playerSheet(teamId, pid){
  const team = T(teamId), p = findPlayer(team, pid); if (!p) return;
  const attrs = Object.keys(ATTR_NAME).map(k => `<div class="attr"><span>${ATTR_NAME[k]}</span><span class="bar"><i style="width:${p.attr[k]}%;background:${barColor(p.attr[k])}"></i></span><b>${p.attr[k]}</b></div>`).join('');
  openModal(`<div class="row"><span class="pos ${p.pos}">${p.pos}</span><div class="grow"><div style="font-size:19px;font-weight:800">${esc(p.name)}</div><div class="small muted row">${crestSVG(team, 16)} ${esc(team.short)} · ${POS_NAME[p.pos]} · ${p.age} anos${p.nat ? ' · ' + esc(p.nat) : ''}</div></div><div class="ovr ${ovrClass(p.ovr)}" style="font-size:30px">${p.ovr}</div></div>
    <div class="kv mt"><div><small>Moral</small>${moraleIcon(p.morale)} ${moraleText(p.morale)} (${p.morale})</div><div><small>Condição física</small>${p.fitness}%</div>
    <div><small>Jogos / Gols</small>${p.apps} / ${p.goals}</div><div><small>Assist. / Cartões</small>${p.assists} / 🟨${p.yellow} 🟥${p.red}</div></div>
    <h3>Atributos</h3>${attrs}
    <h3>Editar nota</h3><p class="tiny muted" style="margin-top:-4px">A nota é calculada por posição, idade e uma variação fixa pelo nome. ${p.ovrManual ? 'Esta nota foi editada manualmente.' : ''} Os atributos acompanham a mudança.</p>
    <div class="row"><input class="input" id="ovrEdit" type="number" min="40" max="90" value="${p.ovr}" inputmode="numeric" style="max-width:110px"><button class="btn primary grow" data-act="saveOvr" data-team="${teamId}" data-pid="${pid}">Salvar nota</button></div>
    ${p.ovrManual ? `<button class="btn ghost block mt" data-act="restoreOvr" data-team="${teamId}" data-pid="${pid}">Restaurar nota calculada</button>` : ''}
    <button class="btn block mt" data-act="closeModal">Fechar</button>`);
}

// ── Tática ──
function renderTactics(){
  const s = state.save, team = userTeam(); validateUserLineup();
  const t = s.tactic, slots = FORMATIONS[t.formation], sel = state.ui.tacSel;
  const r = teamStrengthFromLineup(team, t.formation, t.lineup);
  const inXI = new Set(t.lineup);
  let pitch = `<div class="pitch" id="pitch"><svg class="lines" viewBox="0 0 68 92" preserveAspectRatio="none"><g fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".4"><rect x="1" y="1" width="66" height="90"/><line x1="1" y1="46" x2="67" y2="46"/><circle cx="34" cy="46" r="7"/><rect x="18" y="1" width="32" height="13"/><rect x="18" y="78" width="32" height="13"/><rect x="27" y="1" width="14" height="5"/><rect x="27" y="86" width="14" height="5"/></g></svg>`;
  slots.forEach(([role, x, y], i) => {
    const p = findPlayer(team, t.lineup[i]);
    const c = p ? COMPAT[p.pos][role] : 0;
    const cls = !p ? 'empty' : c < 0.7 ? 'vbad' : c < 0.95 ? 'bad' : '';
    pitch += `<div class="slot ${cls} ${sel && sel.kind === 'slot' && sel.id == i ? 'sel' : ''}" style="left:${x}%;top:${y}%" data-drag="slot" data-drop="slot" data-slot="${i}">
      <div class="dot" style="color:${p ? (p.fitness < 70 ? 'var(--warn)' : '#fff') : '#888'}">${p ? p.ovr : '+'}</div><div class="nm">${p ? esc(shortP(p).split(' ').pop()) : '—'}</div><div class="rl">${role}${p && p.pos !== role ? ' (' + p.pos + ')' : ''}</div></div>`;
  });
  pitch += '</div>';
  const res = team.squad.filter(p => !inXI.has(p.id)).sort((a, b) => POS_ORDER[a.pos] - POS_ORDER[b.pos] || b.ovr - a.ovr);
  const slider = (k, label, txt) => `<div class="slider"><div class="row"><b>${label}</b><span class="muted" id="lbl_${k}">${txt(t[k])}</span></div><input type="range" min="0" max="100" step="5" value="${t[k]}" data-input="tactic" data-k="${k}" aria-label="${label}"></div>`;
  return `<div class="row between"><h2 style="margin:0">Tática</h2><button class="btn sm" data-act="autoXI">Escalar automaticamente</button></div>
    <div class="seg mt">${Object.keys(FORMATIONS).map(f => `<button class="chip ${t.formation === f ? 'on' : ''}" data-act="formation" data-f="${f}">${f}</button>`).join('')}</div>
    <p class="tiny muted" style="margin:-4px 0 10px">Arraste jogadores (ou toque em um e depois no destino) para trocar. Borda amarela/vermelha = fora de posição.</p>
    ${pitch}
    <div class="strength"><div><small class="muted">Ataque</small><b>${r.atk.toFixed(0)}</b></div><div><small class="muted">Meio</small><b>${r.mid.toFixed(0)}</b></div><div><small class="muted">Defesa</small><b>${r.def.toFixed(0)}</b></div></div>
    <div class="card">${slider('mentality', 'Mentalidade', mentalityLabel)}${slider('pressure', 'Pressão', v => levelLabel(v, 'Baixa', 'Média', 'Alta') + ' · cansa ' + levelLabel(v, 'menos', 'normal', 'mais'))}${slider('tempo', 'Ritmo', v => levelLabel(v, 'Lento', 'Normal', 'Rápido'))}
      <p class="tiny muted" style="margin:0">Ofensiva cria mais chances e expõe a defesa. Pressão alta ganha o meio, mas cansa e gera faltas. Ritmo rápido acelera o jogo para os dois lados.</p></div>
    <h3>Reservas (${res.length})</h3><div class="plist" id="reserves">${res.map(p => `<div class="rrow ${sel && sel.kind === 'res' && sel.id === p.id ? 'sel' : ''}" data-drag="res" data-drop="res" data-pid="${p.id}"><span class="handle" aria-hidden="true">⠿</span><span class="pos ${p.pos}">${p.pos}</span><span class="grow ell"><b>${esc(p.name)}</b><br><span class="tiny muted">${p.age} anos · ${p.fitness}% · ${moraleIcon(p.morale)}</span></span><span class="ovr ${ovrClass(p.ovr)}">${p.ovr}</span></div>`).join('')}</div>`;
}
function afterTacticsRender(){ /* o arraste usa listeners globais (seção 14) */ }

// ── Jogos (calendário) ──
function renderFixtures(){
  const s = state.save, uid = s.userTeamId;
  const mode = state.ui.fxMode;
  let h = `<h2>Jogos</h2><div class="seg"><button class="chip ${mode === 'rodada' ? 'on' : ''}" data-act="fxMode" data-k="rodada">Rodadas</button><button class="chip ${mode === 'meus' ? 'on' : ''}" data-act="fxMode" data-k="meus">Meus jogos</button></div>`;
  if (mode === 'meus'){
    h += '<div class="card" style="padding:6px 10px">';
    s.fixtures.forEach((rd, i) => { const m = rd.matches.find(x => x.h === uid || x.a === uid); if (m) h += `<div class="tiny muted" style="margin-top:6px">Rodada ${rd.n} · ${fmtDate(rd.date)}${i === s.round && s.phase === 'season' ? ' · <b style="color:var(--accent)">PRÓXIMA</b>' : ''}</div>` + fixtureRow(m, uid); });
    return h + '</div>';
  }
  const ri = state.ui.fxRound ?? clamp(s.round, 0, s.fixtures.length - 1);
  const rd = s.fixtures[ri];
  h += `<div class="row between mb"><button class="btn sm" data-act="fxRound" data-d="-1" ${ri <= 0 ? 'disabled' : ''}>‹</button><div class="center"><b>Rodada ${rd.n}</b><div class="tiny muted">${fmtDate(rd.date)} · ${ri < s.round ? 'encerrada' : ri === s.round && s.phase === 'season' ? 'próxima' : 'a disputar'}</div></div><button class="btn sm" data-act="fxRound" data-d="1" ${ri >= s.fixtures.length - 1 ? 'disabled' : ''}>›</button></div>`;
  h += `<div class="card" style="padding:4px 10px">${rd.matches.map(m => fixtureRow(m, uid, true)).join('')}</div>`;
  return h;
}
function fixtureRow(m, uid, scorers){
  const H = T(m.h), A = T(m.a); if (!H || !A) return '';
  const played = m.hg != null;
  let g = '';
  if (scorers && played && m.goals && m.goals.length){
    const side = k => m.goals.filter(x => x.s === k).map(x => `${esc(x.n.split(' ').pop())} ${x.m}'${x.p ? ' (p)' : ''}`).join(', ');
    g = `<div class="tiny muted" style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-2px"><span style="text-align:right">${side(0)}</span><span>${side(1)}</span></div>`;
  }
  return `<div class="fx ${m.h === uid || m.a === uid ? 'mine' : ''}"><div class="h"><span class="ell">${esc(H.short)}</span>${crestSVG(H, 22)}</div><div class="sc">${played ? `${m.hg} – ${m.ag}` : '×'}</div><div class="a">${crestSVG(A, 22)}<span class="ell">${esc(A.short)}</span></div>${g}</div>`;
}

/* ═══ 14. ARRASTAR E SOLTAR (TÁTICA) ══════════════════════════════
   Pointer Events (toque, caneta e mouse). Arrastar: vaga↔vaga troca,
   reserva→vaga coloca o reserva. Toque simples: seleciona e depois
   toca no destino (alternativa acessível ao arraste).                */
let drag = null;
document.addEventListener('pointerdown', e => {
  if (state.ui.tab !== 'tatica' || $('#modal').classList.contains('on') || state.live) return;
  const src = e.target.closest('[data-drag]'); if (!src) return;
  drag = { src, kind: src.dataset.drag, id: src.dataset.drag === 'slot' ? Number(src.dataset.slot) : src.dataset.pid, x0: e.clientX, y0: e.clientY, started: false, ghost: null, over: null,
    viaHandle: !!e.target.closest('.handle') || src.dataset.drag === 'slot' || e.pointerType === 'mouse' };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.started){
    if (Math.hypot(dx, dy) < 8) return;
    if (!drag.viaHandle){ drag = null; return; }       // linha de reserva sem a alça: deixa rolar a página
    drag.started = true;
    const g = (drag.kind === 'slot' ? drag.src.querySelector('.dot') : drag.src).cloneNode(true);
    g.classList.add('drag-ghost'); if (drag.kind === 'res') g.style.width = Math.min(drag.src.offsetWidth, 320) + 'px';
    document.body.appendChild(g); drag.ghost = g; drag.src.classList.add('dragging');
  }
  e.preventDefault();
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  if (!drag.raf) drag.raf = requestAnimationFrame(dragAutoScroll);
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const tgt = document.elementFromPoint(e.clientX, e.clientY);
  const over = tgt && tgt.closest('[data-drop]');
  if (drag.over && drag.over !== over) drag.over.classList.remove('over');
  if (over && over !== drag.src){ over.classList.add('over'); drag.over = over; } else drag.over = null;
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.raf) cancelAnimationFrame(d.raf);
  if (d.ghost) d.ghost.remove();
  d.src.classList.remove('dragging'); if (d.over) d.over.classList.remove('over');
  if (d.started){
    const tgt = document.elementFromPoint(e.clientX, e.clientY);
    const over = tgt && tgt.closest('[data-drop]');
    if (over) tacticDrop({ kind: d.kind, id: d.id }, over.dataset.drop === 'slot' ? { kind: 'slot', id: Number(over.dataset.slot) } : { kind: 'res', id: over.dataset.pid });
  } else tacticTap({ kind: d.kind, id: d.id });
});
document.addEventListener('pointercancel', () => {
  if (!drag) return; if (drag.raf) cancelAnimationFrame(drag.raf); if (drag.ghost) drag.ghost.remove(); drag.src.classList.remove('dragging'); if (drag.over) drag.over.classList.remove('over'); drag = null;
});
// Perto das bordas da tela a página rola sozinha (reservas ficam abaixo do campo).
function dragAutoScroll(){
  if (!drag || !drag.started){ return; }
  const y = drag.lastY, edge = 90;
  const v = y < edge ? -Math.ceil((edge - y) / 6) : y > innerHeight - edge - 70 ? Math.ceil((y - (innerHeight - edge - 70)) / 6) : 0;
  if (v) window.scrollBy(0, v);
  drag.raf = requestAnimationFrame(dragAutoScroll);
}
function tacticDrop(a, b){
  const L = state.save.tactic.lineup;
  if (a.kind === 'slot' && b.kind === 'slot'){ if (a.id !== b.id) [L[a.id], L[b.id]] = [L[b.id], L[a.id]]; }
  else if (a.kind === 'res' && b.kind === 'slot') L[b.id] = a.id;
  else if (a.kind === 'slot' && b.kind === 'res') L[a.id] = b.id;
  else return;
  state.ui.tacSel = null; saveGame(); render();
}
function tacticTap(t){
  const sel = state.ui.tacSel;
  if (!sel || (sel.kind === t.kind && sel.id === t.id) || (sel.kind === 'res' && t.kind === 'res')){
    state.ui.tacSel = sel && sel.kind === t.kind && sel.id === t.id ? null : t; render(); return;
  }
  tacticDrop(sel, t);
}

let fileMode = null;                                // o que o seletor de arquivo vai importar
function pickFile(mode){ fileMode = mode; const fi = $('#fileInput'); fi.value = ''; fi.click(); }
$('#fileInput').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e){ toast('Arquivo JSON inválido.', true); return; }
  try {
    if (fileMode === 'save'){
      const s = validateImportedSave(obj);
      stopLive(); state.save = s; state.ui.newGame = null; saveGame(); toast('Save importado!'); go('inicio');
    } else if (fileMode === 'teams'){
      const teams = normalizeTeamsPayload(obj, state.save ? state.save.season : currentSeasonYear());
      try { cacheData(teams, 'JSON importado'); } catch (e){ toast(e.message, true); }
      if (state.save){ const r = mergeSquads(state.save, teams); validateUserLineup(); saveGame(); toast(`Elencos mesclados: ${r.updated} clubes (${r.added} novos jogadores).`); render(); }
      else { useTeamsForNewGame(teams, 'JSON importado'); }
    } else if (fileMode === 'promoted'){
      const list = Array.isArray(obj) ? obj : obj.teams;
      if (!Array.isArray(list) || !list.length) throw new Error('JSON sem lista "teams".');
      state.save.pendingPromoted = list.slice(0, 4); saveGame(); toast(`${state.save.pendingPromoted.length} clube(s) promovido(s) importados.`); render();
    }
  } catch (e){ toast(e.message || 'Falha ao importar.', true); }
});
function useTeamsForNewGame(teams, source){
  if (teams.length < LEAGUE_SIZE){
    // completa com clubes gerados se o arquivo tiver menos de 20
    const names = new Set(teams.map(t => deaccent(t.name)));
    for (const [n, tla, c] of [...DEMO_CLUBS, ...PROMOTION_POOL]){ if (teams.length >= LEAGUE_SIZE) break; if (!names.has(deaccent(n))) teams.push(generateClub(n, tla, c, reputationFor(n), 'fill')); }
    toast('O arquivo tinha menos de 20 clubes; completamos com clubes gerados.');
  }
  state.ui.newGame = { step: 'club', teams: teams.slice(0, LEAGUE_SIZE), source, pick: null };
  state.ui.apiError = null; render(); window.scrollTo(0, 0);
}
function stopLive(){ if (state.live){ clearInterval(state.live.timer); state.live = null; $('#live').classList.remove('on'); document.body.style.overflow = ''; } }
async function doFetch(){
  state.ui.busy = true; state.ui.apiError = null; render();
  try {
    const json = await fetchTeams();
    const teams = normalizeTeamsPayload(json, state.save ? state.save.season : currentSeasonYear());
    try { cacheData(teams, 'football-data.org'); } catch (e){ toast(e.message, true); }
    state.ui.busy = false;
    return teams;
  } catch (e){
    state.ui.busy = false; state.ui.apiError = e.message || String(e); render(); toast('Falha ao baixar elencos.', true);
    return null;
  }
}

const ACTIONS = {
  tab: el => go(el.dataset.tab),
  closeModal: () => closeModal(),
  confirmOk: () => { const cb = confirmModal.cb; closeModal(); if (cb) cb(); },
  // novo jogo
  ngFetch: async () => {
    const k = $('#ngKey'); if (k && k.value.trim()) lsSet(K.apiKey, k.value.trim());
    const teams = await doFetch(); if (teams) useTeamsForNewGame(teams, 'football-data.org');
  },
  ngCache: () => { const c = loadCachedTeams(); if (c) useTeamsForNewGame(c.teams.map(t => normalizeTeam(t)), 'cache local'); },
  ngImport: () => pickFile('teams'),
  ngDemo: () => useTeamsForNewGame(demoTeams(), 'dados de exemplo'),
  ngBack: () => { state.ui.newGame = null; render(); },
  pickClub: el => { if (state.save && state.save.phase === 'choose-club') state.ui.pickClub = el.dataset.id; else state.ui.newGame.pick = el.dataset.id; render(); },
  ngStart: () => { const ng = state.ui.newGame; newSave(ng.teams, ng.pick, ng.source); state.ui.newGame = null; saveGame(); go('inicio'); toast('Boa sorte, professor!'); },
  confirmNewClub: () => { chooseNewClub(state.ui.pickClub); state.ui.pickClub = null; go('inicio'); },
  // partida
  prematch: () => openPrematch(),
  tacFromPre: () => { closeModal(); go('tatica'); },
  kickoff: () => startLive(),
  quickSim: () => {
    const e = simulateRoundQuick();
    const us = e.fixture.h === state.save.userTeamId ? 0 : 1, gf = e.score[us], ga = e.score[1 - us];
    showRoundResults(state.save.round - 1, gf > ga ? 'Vitória!' : gf < ga ? 'Derrota' : 'Empate'); render();
  },
  livePause: () => { state.live.paused = !state.live.paused; renderLiveControls(); },
  liveSpeed: () => { const L = state.live; setLiveSpeed(L.speed === 1 ? 2 : L.speed === 2 ? 4 : 1); renderLiveControls(); },
  liveSubs: () => { state.live.subSel = { out: null, in: null }; openSubs(); },
  subOut: el => { state.live.subSel.out = el.dataset.pid; openSubs(); },
  subIn: el => { state.live.subSel.in = el.dataset.pid; openSubs(); },
  subDo: () => {
    const L = state.live, e = L.user;
    if (e.substitute(e.userSide, L.subSel.out, L.subSel.in)){ toast('Substituição feita.'); updateLive(true); }
    L.subSel = { out: null, in: null }; openSubs();
  },
  subsClose: () => { const L = state.live; closeModal(); if (L.htShown && !L.htResumed && L.user.minute === 45) openHalftime(); else { L.paused = false; renderLiveControls(); } },
  liveResume: () => { const L = state.live; L.htResumed = true; L.paused = false; closeModal(); updateLive(true); },
  liveEnd: () => confirmModal('Simular o restante da partida instantaneamente?', 'Simular até o fim', () => {
    const L = state.live; L.htShown = true; L.htResumed = true;
    while (!L.user.finished){ L.engines.forEach(x => x.step()); }
    L.paused = false; updateLive(true);
  }),
  liveFinish: () => finishLive(),
  // elenco
  squadSort: el => { state.ui.squadSort = el.dataset.k; render(); },
  player: el => playerSheet(el.dataset.team, el.dataset.pid),
  viewTeam: el => { const id = el.dataset.id; state.ui.viewTeam = id && id !== state.save.userTeamId ? id : null; state.ui.tab = 'elenco'; render(); window.scrollTo(0, 0); },
  saveOvr: el => {
    const v = Number($('#ovrEdit').value); if (!(v >= 40 && v <= 90)) { toast('A nota deve estar entre 40 e 90.', true); return; }
    const team = T(el.dataset.team), p = findPlayer(team, el.dataset.pid); setPlayerOverall(p, v, true); delete team._formCache;
    saveGame(); closeModal(); render(); toast('Nota atualizada.');
  },
  restoreOvr: el => { const team = T(el.dataset.team), p = findPlayer(team, el.dataset.pid); restorePlayerOverall(p, team); delete team._formCache; saveGame(); closeModal(); render(); },
  // tática
  formation: el => { const t = state.save.tactic; t.lineup = remapLineup(userTeam(), t.lineup, el.dataset.f); t.formation = el.dataset.f; state.ui.tacSel = null; saveGame(); render(); },
  autoXI: () => { const t = state.save.tactic; t.lineup = autoLineup(userTeam(), t.formation); state.ui.tacSel = null; saveGame(); render(); toast('Escalação automática (considera condição física).'); },
  // jogos / tabela
  fxMode: el => { state.ui.fxMode = el.dataset.k; render(); },
  fxRound: el => { const s = state.save; state.ui.fxRound = clamp((state.ui.fxRound ?? clamp(s.round, 0, 37)) + Number(el.dataset.d), 0, s.fixtures.length - 1); render(); },
  tableMode: el => { state.ui.tableMode = el.dataset.k; render(); },
  // temporada
  nextSeason: () => { startNextSeason(); state.ui.fxRound = null; go('inicio'); toast(`Temporada ${state.save.season} começou!`); },
  importPromoted: () => pickFile('promoted'),
  // config
  saveKey: () => { lsSet(K.apiKey, $('#cfgKey').value.trim()); lsSet(K.apiBase, $('#cfgBase').value.trim() === DEFAULT_API_BASE ? '' : $('#cfgBase').value.trim()); toast('Configurações salvas.'); state.ui.apiError = null; render(); },
  toggleKey: () => { const i = $('#cfgKey'); i.type = i.type === 'password' ? 'text' : 'password'; },
  refreshSquads: async () => {
    const teams = await doFetch(); if (!teams) return;
    if (state.save){ const r = mergeSquads(state.save, teams); validateUserLineup(); saveGame(); toast(`Elencos atualizados: ${r.updated} clubes, +${r.added} / −${r.removed} jogadores.`); }
    else toast(`${teams.length} clubes salvos no cache.`);
    render();
  },
  importTeams: () => pickFile('teams'),
  exportTeams: () => {
    const teams = state.save ? state.save.league.map(T) : (loadCachedTeams() || { teams: demoTeams() }).teams;
    downloadJson(teamsToExport(teams), 'prancheta-elencos.json');
  },
  speedPref: el => { const p = lsGet(K.prefs, {}) || {}; p.speed = Number(el.dataset.v); lsSet(K.prefs, p); render(); },
  exportSave: () => { downloadJson(serializeSave(), `prancheta-save-${state.save.season}-r${state.save.round}.json`); },
  importSave: () => pickFile('save'),
  newGame: () => confirmModal('Começar um novo jogo? O save atual será substituído (exporte antes se quiser guardá-lo).', 'Novo jogo', () => { stopLive(); state.save = null; lsDel(K.save); state.ui.newGame = null; go('inicio'); }, true),
  wipeAll: () => confirmModal('Apagar save, cache de elencos e chave da API deste aparelho?', 'Apagar tudo', () => { stopLive(); [K.save, K.cache, K.apiKey, K.apiBase, K.reqLog, K.prefs].forEach(lsDel); state.save = null; state.ui.newGame = null; go('inicio'); toast('Dados apagados.'); }, true)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el, e);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !state.live) closeModal(); });
// sliders (tática e intervalo)
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.input) return;
  const k = el.dataset.k, v = Number(el.value);
  const lab = { mentality: mentalityLabel, pressure: x => levelLabel(x, 'Baixa', 'Média', 'Alta') + (el.dataset.input === 'tactic' ? ' · cansa ' + levelLabel(x, 'menos', 'normal', 'mais') : ''), tempo: x => levelLabel(x, 'Lento', 'Normal', 'Rápido') }[k];
  if (el.dataset.input === 'tactic'){ state.save.tactic[k] = v; const l = $('#lbl_' + k); if (l) l.textContent = lab(v); }
  if (el.dataset.input === 'liveTactic' && state.live){ const L = state.live; L.user.sides[L.user.userSide].tactic[k] = v; const l = $('#ht_' + k); if (l) l.textContent = lab(v); }
});
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.input === 'tactic') saveGame(); });

// ── PWA: manifesto e ícone gerados em tempo de execução (arquivo único) ──
function setupPWA(){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
    g.fillStyle = '#0d1117'; g.fillRect(0, 0, 512, 512);
    g.strokeStyle = '#2fbf5b'; g.lineWidth = 26; g.strokeRect(96, 64, 320, 384);
    g.beginPath(); g.moveTo(96, 256); g.lineTo(416, 256); g.stroke();
    g.beginPath(); g.arc(256, 256, 54, 0, Math.PI * 2); g.stroke();
    const png = c.toDataURL('image/png');
    $('#pwaTouchIcon').href = png;
    const manifest = { name: 'Prancheta — Manager Brasileirão', short_name: 'Prancheta', start_url: location.href.split('#')[0], scope: location.href.replace(/[^/]*$/, ''), display: 'standalone', orientation: 'any', background_color: '#0d1117', theme_color: '#0d1117', icons: [{ src: png, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    $('#pwaManifest').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  } catch (e){}
  // service worker opcional (sw.js ao lado deste arquivo) para abrir sem internet
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

function boot(){
  state.save = loadGame();
  if (state.save && state.save.phase === 'season' && userTeam()) validateUserLineup();
  render();
  setupPWA();
}
boot();
</script>
