# ═══════════════════════════════════════════════════════════════════════════
# Publicação no GitHub Pages
#
# Serve dois sites a partir do mesmo repositório:
#   /              → MathRaf  (index.html na raiz, self-contained)
#   /mathref/game/ → Starfarer (compilado a partir de game-src/)
#
# ═══ POR QUE COMPILAR AQUI E NÃO SÓ PUBLICAR A PASTA game/ ═══
#
# A pasta `game/` está commitada e o Pages conseguiria servi-la direto
# ("Deploy from a branch"). O problema é que ela vira uma SEGUNDA fonte da
# verdade: basta alguém alterar `game-src/` e esquecer de rodar o build para
# o site publicado ficar divergindo do código em silêncio — sem erro, sem
# aviso, e sem jeito de perceber a não ser jogando.
#
# Compilando aqui, a fonte é sempre `game-src/`. A pasta `game/` continua
# commitada só como plano B (ver a seção de fallback no README).
#
# ═══ DUAS ORIGENS POSSÍVEIS ═══
#
# O Pages pode servir o site de duas maneiras, e o repositório pode estar em
# qualquer uma delas:
#
#   1. "GitHub Actions"        → serve o artefato que este workflow envia.
#   2. "Deploy from a branch"  → serve uma pasta commitada (aqui: main/docs).
#
# O workflow tenta mudar para (1) e, se não conseguir, escreve o site em
# `docs/` para funcionar em (2). Os dois caminhos levam às mesmas URLs.
# ═══════════════════════════════════════════════════════════════════════════

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions — útil para republicar sem
  # precisar de um commit novo.
  workflow_dispatch:

permissions:
  # `write` por causa do plano B: quando a origem do Pages está presa numa
  # branch, o workflow commita o site compilado em docs/ (ver o passo
  # "Publicar em docs/").
  contents: write
  pages: write
  id-token: write

# Uma publicação por vez. `cancel-in-progress: false` de propósito: cancelar
# um deploy no meio pode deixar o site num estado parcial.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game-src/package-lock.json

      - name: Instalar dependências
        working-directory: game-src
        # `npm ci` e não `npm install`: instala exatamente o que está no
        # lockfile e falha se ele estiver dessincronizado do package.json.
        run: npm ci

      - name: Compilar o jogo
        working-directory: game-src
        run: npm run build

      - name: Verificar o caminho base
        # O `base` do Vite precisa bater com o caminho do Pages. Se alguém
        # mexer nele, o site publicado carrega uma tela preta e o erro só
        # aparece no console do navegador. Falhar aqui é muito mais barato.
        run: |
          if ! grep -q '/mathref/game/assets/' game/index.html; then
            echo "::error::O build não usou o base '/mathref/game/'."
            echo "Confira 'base' em game-src/vite.config.js."
            grep -o 'src="[^"]*"' game/index.html || true
            exit 1
          fi
          echo "Base correto."

      - name: Montar o site
        run: |
          rm -rf _site && mkdir -p _site
          # Copia a raiz do repositório, menos o que é fonte ou ferramenta.
          # A cópia por EXCLUSÃO (em vez de listar o que entra) garante que
          # qualquer arquivo novo na raiz seja publicado sem precisar mexer
          # neste workflow.
          #
          # `tar` e não `rsync`: o rsync existe no runner do GitHub mas não é
          # garantido em todo ambiente, e este passo precisa ser reproduzível
          # localmente para poder ser testado antes de ir pro ar.
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./game-src' \
            --exclude='./node_modules' \
            --exclude='./docs' \
            --exclude='./README.md' \
            --exclude='./.gitignore' \
            --exclude='./_site' \
            . | tar -xf - -C _site
          # Sem isto o Pages roda o Jekyll, que ignora arquivos e pastas
          # começando com underscore e pode engasgar com conteúdo inesperado.
          touch _site/.nojekyll
          echo "--- conteúdo publicado ---"
          find _site -maxdepth 2 -not -path '*/assets/*' | sort

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # `enablement: true` faz a action LIGAR o Pages no repositório caso
          # ele ainda esteja desligado, já com a origem definida como GitHub
          # Actions. Sem isto seria preciso ir em Settings → Pages e escolher
          # a origem à mão antes do primeiro deploy — e o primeiro deploy
          # falharia com um erro pouco óbvio ("Get Pages site failed").
          enablement: true

      # ═══ O BUG QUE ESTE PASSO CONSERTA ═══
      #
      # `enablement: true` no passo acima só LIGA o Pages quando ele está
      # desligado. Se o repositório já tinha Pages ligado apontando para uma
      # branch (o modo antigo, "Deploy from a branch"), a action encontra o
      # site, dá tudo certo, o deploy roda, reporta sucesso — e o site continua
      # servindo a pasta antiga. Foi exatamente o que aconteceu aqui: seis
      # deploys verdes e o site respondendo 404, porque a origem configurada
      # era `main/docs` e o artefato do Actions estava sendo ignorado.
      #
      # Nenhum log acusa isso. O sintoma é um 404 com "The site configured at
      # this address does not contain the requested file" — repare que ele diz
      # que EXISTE um site, só não com esse arquivo. Um site que não existe dá
      # outra mensagem ("There isn't a GitHub Pages site here").
      #
      # Este passo tenta forçar a origem para o Actions e, dê certo ou não,
      # LÊ a origem que está valendo. É a leitura que decide o plano B — e não
      # o sucesso da escrita. A diferença importa: na prática o GITHUB_TOKEN
      # não tem permissão de trocar a origem (a escrita volta 403), então
      # decidir pelo resultado da escrita faria o plano B rodar para sempre,
      # inclusive depois de alguém trocar a origem à mão em Settings → Pages.
      - name: Verificar a origem do Pages
        id: origem
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            && echo "Origem trocada para o GitHub Actions." \
            || echo "Sem permissão para trocar a origem — seguindo com o que estiver configurado."
          tipo=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo desconhecida)
          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"
          echo "Origem atual do Pages: $tipo"

      # ═══ PLANO B ═══
      #
      # Enquanto a origem não for `workflow`, o site publicado continua sendo a
      # pasta `docs/` da branch. Então escrevemos o site compilado lá dentro e
      # commitamos de volta.
      #
      # Para desligar isto de vez: Settings → Pages → Source → GitHub Actions.
      # Na execução seguinte a leitura acima devolve `workflow`, este passo é
      # pulado sozinho, e os commits de build somem.
      #
      # Não é bonito — build commitado é sempre uma segunda fonte da verdade —
      # mas aqui é gerado por CI a partir de `game-src/` a cada push, então
      # nunca diverge do código. E é a única saída que não depende de alguém
      # entrar em Settings → Pages.
      #
      # Commits feitos com o GITHUB_TOKEN não disparam workflows, então isto
      # não vira loop infinito.
      - name: Publicar em docs/ (plano B)
        if: steps.origem.outputs.tipo != 'workflow' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs
          # Remove só o que é site publicado. As notas em markdown que moram
          # em docs/ (FASE-0-STACK.md, STARFARER.md) ficam onde estão.
          rm -rf docs/game docs/index.html docs/.nojekyll
          cp -R _site/. docs/
          git add -A docs
          # O passo de build reescreveu `game/` na raiz. Ela já foi copiada
          # para dentro de docs/; deixá-la suja aqui só atrapalharia o rebase
          # mais abaixo.
          git checkout -- game || true
          if git diff --cached --quiet; then
            echo "docs/ já está atualizado."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: publicar site compilado em docs/ [skip ci]'
          # A branch pode ter andado enquanto o build rodava.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || true
            sleep $((i * 3))
          done
          echo "::error::Não consegui publicar docs/ na main."
          exit 1

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
