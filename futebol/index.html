<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1a0e">
<title>Pixel Futebol 90</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #101218; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Courier New", Courier, monospace; color: #fff;
  }
  canvas#game {
    position: fixed; left: 0; top: 0; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  /* ---------- Telas (menu / fim / pausa) ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(4, 14, 8, .72);
    overflow-y: auto; touch-action: pan-y;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  .hidden { display: none !important; }
  .panel {
    margin: 16px; padding: 18px 20px 20px; max-width: 460px; width: calc(100% - 32px);
    background: #13241a; border: 4px solid #f4f4f4;
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(0,0,0,.6);
    text-align: center; box-sizing: border-box;
  }
  .title {
    font-weight: 900; font-size: clamp(28px, 8vw, 46px); line-height: .95; letter-spacing: 2px;
    color: #ffe14a; text-shadow: 3px 3px 0 #c41e1e, 6px 6px 0 #000; margin: 4px 0 6px;
  }
  .sub { font-weight: 700; font-size: 13px; letter-spacing: 3px; color: #9fe39a; margin-bottom: 14px; }
  .sub b { color: #6fa8ff; } .sub i { color: #ff6b6b; font-style: normal; }
  .label { font-weight: 900; font-size: 13px; letter-spacing: 3px; margin: 10px 0 8px; color: #cfd8cf; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font: 900 16px/1 "Courier New", monospace; letter-spacing: 2px; color: #fff;
    padding: 13px 14px; min-width: 110px; cursor: pointer;
    border: 3px solid #000; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.3);
    background: #2456d6;
  }
  .btn:active { transform: translate(2px, 2px); }
  .btn.easy { background: #2f9e44; } .btn.med { background: #d9a400; } .btn.hard { background: #c92a2a; }
  .btn.small { font-size: 12px; padding: 9px 10px; min-width: 0; background: #33413a; }
  .help { font-size: 12px; line-height: 1.55; color: #cfe3cf; margin-top: 14px; text-align: left;
          background: rgba(0,0,0,.28); padding: 8px 10px; border: 2px solid #2c4a36; }
  .help b { color: #ffe14a; }
  .result { font-weight: 900; font-size: clamp(30px, 9vw, 48px); letter-spacing: 3px; margin: 6px 0 10px; text-shadow: 4px 4px 0 #000; }
  .final { font-weight: 900; font-size: clamp(18px, 5.5vw, 26px); margin-bottom: 12px; }
  .final .b { color: #6fa8ff; } .final .r { color: #ff6b6b; }
  table.stats { margin: 0 auto 16px; border-collapse: collapse; font-size: 14px; font-weight: 700; }
  table.stats td { padding: 4px 10px; }
  table.stats td:first-child { color: #6fa8ff; text-align: right; }
  table.stats td:last-child { color: #ff6b6b; text-align: left; }
  table.stats td.m { color: #cfd8cf; text-align: center; letter-spacing: 1px; }

  /* ---------- Controles de toque ---------- */
  #touch { position: fixed; inset: 0; z-index: 5; pointer-events: none; display: none; }
  #touch.on { display: block; }
  #joyZone { position: absolute; left: 0; top: 16%; width: 50%; bottom: 0; pointer-events: auto; touch-action: none; }
  #joyBase {
    position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.35); background: rgba(0,0,0,.2); pointer-events: none; opacity: .55;
    left: calc(96px + env(safe-area-inset-left)); top: calc(100% - 100px - env(safe-area-inset-bottom));
  }
  #joyBase.live { opacity: 1; }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: rgba(255,255,255,.45); border: 2px solid rgba(255,255,255,.75);
  }
  .tbtn {
    position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font: 900 11px/1.05 "Courier New", monospace; color: #fff; letter-spacing: .5px;
    border: 3px solid rgba(255,255,255,.6); text-shadow: 1px 1px 0 #000; box-sizing: border-box;
  }
  .tbtn.act { filter: brightness(1.6); transform: scale(.93); }
  #bShoot  { width: 86px; height: 86px; right: calc(16px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); background: rgba(215,40,40,.6); font-size: 13px; }
  #bPass   { width: 70px; height: 70px; right: calc(112px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); background: rgba(40,105,230,.6); }
  #bTackle { width: 66px; height: 66px; right: calc(34px + env(safe-area-inset-right)); bottom: calc(118px + env(safe-area-inset-bottom)); background: rgba(235,170,20,.6); font-size: 9px; }
  #bPause  { width: 44px; height: 32px; border-radius: 8px; left: 50%; margin-left: -22px; top: calc(6px + env(safe-area-inset-top)); background: rgba(0,0,0,.45); font-size: 14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="touch">
  <div id="joyZone"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tbtn" id="bTackle" data-a="tackle">CARRI<br>NHO</div>
  <div class="tbtn" id="bPass" data-a="pass">PASSE</div>
  <div class="tbtn" id="bShoot" data-a="shoot">CHUTE</div>
  <div class="tbtn" id="bPause">II</div>
</div>

<div id="menu" class="screen">
  <div class="panel">
    <div class="title">PIXEL<br>FUTEBOL 90</div>
    <div class="sub">5 x 5 &bull; <b>AZUL</b> x <i>VERMELHO</i></div>
    <div class="label">DIFICULDADE</div>
    <div class="row">
      <button class="btn easy" data-diff="facil">FÁCIL</button>
      <button class="btn med" data-diff="medio">MÉDIO</button>
      <button class="btn hard" data-diff="dificil">DIFÍCIL</button>
    </div>
    <div id="kbBox">
      <div class="label">TECLADO</div>
      <div class="row"><button class="btn small" id="schemeBtn">SETAS + A S D Q</button></div>
    </div>
    <div class="help" id="helpText"></div>
  </div>
</div>

<div id="end" class="screen hidden">
  <div class="panel">
    <div class="label">FIM DE JOGO</div>
    <div class="result" id="endResult">EMPATE</div>
    <div class="final" id="endScore"></div>
    <table class="stats" id="endStats"></table>
    <div class="row">
      <button class="btn" id="againBtn">JOGAR DE NOVO</button>
      <button class="btn small" id="menuBtn">MENU</button>
    </div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel">
    <div class="result">PAUSA</div>
    <div class="row">
      <button class="btn" id="resumeBtn">CONTINUAR</button>
      <button class="btn small" id="quitBtn">SAIR</button>
    </div>
  </div>
</div>

<script>
'use strict';
(() => {
// =====================================================================
//  CONSTANTES DO CAMPO (1 unidade do mundo = 1 pixel da tela de baixa resolução)
// =====================================================================
const PW = 520, PH = 800;             // campo (largura x comprimento). Gols em cima e embaixo.
const M = 130;                        // margem: gramado externo + placas + arquibancada
const SW = PW + 2 * M, SH = PH + 2 * M;
const GW = 84, GX1 = PW / 2 - GW / 2, GX2 = PW / 2 + GW / 2;
const NET = 22, BAR = 24;             // profundidade da rede e altura do travessão
const BOX_W = 300, BOX_D = 120, SIX_W = 150, SIX_D = 44;
const CIRCLE_R = 62, PEN_SPOT = 84;
const HALF_TIME = 180;                // 3 minutos por tempo
const G = 300;                        // gravidade da bola
const DECEL = 130;                    // atrito da bola rolando
const ROLE_LIST = ['GK', 'D1', 'D2', 'M', 'F'];

// Posições base: x (fração da largura), profundidade a partir do próprio gol (0..1)
const ROLES = {
  GK: { x: .5,  def: .02, att: .02 },
  D1: { x: .27, def: .17, att: .40 },
  D2: { x: .73, def: .17, att: .40 },
  M:  { x: .5,  def: .32, att: .62 },
  F:  { x: .5,  def: .46, att: .84 },
};
const KICK = { GK: [.5, .03], D1: [.28, .2], D2: [.72, .2], M: [.5, .34], F: [.5, .43] };
const CORNER_ATT = { D1: [.3, .66], D2: [.72, .6], M: [.42, .88], F: [.58, .92] };
const CORNER_DEF = { D1: [.44, .06], D2: [.57, .08], M: [.5, .15], F: [.5, .35] };

const DIFF = {
  facil:   { name: 'FÁCIL',   speed: .86, react: .42, tackle: .5,  steal: .7,  err: .16,  gk: .6,  shootRange: 150, cover: false },
  medio:   { name: 'MÉDIO',   speed: .96, react: .26, tackle: 1.1, steal: 1.3, err: .09,  gk: .8,  shootRange: 170, cover: true },
  dificil: { name: 'DIFÍCIL', speed: 1.05, react: .14, tackle: 2.0, steal: 2.1, err: .045, gk: .95, shootRange: 190, cover: true },
};
const ALLY = { speed: .97, react: .25, tackle: 1.0, steal: 1.2, err: .08, gk: .85, shootRange: 170, cover: true };

const KITS = {
  blue:   { shirt: '#2456d6', det: '#86b6ff', shorts: '#f2f2f2', socks: '#2456d6', num: '#ffffff', pat: 'stripes' },
  red:    { shirt: '#d42a2a', det: '#f5f5f5', shorts: '#1d1d24', socks: '#d42a2a', num: '#ffffff', pat: 'sash' },
  gkBlue: { shirt: '#2fb34a', det: '#12692a', shorts: '#1d1d24', socks: '#2fb34a', num: '#ffffff', pat: 'gk', glove: '#ffffff' },
  gkRed:  { shirt: '#f2c21b', det: '#9a7400', shorts: '#1d1d24', socks: '#f2c21b', num: '#111111', pat: 'gk', glove: '#ff7a1a' },
};
const SKINS = ['#f1c7a1', '#e3ad7f', '#c98d5a', '#a86b3c', '#7a4a28', '#5c3820'];
const HAIRS = ['#1a1a1a', '#2e1c10', '#5a3418', '#8a5a2a', '#d8b24a', '#a8401a'];

// =====================================================================
//  UTILITÁRIOS
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const seeded = s => () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = v => clamp(Math.round(v * f), 0, 255);
  return '#' + ((1 << 24) | (c((n >> 16) & 255) << 16) | (c((n >> 8) & 255) << 8) | c(n & 255)).toString(16).slice(1);
}
// Contorno escuro de 1px em volta de tudo que não é transparente (visual retrô)
function outline(c, rgba = [14, 20, 14, 235]) {
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const id = g.getImageData(0, 0, w, h), d = id.data, src = new Uint8ClampedArray(d);
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && src[(y * w + x) * 4 + 3] > 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (src[i + 3] === 0 && (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1))) {
      d[i] = rgba[0]; d[i + 1] = rgba[1]; d[i + 2] = rgba[2]; d[i + 3] = rgba[3];
    }
  }
  g.putImageData(id, 0, 0);
  return c;
}

// =====================================================================
//  FONTE PIXEL 3x5
// =====================================================================
const GLYPHS = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': '110001010001110',
  '4': '101101111001001', '5': '111100110001110', '6': '011100111101111', '7': '111001010010010', '8': '111101111101111',
  '9': '111101111001110', ':': '000010000010000', '-': '000000111000000', '!': '010010010000010', '.': '000000000000010',
  '+': '000010111010000', '/': '001001010100100', '?': '110001010000010', '#': '101111101111101', "'": '010010000000000',
  ' ': '000000000000000', '%': '101001010100101',
};
const deaccent = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const textCache = new Map();
function textCanvas(str, col, scale, shadow) {
  const key = str + '|' + col + '|' + scale + '|' + shadow;
  let c = textCache.get(key);
  if (c) return c;
  if (textCache.size > 300) textCache.clear();
  const w = Math.max(1, str.length * 4 - 1);
  c = mkCanvas((w + 1) * scale, 6 * scale);
  const g = c.getContext('2d');
  const draw = (ox, oy, cc) => {
    g.fillStyle = cc;
    for (let i = 0; i < str.length; i++) {
      const gl = GLYPHS[str[i]] || GLYPHS['?'];
      for (let k = 0; k < 15; k++) if (gl[k] === '1')
        g.fillRect((ox + i * 4 + (k % 3)) * scale, (oy + ((k / 3) | 0)) * scale, scale, scale);
    }
  };
  if (shadow) draw(1, 1, shadow);
  draw(0, 0, col);
  textCache.set(key, c);
  return c;
}
function drawText(g, str, x, y, col = '#fff', scale = 1, align = 'left', shadow = '#000') {
  const c = textCanvas(deaccent(str), col, scale, shadow);
  const dx = align === 'center' ? x - (c.width - scale) / 2 : align === 'right' ? x - c.width + scale : x;
  g.drawImage(c, Math.round(dx), Math.round(y));
}
// Texto direto em pixels (usado nas placas pré-renderizadas)
function plotText(g, str, x, y, col) {
  str = deaccent(str); g.fillStyle = col;
  for (let i = 0; i < str.length; i++) {
    const gl = GLYPHS[str[i]] || GLYPHS['?'];
    for (let k = 0; k < 15; k++) if (gl[k] === '1') g.fillRect(x + i * 4 + (k % 3), y + ((k / 3) | 0), 1, 1);
  }
}

// =====================================================================
//  ESTÁDIO PRÉ-RENDERIZADO (gramado, linhas, gols, placas, torcida)
// =====================================================================
function pxArc(g, cx, cy, r, a0, a1, keep) {
  const steps = Math.ceil(r * Math.abs(a1 - a0) * 1.6);
  for (let i = 0; i <= steps; i++) {
    const a = a0 + (a1 - a0) * i / steps;
    const x = Math.round(cx + Math.cos(a) * r - 1), y = Math.round(cy + Math.sin(a) * r - 1);
    if (!keep || keep(x, y)) g.fillRect(x, y, 2, 2);
  }
}
function buildStadiumBase() {
  const c = mkCanvas(SW, SH), g = c.getContext('2d');
  const R = seeded(1234);
  g.translate(M, M);
  g.fillStyle = '#101218'; g.fillRect(-M, -M, SW, SH);

  // Gramado com faixas
  const GR = 50;
  for (let i = -2; i * 40 < PH + GR; i++) {
    const y0 = Math.max(-GR, i * 40), y1 = Math.min(PH + GR, (i + 1) * 40);
    if (y1 <= y0) continue;
    g.fillStyle = (i & 1) ? '#3f8c33' : '#4b9d3c';
    g.fillRect(-GR, y0, PW + 2 * GR, y1 - y0);
  }
  for (let i = 0; i < 9000; i++) {
    const x = (-GR + R() * (PW + 2 * GR)) | 0, y = (-GR + R() * (PH + 2 * GR)) | 0;
    g.fillStyle = R() < .55 ? 'rgba(0,30,0,.14)' : 'rgba(255,255,200,.08)';
    g.fillRect(x, y, 1, 1 + (R() < .3 ? 1 : 0));
  }
  // Grama gasta na frente dos gols e no meio
  const worn = (x, y, rx, ry) => {
    for (let i = 0; i < 700; i++) {
      const a = R() * TAU, rr = Math.sqrt(R());
      g.fillStyle = R() < .5 ? 'rgba(120,95,40,.16)' : 'rgba(90,120,40,.14)';
      g.fillRect((x + Math.cos(a) * rx * rr) | 0, (y + Math.sin(a) * ry * rr) | 0, 2, 1);
    }
  };
  worn(PW / 2, 18, 60, 22); worn(PW / 2, PH - 18, 60, 22); worn(PW / 2, PH / 2, 40, 30);

  // Linhas
  g.fillStyle = '#f4f4f0';
  g.fillRect(0, 0, PW, 2); g.fillRect(0, PH - 2, PW, 2); g.fillRect(0, 0, 2, PH); g.fillRect(PW - 2, 0, 2, PH);
  g.fillRect(0, PH / 2 - 1, PW, 2);
  pxArc(g, PW / 2, PH / 2, CIRCLE_R, 0, TAU);
  g.fillRect(PW / 2 - 2, PH / 2 - 2, 4, 4);
  for (const top of [true, false]) {
    const Y = v => top ? v : PH - v;
    const bx = (PW - BOX_W) / 2, sx = (PW - SIX_W) / 2;
    g.fillRect(bx, Math.min(Y(0), Y(BOX_D)), 2, BOX_D); g.fillRect(bx + BOX_W - 2, Math.min(Y(0), Y(BOX_D)), 2, BOX_D);
    g.fillRect(bx, top ? BOX_D - 2 : PH - BOX_D, BOX_W, 2);
    g.fillRect(sx, Math.min(Y(0), Y(SIX_D)), 2, SIX_D); g.fillRect(sx + SIX_W - 2, Math.min(Y(0), Y(SIX_D)), 2, SIX_D);
    g.fillRect(sx, top ? SIX_D - 2 : PH - SIX_D, SIX_W, 2);
    g.fillRect(PW / 2 - 1, Y(PEN_SPOT) - 1, 3, 3);
    pxArc(g, PW / 2, Y(PEN_SPOT), 52, 0, TAU, (x, y) => top ? y > BOX_D - 1 : y < PH - BOX_D - 1);
  }
  pxArc(g, 0, 0, 9, 0, Math.PI / 2); pxArc(g, PW, 0, 9, Math.PI / 2, Math.PI);
  pxArc(g, 0, PH, 9, -Math.PI / 2, 0); pxArc(g, PW, PH, 9, Math.PI, Math.PI * 1.5);
  // Bandeirinhas de escanteio
  for (const [cx, cy] of [[0, 0], [PW, 0], [0, PH], [PW, PH]]) {
    g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(cx, cy, 6, 2);
    g.fillStyle = '#eeeeee'; g.fillRect(cx, cy - 10, 1, 10);
    g.fillStyle = '#ffcf00'; g.fillRect(cx + 1, cy - 10, 4, 3);
    g.fillStyle = '#e02020'; g.fillRect(cx + 1, cy - 9, 4, 1);
  }

  // Gol de cima (visto de frente, fica atrás dos jogadores)
  g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(GX1, -NET, GW, NET);
  g.fillStyle = 'rgba(230,235,230,.5)';
  for (let x = GX1; x <= GX2; x += 3) g.fillRect(x, -NET - BAR, 1, NET + BAR);
  for (let y = -NET - BAR; y <= 0; y += 3) g.fillRect(GX1, y, GW, 1);
  g.fillStyle = '#bfc4bf';
  g.fillRect(GX1, -NET - BAR, GW, 1); g.fillRect(GX1, -NET - BAR, 1, BAR); g.fillRect(GX2 - 1, -NET - BAR, 1, BAR);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(GX1 + 3, 1, GW, 2);
  g.fillStyle = '#ffffff';
  g.fillRect(GX1 - 2, -BAR, 3, BAR + 1); g.fillRect(GX2 - 1, -BAR, 3, BAR + 1); g.fillRect(GX1 - 2, -BAR, GW + 4, 3);
  // Sombra no chão do gol de baixo (a estrutura é desenhada por cima dos jogadores)
  g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(GX1, PH, GW, NET);

  // Placas de publicidade
  const BRANDS = ['SUPER BOLA', 'GOL COLA', 'PIXEL TV', 'CRAQUE', 'RETRO 90', 'TURBO', 'MEGA SPORT', 'FUTEBOL+', 'BOLA 8', 'PIXEL BANK'];
  const COLS = [['#1d3fbf', '#ffffff'], ['#ffd400', '#c01010'], ['#e02020', '#ffffff'], ['#ffffff', '#0a7a2a'], ['#141414', '#ffcc00'], ['#00a0d0', '#ffffff']];
  let bi = 0;
  const panel = (x, y, w, h, vertical) => {

  setBanner(own ? 'GOL CONTRA!' : 'GOOOL!', 3.4, true, '#ffe14a', own ? st.name : `#${scorer.num} ${st.name}`);
  Snd.roar(); Snd.whistle(1, .2);
  confetti(PW / 2, lineY);
}
function setupKickoff(tid) {
  for (const t of teams) for (const p of t.players) {
    let [x, d] = KICK[p.role];
    if (p.role === 'F') d = t.id === tid ? .5 - 7 / PH : .5 - (CIRCLE_R + 10) / PH;
    if (p.role === 'M' && t.id === tid) { x = .38; d = .46; }
    Object.assign(p, { x: x * PW, y: ownGoalY(t) + sgn(t) * d * PH, vx: 0, vy: 0, dvx: 0, dvy: 0, z: 0,
                       state: 'normal', charging: false, holding: false, cheer: false, pose: 'run', poseT: 0,
                       face: t.attackUp ? -Math.PI / 2 : Math.PI / 2, noTouch: 0, protect: 0 });
  }
  Object.assign(ball, { x: PW / 2, y: PH / 2, z: 0, vx: 0, vy: 0, vz: 0, owner: null, passTarget: null, lock: false, inNet: null, lastTouchTeam: tid });
  game.state = 'kickoff'; game.timer = 1.3; game.kickTeam = tid; game.setp = null; game.pending = null; game.scorer = null;
  const kicker = teams[tid].players.find(p => p.role === 'F');
  if (teams[tid].human && !game.demo) setCtrl(kicker);
  else if (!game.demo) setCtrl(teams[0].players.find(p => p.role === 'F'));
}
function endHalf() {
  if (game.half === 1) { game.state = 'halftime'; game.timer = 3; setBanner('INTERVALO', 3, true, '#ffffff'); Snd.whistle(2, .25); }
  else { game.state = 'fulltime'; game.timer = 3; setBanner('FIM DE JOGO', 3, true, '#ffffff'); Snd.whistle(3, .25); }
  for (const p of players) p.charging = false;
}

// =====================================================================
//  PARTÍCULAS
// =====================================================================
function puff(x, y, n, col) {
  for (let i = 0; i < n && parts.length < 500; i++)
    parts.push({ x, y, z: 0, vx: rnd(-35, 35), vy: rnd(-35, 35), vz: rnd(10, 40), life: rnd(.25, .5), col, g: 150, w: 1 });
}
function confetti(x, y) {
  const C = ['#ffe14a', '#ffffff', '#2456d6', '#d42a2a', '#2fb34a', '#ff7a1a'];
  for (let i = 0; i < 140 && parts.length < 500; i++)
    parts.push({ x: x + rnd(-60, 60), y: y + rnd(-20, 20), z: rnd(0, 20), vx: rnd(-70, 70), vy: rnd(-70, 70), vz: rnd(60, 160),
                 life: rnd(1.6, 3), col: C[i % C.length], g: 70, w: 2 });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt;
    if (q.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vz -= q.g * dt; q.z += q.vz * dt;
    if (q.z < 0) { q.z = 0; q.vx *= .8; q.vy *= .8; q.vz = 0; }
    if (q.w > 1) { q.vx *= 1 - dt; q.vy *= 1 - dt; }
  }
}

// =====================================================================
//  LOOP PRINCIPAL
// =====================================================================
function update(dt) {
  game.time += dt;
  if (game.banner) { game.banner.t -= dt; if (game.banner.t <= 0) game.banner = null; }
  if (game.crowdJump > 0) game.crowdJump -= dt;
  const st = game.state;
  if (st === 'play' || st === 'out' || st === 'setpiece') {
    game.clock += dt;
    game.stats.poss[ball.owner ? ball.owner.team.id : ball.lastTouchTeam] += dt;
    if (game.clock >= HALF_TIME) { game.clock = HALF_TIME; endHalf(); }
  }
  switch (game.state) {
    case 'kickoff':
      game.timer -= dt;
      if (game.timer <= 0) {
        game.state = 'play';
        const k = teams[game.kickTeam].players.find(p => p.role === 'F');
        giveBall(k); k.protect = .8;
        Snd.whistle(1, .2);
      }
      break;
    case 'out':
      game.timer -= dt;
      if (game.timer <= 0) setupSetpiece();
      break;
    case 'setpiece': {
      const s = game.setp;
      s.t += dt;
      const humanTaker = !game.demo && teams[s.team].human && s.taker.role !== 'GK';
      if ((!humanTaker && s.t > 1.4) || s.t > 7) aiSetpiece();
      break;
    }
    case 'goal':
      game.timer -= dt;
      if (game.timer <= 0) setupKickoff(game.kickTeam);
      break;
    case 'halftime':
      game.timer -= dt;
      if (game.timer <= 0) {
        for (const t of teams) t.attackUp = !t.attackUp;
        game.half = 2; game.clock = 0;
        setupKickoff(1 - game.firstKick);
        setBanner('2º TEMPO', 1.5, false);
      }
      break;
    case 'fulltime':
      game.timer -= dt;
      if (game.timer <= 0) endMatch();
      break;
  }
  if (!game.demo && (game.state === 'play' || game.state === 'setpiece' || game.state === 'out')) updateControl(dt);
  handleHumanActions(dt);
  computeRoles();
  const n = Math.max(1, Math.ceil(dt / .0085)), h = dt / n;
  for (let i = 0; i < n; i++) {
    for (const p of players) updatePlayer(p, h);
    separate();
    updateBall(h);
    if (game.state === 'play') interactions(h);
  }
  updateParts(dt);
  updateCamera(dt);
}
function updateCamera(dt) {
  let tx = ball.x + ball.vx * .25, ty = ball.y - ball.z * .5 + ball.vy * .3;
  if (game.state === 'goal' && game.scorer) { tx = lerp(tx, game.scorer.x, .5); ty = lerp(ty, game.scorer.y, .5); }
  const k = 1 - Math.exp(-dt * 3.5);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  cam.x = VW >= SW ? PW / 2 : clamp(cam.x, -M + VW / 2, PW + M - VW / 2);
  cam.y = VH >= SH ? PH / 2 : clamp(cam.y, -M + VH / 2, PH + M - VH / 2);
}

// =====================================================================
//  RENDERIZAÇÃO (buffer em baixa resolução ampliado sem suavização)
// =====================================================================
const cv = $('game'), ctx = cv.getContext('2d', { alpha: false });
const buf = mkCanvas(320, 240), bctx = buf.getContext('2d');
let S = 3, VW = 320, VH = 240;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = window.innerWidth, h = window.innerHeight;
  const dw = Math.round(w * dpr), dh = Math.round(h * dpr);
  S = Math.max(1, Math.round(Math.min(dw, dh) / 250));
  VW = Math.ceil(dw / S); VH = Math.ceil(dh / S);
  buf.width = VW; buf.height = VH;
  cv.width = VW * S; cv.height = VH * S;
  cv.style.width = (VW * S / dpr) + 'px'; cv.style.height = (VH * S / dpr) + 'px';
  ctx.imageSmoothingEnabled = false; bctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

const viewOf = a => { const c = Math.cos(a), s = Math.sin(a); return c > .7 ? 'R' : c < -.7 ? 'L' : s > 0 ? 'D' : 'U'; };
const drawList = [];
function drawPlayer(b, p) {
  const x = Math.round(p.x), y = Math.round(p.y), z = Math.round(p.z);
  if (p.state === 'slide' || (p.state === 'down' && p.lie === 'slide')) {
    const left = Math.cos(p.slideAng) < 0;
    const c = sprite(p, left ? 'L' : 'R', 0, 'slide');
    b.save(); b.translate(x, y - 4); b.rotate(left ? p.slideAng - Math.PI : p.slideAng);
    b.drawImage(c, -(c.width >> 1), -(c.height >> 1)); b.restore();
    return;
  }
  if (p.state === 'dive' || (p.state === 'down' && p.lie === 'dive')) {
    const c = sprite(p, p.diveDir < 0 ? 'L' : 'R', 0, 'dive');
    b.drawImage(c, x - (c.width >> 1), y - 10 - z);
    return;
  }
  const view = viewOf(p.face);
  let pose = 'run', frame = 1;
  const throwing = game.setp && game.setp.taker === p && game.setp.type === 'throw';
  if (p.cheer || throwing) pose = 'cheer';
  else if (p.poseT > 0) pose = p.pose === 'cheer' ? 'cheer' : 'kick';
  else if (hyp(p.vx, p.vy) > 8) frame = Math.floor(p.animT) & 3;
  b.drawImage(sprite(p, view, pose === 'run' ? frame : 0, pose), x - 8, y - 21 - z);
}
function drawBall(b) {
  const bz = Math.round(ball.z), f = ((ball.spin / 7) | 0) & 1;
  const c = bz > 12 ? ballBig[f] : ballSmall[f];
  b.drawImage(c, Math.round(ball.x) - (c.width >> 1), Math.round(ball.y) - bz - c.height + 2);
}
function blitStadium(b, img, vx, vy) {
  let sx = vx + M, sy = vy + M, dx = 0, dy = 0, w = VW, h = VH;
  if (sx < 0) { dx = -sx; w += sx; sx = 0; }
  if (sy < 0) { dy = -sy; h += sy; sy = 0; }
  if (sx + w > SW) w = SW - sx;
  if (sy + h > SH) h = SH - sy;
  if (w > 0 && h > 0) b.drawImage(img, sx, sy, w, h, dx, dy, w, h);
}
function render() {
  const b = bctx;
  b.imageSmoothingEnabled = false;
  const vx = Math.round(cam.x - VW / 2), vy = Math.round(cam.y - VH / 2);
  b.fillStyle = '#101218'; b.fillRect(0, 0, VW, VH);
  const img = (game.crowdJump > 0 && (Math.floor(game.time * 7) & 1)) ? stadiumB : stadiumA;
  blitStadium(b, img, vx, vy);
  b.save(); b.translate(-vx, -vy);

  // Sombras
  for (const p of players) {
    const lying = p.state === 'slide' || p.state === 'dive' || p.state === 'down';
    const sh = lying ? shadowLg : shadowSm;
    b.drawImage(sh, Math.round(p.x) - (sh.width >> 1), Math.round(p.y) - (lying ? 5 : 2));
  }
  b.fillStyle = 'rgba(0,0,0,.35)';
  const bsx = Math.round(ball.x + ball.z * .35), bsy = Math.round(ball.y);
  b.fillRect(bsx - 2, bsy - 1, 4, 2); if (ball.z < 12) b.fillRect(bsx - 1, bsy - 2, 2, 1);

  // Indicador do jogador controlado
  const cp = controlled && !game.demo ? controlled : null;
  if (cp) {
    const ring = (Math.floor(game.time * 5) & 1) ? ringA : ringB;
    b.drawImage(ring, Math.round(cp.x) - 9, Math.round(cp.y) - 4);
  }

  // Jogadores e bola ordenados por profundidade
  drawList.length = 0;
  for (const p of players) drawList.push(p);
  drawList.push(ball);
  drawList.sort((a, c) => a.y - c.y);
  for (const e of drawList) e === ball ? drawBall(b) : drawPlayer(b, e);

  b.drawImage(goalOverlay, GX1 - 4, PH - BAR - 2);

  if (cp) {
    const x = Math.round(cp.x), y = Math.round(cp.y) - 27 - Math.round(cp.z);
    b.fillStyle = '#ffe600';
    b.fillRect(x - 2, y, 5, 1); b.fillRect(x - 1, y + 1, 3, 1); b.fillRect(x, y + 2, 1, 1);
    const taker = game.state === 'setpiece' && game.setp && game.setp.taker === cp;
    if (ball.owner === cp || taker) {
      const ax = Math.cos(cp.aim), ay = Math.sin(cp.aim);
      b.fillStyle = 'rgba(255,240,80,.9)';
      for (let i = 0; i < (taker ? 6 : 3); i++) {
        const d = 9 + i * 4;
        b.fillRect(Math.round(ball.x + ax * d) - 1, Math.round(ball.y - ball.z + ay * d) - 1, 2, 2);
      }
    }
    if (cp.charging) {
      const bx = x - 9, by = y - 6;
      b.fillStyle = '#000'; b.fillRect(bx, by, 18, 4);
      const w = Math.round(cp.charge * 16);
      b.fillStyle = cp.charge < .45 ? '#4ee04e' : cp.charge < .8 ? '#ffd21a' : '#ff3b3b';
      b.fillRect(bx + 1, by + 1, w, 2);
    }
  }
  for (const q of parts) { b.fillStyle = q.col; b.fillRect(Math.round(q.x), Math.round(q.y - q.z), q.w, 1); }
  b.restore();

  if (!game.demo) drawHUD(b);
  else if (game.banner && game.banner.big) drawBanner(b);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, VW, VH, 0, 0, VW * S, VH * S);
}
function drawBanner(b) {
  const bn = game.banner;
  if (!bn) return;
  const sc = bn.big ? (VW < 300 ? 3 : 4) : 2;
  const wob = bn.big ? Math.round(Math.sin(game.time * 12) * 2) : 0;
  const y = Math.round(VH * .3);
  drawText(b, bn.text, VW / 2, y + wob, bn.col, sc, 'center', bn.big ? '#b01818' : '#000');
  if (bn.sub) drawText(b, bn.sub, VW / 2, y + sc * 6 + 5, '#ffffff', 1, 'center');
}
function drawHUD(b) {
  const pad = 4;
  b.fillStyle = 'rgba(0,0,0,.6)'; b.fillRect(pad - 1, pad - 1, 64, 20);
  b.fillStyle = teams[0].kit.shirt; b.fillRect(pad + 2, pad + 2, 3, 5);
  b.fillStyle = teams[1].kit.shirt; b.fillRect(pad + 55, pad + 2, 3, 5);
  drawText(b, `AZU ${game.score[0]}-${game.score[1]} VER`, pad + 8, pad + 2, '#ffffff');
  const secs = Math.floor(game.clock), mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
  drawText(b, `${game.half}T ${mm}:${ss}`, pad + 8, pad + 10, '#ffe14a');

  // Radar
  const rs = .08, rw = Math.round(PW * rs), rh = Math.round(PH * rs), rx = VW - rw - pad, ry = pad;
  b.fillStyle = 'rgba(0,40,0,.6)'; b.fillRect(rx, ry, rw, rh);
  b.fillStyle = 'rgba(255,255,255,.45)';
  b.fillRect(rx, ry, rw, 1); b.fillRect(rx, ry + rh - 1, rw, 1); b.fillRect(rx, ry, 1, rh); b.fillRect(rx + rw - 1, ry, 1, rh);
  b.fillRect(rx, ry + (rh >> 1), rw, 1);
  b.fillStyle = '#ffffff'; b.fillRect(rx + (rw >> 1) - 3, ry - 1, 7, 1); b.fillRect(rx + (rw >> 1) - 3, ry + rh, 7, 1);
  const blink = Math.floor(game.time * 6) & 1;
  for (const p of players) {
    b.fillStyle = p === controlled && blink ? '#ffe600' : p.team.id === 0 ? '#5aa0ff' : '#ff4a4a';
    b.fillRect(Math.round(rx + clamp(p.x, 0, PW) * rs) - 1, Math.round(ry + clamp(p.y, 0, PH) * rs) - 1, 2, 2);
  }
  b.fillStyle = '#ffffff';
  b.fillRect(Math.round(rx + clamp(ball.x, 0, PW) * rs), Math.round(ry + clamp(ball.y, 0, PH) * rs), 1, 1);

  if (game.state === 'setpiece' && game.setp && game.setp.team === 0 && game.setp.taker === controlled && Math.floor(game.time * 2) & 1)
    drawText(b, 'A: PASSE  S: CHUTE', VW / 2, VH - 12, '#ffe14a', 1, 'center');
  drawBanner(b);
}

// =====================================================================
//  PARTIDA / TELAS
// =====================================================================
const menuEl = $('menu'), endEl = $('end'), pauseEl = $('pause');
function startMatch(diff, demo) {
  game.diff = diff; game.demo = demo;
  game.score = [0, 0]; game.half = 1; game.clock = 0;
  game.stats = { shots: [0, 0], poss: [0, 0] };
  game.banner = null; game.crowdJump = 0; game.paused = false; game.running = true;
  teams[0].attackUp = true; teams[1].attackUp = false;
  teams[0].human = !demo;
  controlled = null; ctrlCD = 0;
  parts.length = 0;
  for (const a in btn) { btn[a].down = false; btn[a].hit = false; }
  game.firstKick = Math.random() < .5 ? 0 : 1;
  setupKickoff(game.firstKick);
  cam.x = PW / 2; cam.y = PH / 2;
  Snd.on = !demo; Snd.setAmb(demo ? 0 : .05, 1);
  endEl.classList.add('hidden'); pauseEl.classList.add('hidden');
  touchEl.classList.toggle('on', isTouch && !demo);
  if (!demo) { menuEl.classList.add('hidden'); Snd.whistle(1, .3); }
}
function endMatch() {
  if (game.demo) { startMatch('medio', true); return; }
  game.running = false;
  touchEl.classList.remove('on');
  Snd.setAmb(0, 2);
  const [a, b] = game.score;
  const res = $('endResult');
  res.textContent = a > b ? 'VITÓRIA!' : a < b ? 'DERROTA' : 'EMPATE';
  res.style.color = a > b ? '#ffe14a' : a < b ? '#ff6b6b' : '#ffffff';
  $('endScore').innerHTML = `<span class="b">AZUL</span> ${a} x ${b} <span class="r">VERMELHO</span>`;
  const pt = game.stats.poss[0] + game.stats.poss[1] || 1, p0 = Math.round(game.stats.poss[0] / pt * 100);
  $('endStats').innerHTML =
    `<tr><td>${game.stats.shots[0]}</td><td class="m">FINALIZAÇÕES</td><td>${game.stats.shots[1]}</td></tr>` +
    `<tr><td>${p0}%</td><td class="m">POSSE DE BOLA</td><td>${100 - p0}%</td></tr>` +
    `<tr><td></td><td class="m">NÍVEL: ${DIFF[game.diff].name}</td><td></td></tr>`;
  endEl.classList.remove('hidden');
}
function goMenu() {
  endEl.classList.add('hidden'); pauseEl.classList.add('hidden');
  startMatch('medio', true);
  menuEl.classList.remove('hidden');
}
function togglePause() {
  if (game.demo || !game.running) return;
  game.paused = !game.paused;
  pauseEl.classList.toggle('hidden', !game.paused);
  for (const a in btn) { btn[a].down = false; btn[a].hit = false; }
  Snd.setAmb(game.paused ? 0 : .05, .3);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && !game.paused && !game.demo && game.running) togglePause(); });
document.querySelectorAll('[data-diff]').forEach(el => el.addEventListener('click', () => { Snd.init(); startMatch(el.dataset.diff, false); }));
$('againBtn').addEventListener('click', () => { Snd.init(); startMatch(game.diff, false); });
$('menuBtn').addEventListener('click', goMenu);
$('resumeBtn').addEventListener('click', togglePause);
$('quitBtn').addEventListener('click', goMenu);
const SCHEMES = ['SETAS + A S D Q', 'WASD + J K L U'];
function refreshHelp() {
  $('schemeBtn').textContent = SCHEMES[scheme];
  const k = scheme === 0
    ? '<b>Setas</b> movem &bull; <b>A</b> passe &bull; <b>S</b> chute (segure p/ força) &bull; <b>D</b> carrinho &bull; <b>Q</b> troca jogador'
    : '<b>WASD</b> movem &bull; <b>J</b> passe &bull; <b>K</b> chute (segure p/ força) &bull; <b>L</b> carrinho &bull; <b>U</b> troca jogador';
  const t = '<b>Joystick</b> à esquerda &bull; <b>PASSE</b>, <b>CHUTE</b> (segure p/ força) e <b>CARRINHO</b> à direita. A troca de jogador é automática (ou toque PASSE sem a bola).';
  $('helpText').innerHTML = (isTouch ? t + '<br>' : '') + (isTouch && !matchMedia('(pointer:fine)').matches ? '' : k + '<br>') +
    'Chute forte demais sobe e pode passar por cima do travessão. <b>P</b>/<b>Esc</b> pausa.';
  $('kbBox').classList.toggle('hidden', isTouch && !matchMedia('(pointer:fine)').matches);
}
$('schemeBtn').addEventListener('click', () => {
  scheme = 1 - scheme; keys.clear();
  try { localStorage.setItem('pf90-scheme', String(scheme)); } catch (e) {}
  refreshHelp();
});
refreshHelp();

makeTeams();
startMatch('medio', true);

let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = last ? (ts - last) / 1000 : 1 / 60;
  last = ts;
  if (dt <= 0) return;
  if (dt > .05) dt = .05;
  if (game.running && !game.paused) update(dt);
  render();
}
requestAnimationFrame(frame);

// Gancho para testes automatizados
window.__pf90 = { game, ball, get players() { return players; }, get controlled() { return controlled; }, startMatch, press, release, update, render };
})();
</script>
