<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RAFAEL PAOLI SHOOTER 3D: REVOLUTION</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#dfe8f5}
  #game{position:fixed;inset:0;display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #ui > *{pointer-events:auto}
  #boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 60%,#0d1630 0%,#03050a 70%);transition:opacity .8s}
  #boot.hide{opacity:0;pointer-events:none}
  #boot h1{font-weight:200;letter-spacing:.5em;font-size:clamp(14px,2.2vw,26px);margin:0 0 .2em;text-align:center}
  #boot h2{font-weight:800;letter-spacing:.35em;font-size:clamp(22px,4.4vw,58px);margin:0;background:linear-gradient(90deg,#ffd27a,#ff7a3c 50%,#c43cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
  #boot .bar{width:min(420px,70vw);height:2px;background:#ffffff18;margin-top:40px;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5e3a);transition:width .25s}
  #boot .msg{margin-top:12px;font-size:12px;letter-spacing:.2em;opacity:.6;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot">
  <h1>RAFAEL PAOLI</h1>
  <h2>SHOOTER 3D: REVOLUTION</h2>
  <div class="bar"><i></i></div>
  <div class="msg">iniciando motor</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
