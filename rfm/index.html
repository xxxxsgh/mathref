  for (let i = 0; i < 20; i++) genClub(rng, i, reps[i], used, colors[i]);
  // Agentes livres
  for (let i = 0; i < 45; i++) genPlayer(rng, { pos: rng.pick(POS), target: rng.range(52, 72), club: null });
  G.fixtures = genFixtures(rng, G.clubs.map(c => c.id));
  for (const c of G.clubs) autoPick(c);
  G.rngState = rng.s;
  WR = new RNG(G.rngState);
  return G;
}

/* ============================================================================
   4. REGRAS DE JOGADOR
   ============================================================================ */
function ovrFor(attrs, pos) {
  const w = POS_W[pos]; let s = 0, t = 0;
  for (const k in w) { s += attrs[k] * w[k]; t += w[k]; }
  return clamp(Math.round((s / t) * 5 - 2), 1, 99);
}
function refreshPlayer(p) { p.ovr = ovrFor(p.attrs, p.pos); p.value = computeValue(p); }

/** Overall do jogador atuando numa função (com penalidade por adaptação). */
function ovrAt(p, role) {
  if (role === p.pos) return p.ovr;
  if (role === 'GOL' || p.pos === 'GOL') return Math.round(ovrFor(p.attrs, role) * 0.45);
  const f = COMPAT[p.pos].includes(role) ? 0.95 : 0.8;
  return Math.round(Math.min(ovrFor(p.attrs, role), p.ovr) * f);
}
/** 0 = posição natural, 1 = adaptado, 2 = improvisado. */
function fitLevel(p, role) { return role === p.pos ? 0 : COMPAT[p.pos].includes(role) ? 1 : 2; }

function computeValue(p) {
  const base = 250000 * Math.pow(1.12, p.ovr - 50);
  let ageF = p.age <= 21 ? 1.3 + (p.pot - p.ovr) / 35 : p.age <= 27 ? 1.15 : p.age <= 30 ? 0.9 : p.age <= 32 ? 0.6 : 0.35;
  const yrs = p.contract - (G ? G.year : START_YEAR);
  const cF = yrs <= 0 ? 0.55 : yrs === 1 ? 0.8 : 1;
  return niceRound(Math.max(20000, base * ageF * cF));
}
function wageFor(ovr, rep) { return niceRound(1000 * Math.pow(1.11, ovr - 50) * (0.7 + rep / 150)); }
function demandWage(p, rep) {
  let w = wageFor(p.ovr, rep);
  if (p.age <= 20) w *= 0.6;
  if (p.age >= 32) w *= 0.85;
  return niceRound(Math.max(500, w));
}
function squadWages(club) { return sum(club.squad, id => G.players[id].wage); }
const available = p => p && p.inj <= 0 && p.susp <= 0;
function playerEff(p) { return (0.7 + 0.3 * p.cond / 100) * (0.93 + 0.14 * p.morale / 100); }

/** Melhor distribuição gulosa de jogadores nas vagas de uma formação. */
function assignSlots(roles, ids, useCond = true) {
  const pairs = [];
  ids.forEach(id => {
    const p = P(id);
    roles.forEach((r, si) => pairs.push({ id, si, s: ovrAt(p, r) * (useCond ? (0.75 + 0.25 * p.cond / 100) : 1) + (r === p.pos ? 2 : 0) }));
  });
  pairs.sort((a, b) => b.s - a.s);
  const out = new Array(roles.length).fill(null), usedP = new Set();
  for (const pr of pairs) {
    if (out[pr.si] !== null || usedP.has(pr.id)) continue;
    out[pr.si] = pr.id; usedP.add(pr.id);
  }
  return out;
}
/** Escalação automática: titulares + banco (com goleiro reserva se possível). */
function autoPick(club) {
  const roles = FORMATIONS[club.tactic.formation].map(s => s[0]);
  const avail = club.squad.filter(id => available(P(id)));
  club.lineup = assignSlots(roles, avail);
  const rest = avail.filter(id => !club.lineup.includes(id)).sort((a, b) => P(b).ovr - P(a).ovr);
  const bench = [];
  const gk = rest.find(id => P(id).pos === 'GOL');
  if (gk) bench.push(gk);
  for (const id of rest) { if (bench.length >= BENCH_SIZE) break; if (!bench.includes(id)) bench.push(id); }
  club.bench = bench;
}
/** Rearranja os 11 atuais quando a formação muda. */
function reshapeLineup(club) {
  const roles = FORMATIONS[club.tactic.formation].map(s => s[0]);
  const cur = club.lineup.filter(id => id != null);
  club.lineup = assignSlots(roles, cur, false);
}
function lineupProblems(club) {
  const probs = [];
  const roles = FORMATIONS[club.tactic.formation].map(s => s[0]);
  const gk = club.lineup[roles.indexOf('GOL')];
  if (gk != null && P(gk) && P(gk).pos !== 'GOL') probs.push('Sem goleiro de ofício no gol');
  club.lineup.forEach((id, i) => {
    if (id == null) probs.push('Vaga vazia na escalação');
    else if (!available(P(id))) probs.push(`${shortName(P(id))} está ${P(id).inj > 0 ? 'lesionado' : 'suspenso'}`);
  });
  return probs;
}
function teamOvr(club) {
  const roles = FORMATIONS[club.tactic.formation].map(s => s[0]);
  const ids = club.lineup.length ? club.lineup : [];
  const vals = ids.map((id, i) => id != null && P(id) ? ovrAt(P(id), roles[i]) : 0);
  return vals.length ? Math.round(sum(vals) / 11) : 0;
}
/** Força média do elenco (usada na tela inicial e pela IA). */
function squadRating(club) {
  const best = club.squad.map(id => P(id).ovr).sort((a, b) => b - a).slice(0, 14);
  return Math.round(sum(best) / Math.max(1, best.length));
}

/* ============================================================================
   5. MOTOR DE SIMULAÇÃO
   Independente do DOM e do estado global de UI: recebe as configurações dos
   dois lados, uma semente e uma função que devolve o jogador pelo id.
   Mesma semente + mesmas entradas = mesma partida, minuto a minuto.
   ============================================================================ */
const TEMPO_VOL = [0.86, 1, 1.15];
const PRESS_FOUL = [0.85, 1, 1.3];
const PRESS_FAT = [0.85, 1, 1.3];
const TEMPO_FAT = [0.9, 1, 1.2];
const INJURIES = [
  ['Pancada no tornozelo', 1, 30], ['Estiramento na coxa', 2, 24], ['Contratura muscular', 2, 18], ['Entorse no tornozelo', 3, 14],
  ['Lesão na panturrilha', 4, 9], ['Distensão no posterior da coxa', 5, 7], ['Lesão no joelho', 8, 4], ['Fratura no pé', 12, 2], ['Ruptura de ligamento', 24, 1],
];

const COMM = {
  goal: ['GOOOL! {p} finaliza e não dá chances para {gk}!', 'GOL! {p} solta a bomba e estufa a rede!', 'É GOL! {p} toca na saída de {gk}!',
    'GOOOOL! {p} aparece livre e manda para o fundo da rede!', 'GOL! Chute colocado de {p}, no ângulo!', 'GOL! {p} domina, gira e marca um golaço!'],
  goalH: ['GOL DE CABEÇA! {p} sobe mais que todo mundo!', 'GOOOL! {p} testa firme após o cruzamento!'],
  assist: ['Assistência de {a}.', 'Passe perfeito de {a}.', 'Grande jogada de {a}.', 'Cruzamento na medida de {a}.'],
  save: ['{gk} faz grande defesa no chute de {p}!', 'Que defesa! {gk} espalma a finalização de {p}.', '{p} chuta forte, mas {gk} segura firme.',
    '{gk} sai bem e abafa {p}!', 'Cabeçada de {p}, {gk} pega no reflexo!'],
  miss: ['{p} finaliza por cima do gol.', '{p} chuta e a bola passa raspando a trave!', 'Na trave! {p} quase marca!', '{p} pega mal na bola, para fora.',
    'A zaga trava o chute de {p}.', '{p} tenta de longe, sem perigo.', '{p} cabeceia para fora.'],
  yellow: ['Cartão amarelo para {p} ({t}) após falta dura.', '{p} ({t}) recebe o amarelo por reclamação.', 'Amarelo para {p} ({t}), que parou o contra-ataque.'],
  red2: ['Segundo amarelo! {p} ({t}) está expulso!'],
  red: ['VERMELHO DIRETO! {p} ({t}) entra de sola e é expulso!', 'Expulsão! {p} ({t}) acerta o adversário e vai para o chuveiro.'],
  inj: ['{p} ({t}) sente a lesão e pede atendimento. ({n})'],
  flavor: ['{t} troca passes com paciência no meio-campo.', '{t} pressiona a saída de bola.', 'Jogo truncado, muitas disputas no meio.',
    '{t} tenta pelas pontas, mas o cruzamento é afastado.', 'A torcida canta alto nas arquibancadas.', '{t} recua e chama o adversário.'],
};

class MatchEngine {
  /**
   * cfg = { id, name, short, tactic:{formation,mentality,pressing,tempo}, lineup:[ids|null], bench:[ids],
   *         ai:bool (faz substituições sozinho), aiTac:bool (muda tática sozinho), mult:número }
   */
  constructor(cfgH, cfgA, seed, getP = P) {
    this.seed = seed >>> 0;
    this.rng = new RNG(this.seed);
    this.getP = getP;
    this.ps = {};
    this.min = 0; this.endMin = 90; this.done = false; this.ht = false;
    this.score = [0, 0];
    this.events = [];
    this.stats = { poss: [0, 0], shots: [0, 0], onT: [0, 0], fouls: [0, 0], corners: [0, 0], yel: [0, 0], red: [0, 0] };
    this.pendingInjury = null;
    this.sides = [this.initSide(cfgH, 0), this.initSide(cfgA, 1)];
  }
  initSide(c, i) {
    const slots = FORMATIONS[c.tactic.formation];
    const on = [];
    c.lineup.forEach((pid, si) => { if (pid != null) on.push({ pid, si, role: slots[si][0], y: slots[si][3] }); });
    const mk = (pid, starter) => {
      const p = this.getP(pid);
      this.ps[pid] = { side: i, cond: p.cond, morale: p.morale, rating: 6.3, on: starter ? 0 : null, off: null, mins: 0,
        goals: 0, ast: 0, yc: 0, red: false, inj: 0, injName: '', shots: 0 };
    };
    on.forEach(o => mk(o.pid, true));
    c.bench.forEach(pid => { if (!this.ps[pid]) mk(pid, false); });
    return { idx: i, id: c.id, name: c.name, short: c.short, tactic: { ...c.tactic }, on, bench: c.bench.filter(id => !c.lineup.includes(id)),
      subs: 0, ai: !!c.ai, aiTac: !!c.aiTac, mult: c.mult || 1, home: i === 0, str: null, dirty: true };
  }
  ev(type, side, text, pid) { this.events.push({ min: this.min, type, side, text, pid }); }
  name(pid) { return shortName(this.getP(pid)); }
  fill(tpl, o) { return tpl.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? ''); }
  say(key, o) { return this.fill(this.rng.pick(COMM[key]), o); }

  /** Força dos setores (defesa/meio/ataque) + qualidade do goleiro. */
  calc(side) {
    const slots = FORMATIONS[side.tactic.formation];
    let WD = 0, WM = 0, WA = 0;
    for (const s of slots) { const w = slotSector(s[0], s[3]); WD += w.d; WM += w.m; WA += w.a; }
    let D = 0, M = 0, A = 0, gk = null;
    for (const o of side.on) {
      const p = this.getP(o.pid), s = this.ps[o.pid], w = slotSector(o.role, o.y);
      const eff = ovrAt(p, o.role) * (0.7 + 0.3 * s.cond / 100) * (0.93 + 0.14 * s.morale / 100) * (s.inj > 0 ? 0.6 : 1);
      D += eff * w.d; M += eff * w.m; A += eff * w.a;
      if (o.role === 'GOL') gk = o;
    }
    let d = (D / WD) * Math.pow(WD / SECTOR_REF.d, .3);
    let m = (M / WM) * Math.pow(WM / SECTOR_REF.m, .3);
    let a = (A / WA) * Math.pow(WA / SECTOR_REF.a, .3);
    const t = side.tactic;
    if (t.mentality === 0) { d *= 1.07; a *= 0.9; } else if (t.mentality === 2) { a *= 1.1; d *= 0.93; }
    if (t.pressing === 0) { d *= 1.03; m *= 0.97; } else if (t.pressing === 2) { m *= 1.05; d *= 0.98; }
    const mult = side.mult * (side.home ? 1.05 : 1);
    let gq = 4;
    if (gk) {
      const g = this.getP(gk.pid), s = this.ps[gk.pid];
      gq = g.pos === 'GOL' ? (g.attrs.ref * 2 + g.attrs.man + g.attrs.sai) / 4 : ovrAt(g, 'GOL') / 5;
      gq *= (0.85 + 0.15 * s.cond / 100);
    }
    return { d: Math.max(5, d * mult), m: Math.max(5, m * mult), a: Math.max(5, a * mult), gk: gk ? gk.pid : null, gq: gq * (side.home ? 1.02 : 1) };
  }

  step() {
    if (this.done) return;
    this.min++;
    const m = this.min, rng = this.rng;
    this.ht = false;
    if (m === 1) this.ev('info', -1, 'Bola rolando! Começa a partida.');
    for (const s of this.sides) if (s.dirty || m % 5 === 0) { s.str = this.calc(s); s.dirty = false; }
    const [H, A] = this.sides;
    // Posse: quem domina o meio fica com a bola; ritmo lento e pressão alta ajustam.
    const mh = Math.pow(H.str.m, 1.4), ma = Math.pow(A.str.m, 1.4);
    const tb = t => (t.tempo === 0 ? .03 : t.tempo === 2 ? -.02 : 0) + (t.pressing === 2 ? .015 : 0);
    const pH = clamp(mh / (mh + ma) + tb(H.tactic) - tb(A.tactic), .25, .75);
    const ai = rng.next() < pH ? 0 : 1, att = this.sides[ai], def = this.sides[1 - ai];
    this.stats.poss[ai]++;
    const vol = (TEMPO_VOL[att.tactic.tempo] + TEMPO_VOL[def.tactic.tempo]) / 2;
    const ment = [0.82, 1, 1.17][att.tactic.mentality] * [0.9, 1, 1.08][def.tactic.mentality];
    const ratio = att.str.a / def.str.d;
    const pShot = 0.27 * Math.pow(ratio, 0.9) * vol * ment;
    if (rng.next() < pShot) this.shot(att, def, ratio);
    else if (rng.next() < 0.03) this.ev('flavor', ai, this.say('flavor', { t: att.short }));
    if (rng.next() < 0.22 * PRESS_FOUL[def.tactic.pressing]) this.foul(def, att);
    for (const s of this.sides) {
      const pi = 0.0021 * (s.tactic.pressing === 2 ? 1.3 : 1) * (s.tactic.tempo === 2 ? 1.15 : 1);
      if (rng.next() < pi) this.injury(s);
    }
    this.fatigue();
    for (const s of this.sides) {
      if (s.ai) this.aiSubs(s);
      if (s.aiTac) this.aiTactics(s);
    }
    if (m === 45) {
      this.ev('info', -1, `Intervalo: ${H.short} ${this.score[0]} × ${this.score[1]} ${A.short}`);
      this.ht = true;
    }
    if (m === 90) {
      this.endMin = 90 + rng.int(1, 5);
      this.ev('info', -1, `+${this.endMin - 90} minutos de acréscimo.`);
    }
    if (m >= this.endMin) this.finish();
  }

  shot(att, def, ratio) {
    const rng = this.rng;
    const cands = att.on.filter(o => o.role !== 'GOL');
    if (!cands.length) return;
    const sh = rng.weighted(cands, o => SHOOT_W[o.role] * (0.7 + this.getP(o.pid).attrs.fin / 40));
    const p = this.getP(sh.pid), a = p.attrs, s = this.ps[sh.pid];
    const header = rng.chance(a.cab > a.fin ? .33 : .17);
    const sq = (header ? (a.cab * 2 + a.for + a.com) / 4 : (a.fin * 2 + a.com + a.dec) / 4) * (0.8 + 0.2 * s.cond / 100);
    this.stats.shots[att.idx]++; s.shots++;
    const gkPid = def.str.gk;
    const gkName = gkPid ? this.name(gkPid) : 'o goleiro improvisado';
    const pOn = clamp(0.3 + (sq - 10) * 0.02 + (ratio - 1) * 0.08, .15, .6);
    if (rng.next() < pOn) {
      this.stats.onT[att.idx]++;
      const pG = clamp(0.33 * Math.pow(sq / 11, 0.7) / Math.pow(def.str.gq / 11, 0.7), .12, .55);
      if (rng.next() < pG) {
        this.score[att.idx]++;
        s.goals++; s.rating += 1.0;
        let text = this.say(header ? 'goalH' : 'goal', { p: this.name(sh.pid), gk: gkName });
        if (rng.chance(.72)) {
          const others = att.on.filter(o => o.pid !== sh.pid);
          if (others.length) {
            const as = rng.weighted(others, o => { const q = this.getP(o.pid).attrs; return (q.pas + q.vis + (header ? q.cru * 2 : 0)) * (o.role === 'GOL' ? .05 : 1); });
            this.ps[as.pid].ast++; this.ps[as.pid].rating += 0.6;
            text += ' ' + this.say('assist', { a: this.name(as.pid) });
          }
        }
        if (gkPid) this.ps[gkPid].rating -= 0.25;
        for (const o of def.on) if (o.role === 'ZAG' || o.role === 'LAT') this.ps[o.pid].rating -= 0.1;
        this.ev('goal', att.idx, text, sh.pid);
      } else {
        if (gkPid) this.ps[gkPid].rating += 0.22;
        s.rating += 0.05;
        this.ev('big', att.idx, this.say('save', { p: this.name(sh.pid), gk: gkName }), sh.pid);
        if (rng.chance(.3)) this.stats.corners[att.idx]++;
      }
    } else {
      s.rating -= 0.04;
      if (rng.chance(.25)) this.stats.corners[att.idx]++;
      if (rng.chance(.55)) this.ev('chance', att.idx, this.say('miss', { p: this.name(sh.pid) }), sh.pid);
    }
  }

  foul(def, att) {
    const rng = this.rng;
    if (!def.on.length) return;
    const f = rng.weighted(def.on, o => FOUL_W[o.role] * (0.6 + this.getP(o.pid).attrs.for / 25));
    const s = this.ps[f.pid];
    this.stats.fouls[def.idx]++;
    const pY = 0.13 * (def.tactic.pressing === 2 ? 1.3 : 1);
    const o = { p: this.name(f.pid), t: def.short };
    if (rng.next() < 0.0045) { s.red = true; s.rating -= 1.5; this.stats.red[def.idx]++; this.ev('card-r', def.idx, this.say('red', o), f.pid); this.sendOff(def, f.pid); }
    else if (rng.next() < pY * (s.yc ? 0.4 : 1)) {
      s.yc++; s.rating -= 0.3; this.stats.yel[def.idx]++;
      if (s.yc >= 2) { s.red = true; s.rating -= 1.0; this.stats.red[def.idx]++; this.ev('card-r', def.idx, this.say('red2', o), f.pid); this.sendOff(def, f.pid); }
      else this.ev('card-y', def.idx, this.say('yellow', o), f.pid);
    }
  }

  sendOff(side, pid) {
    const i = side.on.findIndex(o => o.pid === pid);
    if (i < 0) return;
    const out = side.on.splice(i, 1)[0];
    this.ps[pid].off = this.min;
    side.dirty = true;
    if (out.role === 'GOL') {
      // Goleiro expulso: entra o reserva no lugar de um jogador de linha, ou alguém vai para o gol.
      const gkIn = side.bench.find(id => this.getP(id).pos === 'GOL');
      if (gkIn && side.subs < MAX_SUBS && side.on.length) {
        const victim = side.on.slice().sort((a, b) => SHOOT_W[b.role] - SHOOT_W[a.role])[0];
        this.doSub(side, victim.pid, gkIn, out.role, out.y, out.si);
      } else if (side.on.length) {
        const v = side.on.slice().sort((a, b) => ovrAt(this.getP(b.pid), 'GOL') - ovrAt(this.getP(a.pid), 'GOL'))[0];
        v.role = 'GOL'; v.y = out.y;
        this.ev('info', side.idx, `${this.name(v.pid)} vai para o gol do ${side.short}.`);
      }
    }
  }

  injury(side) {
    const rng = this.rng;
    const cands = side.on.filter(o => this.ps[o.pid].inj === 0);
    if (!cands.length) return;
    const v = rng.weighted(cands, o => 1.3 - this.ps[o.pid].cond / 100);
    const inj = rng.weighted(INJURIES, x => x[2]);
    const s = this.ps[v.pid];
    s.inj = Math.max(1, inj[1] + rng.int(-1, 1)); s.injName = inj[0]; s.cond = Math.min(s.cond, 35);
    side.dirty = true;
    this.ev('inj', side.idx, this.say('inj', { p: this.name(v.pid), t: side.short, n: inj[0] }), v.pid);
    if (!side.ai && side.subs < MAX_SUBS && side.bench.length) this.pendingInjury = { side: side.idx, pid: v.pid };
    else if (!side.ai) this.forceOff(side, v.pid);
  }
  /** Lesionado sem substituições disponíveis: o time fica com um a menos. */
  forceOff(side, pid) {
    const i = side.on.findIndex(o => o.pid === pid);
    if (i < 0) return;
    if (side.on[i].role === 'GOL') { this.sendOff(side, pid); return; }
    side.on.splice(i, 1); this.ps[pid].off = this.min; side.dirty = true;
    this.ev('info', side.idx, `${side.short} fica com um jogador a menos.`);
  }

  fatigue() {
    for (const side of this.sides) {
      const k = 0.2 * PRESS_FAT[side.tactic.pressing] * TEMPO_FAT[side.tactic.tempo];
      for (const o of side.on) {
        const s = this.ps[o.pid], p = this.getP(o.pid);
        const loss = (o.role === 'GOL' ? 0.25 : 1) * k * (1.45 - p.attrs.res / 20 * 0.75);
        s.cond = Math.max(0, s.cond - loss);
      }
    }
  }

  bestBench(side, role) {
    let best = null, bs = -1;
    for (const id of side.bench) {
      const v = ovrAt(this.getP(id), role) * (0.7 + 0.3 * this.ps[id].cond / 100);
      if (v > bs) { bs = v; best = id; }
    }
    return best;
  }
  /** Troca jogador. Retorna true se a substituição foi feita. */
  sub(sideIdx, outPid, inPid) {
    const side = this.sides[sideIdx];
    const o = side.on.find(x => x.pid === outPid);
    if (!o || side.subs >= MAX_SUBS || !side.bench.includes(inPid)) return false;
    this.doSub(side, outPid, inPid, o.role, o.y, o.si);
    return true;
  }
  doSub(side, outPid, inPid, role, y, si) {
    let o = side.on.find(x => x.pid === outPid);
    if (!o) return;
    o.pid = inPid; o.role = role; o.y = y; o.si = si;
    side.bench = side.bench.filter(id => id !== inPid);
    this.ps[outPid].off = this.min;
    this.ps[inPid].on = this.min;
    side.subs++; side.dirty = true;
    if (this.pendingInjury && this.pendingInjury.pid === outPid) this.pendingInjury = null;
    this.ev('sub', side.idx, `Substituição no ${side.short}: sai ${this.name(outPid)}, entra ${this.name(inPid)}.`, inPid);
  }
  aiSubs(side) {
    if (side.subs >= MAX_SUBS || !side.bench.length) return;
    for (const o of side.on.slice()) {
      if (this.ps[o.pid].inj > 0 && side.subs < MAX_SUBS) {
        const inn = this.bestBench(side, o.role);
        if (inn) this.doSub(side, o.pid, inn, o.role, o.y, o.si); else this.forceOff(side, o.pid);
      }
    }
    const m = this.min;
    if (m < 56 || (m % 6 !== 0)) return;
    const tired = side.on.filter(o => o.role !== 'GOL' && (this.ps[o.pid].cond < 63 || (m >= 70 && this.ps[o.pid].rating < 5.9)))
      .sort((a, b) => this.ps[a.pid].cond - this.ps[b.pid].cond);
    let n = 0;
    for (const o of tired) {
      if (n >= 2 || side.subs >= MAX_SUBS) break;
      const inn = this.bestBench(side, o.role);
      if (!inn) break;
      if (ovrAt(this.getP(inn), o.role) < ovrAt(this.getP(o.pid), o.role) - 8 && this.ps[o.pid].cond > 50) continue;
      this.doSub(side, o.pid, inn, o.role, o.y, o.si); n++;
    }
  }
  aiTactics(side) {
    const m = this.min;
    if (m !== 65 && m !== 80) return;
    const diff = this.score[side.idx] - this.score[1 - side.idx];
    const want = diff < 0 ? 2 : (diff > 0 && m >= 80) ? 0 : side.tactic.mentality;
    if (want !== side.tactic.mentality) this.setTactic(side.idx, 'mentality', want);
  }
  setTactic(sideIdx, key, val) {
    const side = this.sides[sideIdx];
    if (side.tactic[key] === val) return;
    side.tactic[key] = val; side.dirty = true;
    const label = key === 'mentality' ? 'mentalidade ' + MENTALITY[val].toLowerCase() : key === 'pressing' ? 'pressão ' + PRESSING[val].toLowerCase() : 'ritmo ' + TEMPO[val].toLowerCase();
    this.ev('tac', sideIdx, `${side.short} muda para ${label}.`);
  }
  setFormation(sideIdx, f) {
    const side = this.sides[sideIdx];
    if (side.tactic.formation === f) return;
    const slots = FORMATIONS[f];
    const roles = slots.map(s => s[0]);
    const ids = side.on.map(o => o.pid);
    // Distribui os jogadores em campo nas vagas novas (gulosa); vagas sobrando ficam vazias.
    const pairs = [];
    ids.forEach(id => roles.forEach((r, si) => pairs.push({ id, si, s: ovrAt(this.getP(id), r) })));
    pairs.sort((a, b) => b.s - a.s);
    const took = new Set(), slotUsed = new Set(), on = [];
    const gk = side.on.find(o => o.role === 'GOL');
    if (gk) { on.push({ pid: gk.pid, si: 0, role: 'GOL', y: slots[0][3] }); took.add(gk.pid); slotUsed.add(0); }
    for (const pr of pairs) {
      if (took.has(pr.id) || slotUsed.has(pr.si) || roles[pr.si] === 'GOL') continue;
      took.add(pr.id); slotUsed.add(pr.si);
      on.push({ pid: pr.id, si: pr.si, role: roles[pr.si], y: slots[pr.si][3] });
    }
    side.on = on; side.tactic.formation = f; side.dirty = true;
    this.ev('tac', sideIdx, `${side.short} passa a jogar no ${f}.`);
  }

  finish() {
    this.done = true;
    const end = this.endMin;
    for (const pid in this.ps) {
      const s = this.ps[pid];
      if (s.on == null) continue;
      s.mins = Math.max(1, (s.off ?? end) - s.on);
      const side = this.sides[s.side];
      const gf = this.score[s.side], ga = this.score[1 - s.side];
      s.rating += gf > ga ? 0.3 : gf < ga ? -0.25 : 0;
      const p = this.getP(+pid);
      const role = (side.on.find(o => o.pid === +pid) || {}).role || p.pos;
      if (ga === 0 && s.mins >= 60 && (role === 'GOL' || role === 'ZAG' || role === 'LAT')) s.rating += 0.5;
      s.rating += this.rng.normal(0, 0.25) * Math.min(1, s.mins / 60);
      s.rating = Math.round(clamp(s.rating, 3, 10) * 10) / 10;
    }
    let motm = null, best = -1;
    for (const pid in this.ps) { const s = this.ps[pid]; if (s.on != null && s.mins >= 30 && s.rating > best) { best = s.rating; motm = +pid; } }
    this.motm = motm;
    this.ev('info', -1, `Fim de jogo: ${this.sides[0].short} ${this.score[0]} × ${this.score[1]} ${this.sides[1].short}`);
  }
  possPct() { const t = this.stats.poss[0] + this.stats.poss[1] || 1; const h = Math.round(this.stats.poss[0] / t * 100); return [h, 100 - h]; }
  minuteLabel(m = this.min) { return m > 90 ? `90+${m - 90}'` : `${m}'`; }
}

/** Simula a partida inteira de uma vez (usado para jogos da IA e nos testes). */
function simulateMatch(cfgH, cfgA, seed, getP = P) {
  const e = new MatchEngine(cfgH, cfgA, seed, getP);
  while (!e.done) e.step();
  return e;
}

/* ============================================================================
   6. TEMPORADA — rodadas, tabela, diretoria, finanças, evolução, fim de ano
   ============================================================================ */
const MSG_ICON = { news: '📰', board: '🏛️', offer: '💼', injury: '🩹', youth: '🌱', contract: '📝', match: '⚽', finance: '💰', transfer: '🔁', season: '🏆' };

function msg(type, title, body, data) {
  G.inbox.unshift({ id: G.nextMsg++, type, title, body, data: data || null, read: false, s: G.season, r: G.round });
  if (G.inbox.length > 160) G.inbox.length = 160;
}

function standings() {
  return G.clubs.slice().sort((a, b) => b.st.pts - a.st.pts || (b.st.gf - b.st.ga) - (a.st.gf - a.st.ga) || b.st.gf - a.st.gf || b.st.w - a.st.w || a.name.localeCompare(b.name));
}
const posOf = id => standings().findIndex(c => c.id === id) + 1;
const inWindow = (r = G.round) => WINDOWS.some(([a, b]) => r >= a && r <= b);
function userFixture(r = G.round) {
  const rd = G.fixtures[r];
  if (!rd) return null;
  const i = rd.findIndex(f => f.h === G.user || f.a === G.user);
  return i < 0 ? null : { f: rd[i], i };
}

/** Configuração de um lado para o motor. */
function sideCfg(club, vsUser) {
  const isUser = club.id === G.user;
  return {
    id: club.id, name: club.name, short: club.short, tactic: club.tactic, lineup: club.lineup, bench: club.bench,
    ai: !isUser, aiTac: !isUser, mult: (!isUser && vsUser) ? DIFFICULTY[G.difficulty].ai : 1,
  };
}
/** Substitui indisponíveis da escalação do usuário pelo melhor disponível. */
function fixLineup(club) {
  const roles = FORMATIONS[club.tactic.formation].map(s => s[0]);
  club.lineup = club.lineup.map(id => (id != null && club.squad.includes(id) && available(P(id))) ? id : null);
  club.bench = club.bench.filter(id => club.squad.includes(id) && available(P(id)) && !club.lineup.includes(id));
  for (let i = 0; i < roles.length; i++) {
    if (club.lineup[i] != null) continue;
    const pool = club.squad.filter(id => available(P(id)) && !club.lineup.includes(id));
    pool.sort((a, b) => ovrAt(P(b), roles[i]) - ovrAt(P(a), roles[i]));
    if (pool[0] != null) { club.lineup[i] = pool[0]; club.bench = club.bench.filter(x => x !== pool[0]); }
  }
  const rest = club.squad.filter(id => available(P(id)) && !club.lineup.includes(id) && !club.bench.includes(id)).sort((a, b) => P(b).ovr - P(a).ovr);
  while (club.bench.length < BENCH_SIZE && rest.length) club.bench.push(rest.shift());
}
const matchSeed = (r, i) => seedOf(G.seed, G.season, r, i);

/** Prepara a partida do usuário (o motor fica pronto para rodar ao vivo). */
function prepareUserMatch() {
  const uf = userFixture();
  if (!uf) return null;
  const { f, i } = uf;
  const h = C(f.h), a = C(f.a);
  for (const c of [h, a]) if (c.id !== G.user) autoPick(c);
  fixLineup(userClub());
  return new MatchEngine(sideCfg(h, a.id === G.user), sideCfg(a, h.id === G.user), matchSeed(G.round, i));
}

/** Joga a rodada atual. `userEngine` = partida do usuário já terminada. */
function playRound(userEngine) {
  const r = G.round, rd = G.fixtures[r];
  const results = rd.map((f, i) => {
    if ((f.h === G.user || f.a === G.user) && userEngine) return userEngine;
    const h = C(f.h), a = C(f.a);
    if (h.id === G.user || a.id === G.user) fixLineup(userClub());
    if (h.id !== G.user) autoPick(h);
    if (a.id !== G.user) autoPick(a);
    return simulateMatch(sideCfg(h, a.id === G.user), sideCfg(a, h.id === G.user), matchSeed(r, i));
  });
  // A semana passou: quem estava suspenso/lesionado cumpre a rodada antes das novas punições.
  for (const id in G.players) {
    const p = G.players[id];
    if (p.susp > 0) p.susp--;
    if (p.inj > 0) { p.inj--; if (p.inj === 0 && p.club === G.user) msg('injury', `${displayName(p)} está recuperado`, `${displayName(p)} voltou a treinar normalmente e está à disposição.`, { pid: p.id }); }
  }
  rd.forEach((f, i) => applyResult(f, results[i]));
  G.inbox.unshift({ id: G.nextMsg++, type: 'news', title: `Resultados da rodada ${r + 1}`, read: true, s: G.season, r,
    body: rd.map(f => `${C(f.h).short} ${f.hg} × ${f.ag} ${C(f.a).short}`).join('\n') });
  postRound(results);
  return results;
}

function applyResult(f, e) {
  f.hg = e.score[0]; f.ag = e.score[1];
  f.sc = e.events.filter(x => x.type === 'goal').map(x => [x.min, x.pid, x.side]);
  f.cards = e.events.filter(x => x.type === 'card-r').map(x => [x.min, x.pid, x.side]);
  f.st = { poss: e.possPct(), shots: e.stats.shots.slice(), onT: e.stats.onT.slice() };
  f.motm = e.motm;
  const H = C(f.h), A = C(f.a);
  const upd = (c, gf, ga) => {
    c.st.p++; c.st.gf += gf; c.st.ga += ga;
    const res = gf > ga ? 'W' : gf < ga ? 'L' : 'D';
    if (res === 'W') { c.st.w++; c.st.pts += 3; } else if (res === 'D') { c.st.d++; c.st.pts++; } else c.st.l++;
    c.st.form.push(res); if (c.st.form.length > 5) c.st.form.shift();
    return res;
  };
  const rh = upd(H, f.hg, f.ag), ra = upd(A, f.ag, f.hg);
  for (const pid in e.ps) {
    const s = e.ps[pid], p = G.players[pid];
    if (!p) continue;
    if (s.on == null) continue;
    const res = s.side === 0 ? rh : ra;
    p.st.apps++; p.st.goals += s.goals; p.st.ast += s.ast; p.st.rsum += s.rating;
    p.car.apps++; p.car.goals += s.goals; p.car.ast += s.ast;
    p.mins += s.mins; p.cond = Math.round(s.cond);
    p.morale = clamp(p.morale + (res === 'W' ? 6 : res === 'L' ? -6 : 1) + (s.rating >= 7.5 ? 4 : s.rating < 5.6 ? -3 : 0), 5, 100);
    if (s.yc === 1 && !s.red) { p.yc++; p.st.yc++; if (p.yc >= 3) { p.yc = 0; p.susp += 1; if (p.club === G.user) msg('match', `${displayName(p)} suspenso`, `Com o 3º cartão amarelo, ${displayName(p)} cumpre suspensão na próxima rodada.`, { pid: p.id }); } }
    if (s.red) {
      p.st.rc++; const n = s.yc >= 2 ? 1 : 2; p.susp += n;
      if (p.club === G.user) msg('match', `${displayName(p)} expulso`, `${displayName(p)} foi expulso e está suspenso por ${n} rodada${n > 1 ? 's' : ''}.`, { pid: p.id });
    }
    if (s.inj > 0) {
      p.inj = s.inj; p.injName = s.injName;
      if (p.club === G.user) msg('injury', `Lesão: ${displayName(p)}`, `${displayName(p)} sofreu ${s.injName.toLowerCase()} e deve ficar fora por cerca de ${s.inj} semana${s.inj > 1 ? 's' : ''}.`, { pid: p.id });
    }
  }
  if (e.motm && G.players[e.motm]) G.players[e.motm].st.motm++;
}

function attendance(c, opp) {
  const base = 18 + c.rep * 0.18;
  const priceF = clamp(1.45 - (c.ticket / base) * 0.45, 0.25, 1.4);
  const form = c.st.form.slice(-3);
  const formF = sum(form, r => r === 'W' ? .05 : r === 'L' ? -.05 : 0);
  const oppF = opp ? (opp.rep - 65) / 300 : 0;
  return Math.round(clamp(c.fans * (0.62 + formF + oppF) * priceF, 1500, c.stadium));
}
const opsCost = c => 40000 + c.rep * c.rep * 18;
const tvMoney = c => 30000 + c.rep * 1500;

function finLog(desc, amt, cat) {
  const f = G.fin;
  f.log.unshift({ s: G.season, r: G.round, desc, amt });
  if (f.log.length > 60) f.log.length = 60;
  if (cat) f.cur[cat] = (f.cur[cat] || 0) + Math.abs(amt);
}
const newFinSeason = () => ({ tickets: 0, tv: 0, prize: 0, sales: 0, wages: 0, ops: 0, buys: 0 });

function weeklyFinances() {
  const rd = G.fixtures[G.round];
  for (const c of G.clubs) {
    const wages = squadWages(c), ops = opsCost(c), tv = tvMoney(c);
    const fx = rd.find(f => f.h === c.id);
    let tickets = 0, att = 0;
    if (fx) { att = attendance(c, C(fx.a)); tickets = att * c.ticket; fx.att = att; }
    c.balance += tv + tickets - wages - ops;
    if (c.id === G.user) {
      const before = c.balance - (tv + tickets - wages - ops);
      if (tickets) finLog(`Bilheteria (${att.toLocaleString('pt-BR')} torcedores)`, tickets, 'tickets');
      finLog('Cotas de TV', tv, 'tv');
      finLog('Folha salarial', -wages, 'wages');
      finLog('Custos operacionais', -ops, 'ops');
      G.fin.hist.push(c.balance - before);
      if (G.fin.hist.length > 38) G.fin.hist.shift();
    } else if (c.balance < -500000) {
      // IA endividada: patrocinador cobre parte (mantém o mundo jogável).
      c.balance += 600000;
    }
  }
}

function trainingFactor(club) {
  if (club.id !== G.user) return { dev: 1, rec: 0, focus: 'eq' };
  const t = club.training;
  return { dev: [0.8, 1, 1.25][t.intensity], rec: [8, 0, -7][t.intensity], focus: t.focus, mor: [1, 0, -1][t.intensity] };
}
function pickDevAttr(p, focus, rng) {
  const w = POS_W[p.pos];
  return rng.weighted(ALL_ATTRS, k => {
    if (p.attrs[k] >= 20) return 0;
    if (p.pos !== 'GOL' && ATTR_GROUPS[3].keys.includes(k)) return 0;
    let x = (w[k] || 0) + 0.4;
    if (focus === 'fis' && PHYS.includes(k)) x *= 2.5;
    if (focus === 'tec' && ATTR_GROUPS[0].keys.includes(k)) x *= 2;
    if (focus === 'tat' && ATTR_GROUPS[1].keys.includes(k)) x *= 2;
    return x;
  });
}
function developWeekly(p, tf) {
  if (p.age > 29 || p.inj > 0) return;
  const gap = p.pot - p.ovr;
  if (gap <= 0) return;
  const ageF = p.age <= 20 ? 1 : p.age <= 23 ? .75 : p.age <= 26 ? .4 : .15;
  const expected = Math.max(1, G.round + 1) * 90 * 0.5;
  const minF = 0.55 + 0.45 * clamp(p.mins / expected, 0, 1);
  const pr = 0.2 * clamp(gap / 10, 0.15, 1.2) * ageF * minF * tf.dev;
  if (WR.next() < pr) {
    const k = pickDevAttr(p, tf.focus, WR);
    p.attrs[k] = Math.min(20, p.attrs[k] + 1);
    const before = p.ovr;
    refreshPlayer(p);
    if (p.ovr > p.pot) p.pot = p.ovr;
    if (p.club === G.user && p.ovr > before && p.age <= 21 && p.ovr % 3 === 0) msg('news', `${displayName(p)} em evolução`, `A comissão técnica elogia a evolução de ${displayName(p)} (${p.age} anos), que agora tem overall ${p.ovr}.`, { pid: p.id });
  }
}

function postRound(results) {
  const user = userClub();
  weeklyFinances();
  // Recuperação física, moral e evolução.
  for (const c of G.clubs) {
    const tf = trainingFactor(c);
    const top11 = c.id === G.user ? new Set(c.squad.slice().sort((a, b) => P(b).ovr - P(a).ovr).slice(0, 11)) : null;
    const played = new Set();
    if (top11) { const uf = userFixture(); const e = uf && results[uf.i]; if (e) for (const pid in e.ps) if (e.ps[pid].on != null) played.add(+pid); }
    for (const id of c.squad) {
      const p = P(id);
      p.cond = Math.min(100, Math.round(p.cond + 20 + p.attrs.res * 0.6 + tf.rec));
      if (p.inj > 0) p.cond = Math.min(p.cond, 70);
      p.morale = Math.round(p.morale + (65 - p.morale) * 0.08 + (tf.mor || 0));
      if (top11 && top11.has(id) && !played.has(id) && available(p)) p.morale -= 2;
      p.morale = clamp(p.morale, 5, 100);
      developWeekly(p, tf);
    }
  }
  for (const id in G.players) { const p = G.players[id]; if (p.club == null) { p.cond = 100; developWeekly(p, { dev: .6, focus: 'eq' }); } }
  // Diretoria
  const uf = userFixture();
  if (uf) {
    const f = uf.f, home = f.h === G.user;
    const gf = home ? f.hg : f.ag, ga = home ? f.ag : f.hg;
    const opp = C(home ? f.a : f.h);
    const mult = DIFFICULTY[G.difficulty].board;
    let d = gf > ga ? 3 : gf === ga ? 0.5 : -3.5 * mult;
    if (gf < ga && opp.rep > user.rep + 10) d *= 0.5;
    if (gf > ga && opp.rep > user.rep + 10) d += 1.5;
    const pos = posOf(G.user);
    if (G.round >= 6) d += pos <= G.board.target ? 1 : pos > G.board.target + 3 ? -1.5 * mult : 0;
    G.board.conf = clamp(Math.round((G.board.conf + d) * 10) / 10, 0, 100);
    const res = gf > ga ? 'Vitória' : gf < ga ? 'Derrota' : 'Empate';
    msg('match', `${res}: ${C(f.h).short} ${f.hg} × ${f.ag} ${C(f.a).short}`, matchReport(f), { round: G.round });
  }
  if (G.board.conf < 35 && G.board.warned < 1) { G.board.warned = 1; msg('board', 'Diretoria preocupada', 'A diretoria está insatisfeita com os resultados recentes. Precisamos de uma reação rápida.'); }
  if (G.board.conf < 18 && G.board.warned < 2) { G.board.warned = 2; msg('board', 'Ultimato da diretoria', 'Este é o último aviso. Se os resultados não melhorarem, você será demitido.'); }
  if (G.board.conf >= 50) G.board.warned = 0;
  if (G.round === 18) {
    const pos = posOf(G.user);
    msg('board', 'Avaliação do primeiro turno', pos <= G.board.target ? `A diretoria está satisfeita: ${pos}º lugar, dentro do objetivo (${boardGoalText()}).` : `Estamos em ${pos}º, abaixo do objetivo (${boardGoalText()}). Esperamos melhora no returno.`);
  }
  if (inWindow()) { aiTransfers(); incomingOffers(); }
  // Ofertas vencidas
  for (const o of G.offers) if (o.status === 'open' && o.exp <= G.round) { o.status = 'expired'; }
  if (G.round === 30) {
    const exp = user.squad.map(P).filter(p => p.contract <= G.year);
    if (exp.length) msg('contract', 'Contratos terminando', `Os contratos de ${exp.map(displayName).join(', ')} terminam no fim da temporada. Renove pela ficha do jogador ou eles sairão de graça.`);
  }
  G.round++;
  if (G.round === WINDOWS[1][0]) msg('transfer', 'Janela de transferências aberta', `A janela do meio do ano fica aberta até a rodada ${WINDOWS[1][1] + 1}.`);
  if (G.round === WINDOWS[0][1] + 1 || G.round === WINDOWS[1][1] + 1) msg('transfer', 'Janela de transferências fechada', 'Só é possível contratar jogadores livres até a próxima janela.');
  if (G.board.conf <= 8 && G.round >= 10 && !G.fired) fire('A diretoria perdeu a confiança no seu trabalho após a sequência de maus resultados.');
}

function matchReport(f) {
  const scorers = f.sc.map(([m, pid, side]) => `${m > 90 ? '90+' + (m - 90) : m}' ${P(pid) ? shortName(P(pid)) : '?'} (${C(side === 0 ? f.h : f.a).short})`);
  let t = `${C(f.h).name} ${f.hg} × ${f.ag} ${C(f.a).name}.`;
  if (scorers.length) t += ` Gols: ${scorers.join(', ')}.`;
  if (f.motm && P(f.motm)) t += ` Melhor em campo: ${displayName(P(f.motm))}.`;
  if (f.att) t += ` Público: ${f.att.toLocaleString('pt-BR')}.`;
  return t;
}

/* ---------- Diretoria ---------- */
function boardTargetFor(club) {
  const rank = G.clubs.slice().sort((a, b) => b.rep - a.rep).findIndex(c => c.id === club.id) + 1;
  return rank <= 2 ? 1 : rank <= 6 ? 4 : rank <= 10 ? 8 : rank <= 14 ? 12 : 16;
}
function boardGoalText(t = G.board.target) {
  return { 1: 'conquistar o título', 4: 'terminar no G4', 8: 'ficar entre os 8 primeiros', 12: 'terminar no meio da tabela (até 12º)', 16: 'evitar o rebaixamento' }[t];
}
function fire(reason) {
  G.fired = { reason, offers: jobOffers() };
  msg('board', 'Você foi demitido', reason);
}
function jobOffers() {
  const cands = G.clubs.filter(c => c.id !== G.user).sort((a, b) => a.rep - b.rep).slice(0, 7);
  return WR.shuffle(cands).slice(0, 3).map(c => c.id);
}
function takeJob(clubId) {
  const old = G.user;
  if (old != null && C(old)) { autoPick(C(old)); C(old).training = { intensity: 1, focus: 'eq' }; }
  G.user = clubId;
  const c = userClub();
  G.board = { conf: 55, target: boardTargetFor(c), warned: 0 };
  G.fired = false;
  G.offers = [];
  G.fin = { cur: newFinSeason(), log: [], hist: [] };
  autoPick(c);
  msg('board', `Bem-vindo ao ${c.name}`, `A diretoria apresenta ${G.manager} como novo técnico. Objetivo: ${boardGoalText()}. Orçamento disponível: ${money(c.balance)}.`);
}

/* ---------- Fim de temporada ---------- */
function endSeason() {
  const table = standings();
  const champ = table[0], rel = table.slice(-4);
  table.forEach((c, i) => {
    const prize = niceRound(8000000 * Math.pow(0.86, i));
    c.balance += prize;
    if (c.id === G.user) finLog(`Premiação (${i + 1}º lugar)`, prize, 'prize');
  });
  const scorers = Object.values(G.players).filter(p => p.club != null && p.st.goals > 0).sort((a, b) => b.st.goals - a.st.goals);
  const top = scorers[0];
  const userPos = posOf(G.user);
  const summary = {
    season: G.season, year: G.year, champ: champ.id, champName: champ.name, champColors: champ.colors, pts: champ.st.pts,
    userPos, userClub: userClub().name, userPts: userClub().st.pts, rel: rel.map(c => c.name), relIds: rel.map(c => c.id),
    top: top ? `${displayName(top)} (${C(top.club).short}) — ${top.st.goals} gols` : '—',
    prize: niceRound(8000000 * Math.pow(0.86, userPos - 1)), target: G.board.target,
  };
  G.history.unshift(summary);
  G.champions.unshift({ year: G.year, name: champ.name, colors: champ.colors, user: champ.id === G.user });
  // Avaliação da diretoria
  const mult = DIFFICULTY[G.difficulty].board;
  if (userPos <= G.board.target) G.board.conf = clamp(G.board.conf + 18, 0, 100);
  else if (userPos > G.board.target + 4) G.board.conf = clamp(G.board.conf - 22 * mult, 0, 100);
  summary.verdict = userPos <= G.board.target ? 'A diretoria está satisfeita e renova a confiança no seu trabalho.'
    : userPos <= G.board.target + 4 ? 'A diretoria esperava mais, mas mantém você no cargo.'
      : 'A diretoria ficou muito decepcionada com a campanha.';
  msg('season', `${champ.name} é campeão!`, `${champ.name} conquista a liga com ${champ.st.pts} pontos. Rebaixados: ${summary.rel.join(', ')}. Artilheiro: ${summary.top}.`);
  if (summary.relIds.includes(G.user)) { summary.fired = true; summary.verdict = 'Com o rebaixamento, a diretoria decidiu encerrar o seu contrato.'; }
  else if (G.board.conf < 22) { summary.fired = true; summary.verdict = 'A diretoria decidiu não seguir com você para a próxima temporada.'; }
  G.phase = 'summary';
  G.summary = summary;
}

function newSeason() {
  const S = G.summary, rng = WR;
  const fired = S.fired;
  // Rebaixados saem; quatro clubes novos sobem (gerados).
  const usedCities = new Set(G.clubs.map(c => c.city));
  const usedColors = new Set(G.clubs.filter(c => !S.relIds.includes(c.id)).map(c => c.colors.join()));
  const free = CLUB_COLORS.filter(c => !usedColors.has(c.join())), promoted = [];
  for (const id of S.relIds) {
    const old = C(id);
    const keep = old.squad.slice().sort((a, b) => P(b).ovr - P(a).ovr);
    keep.forEach((pid, i) => { const p = P(pid); if (i < 4) { p.club = null; p.listed = false; } else delete G.players[pid]; });
    const colors = free.length ? free.splice(rng.int(0, free.length - 1), 1)[0] : rng.pick(CLUB_COLORS);
    promoted.push(genClub(rng, id, rng.int(48, 57), usedCities, colors));
  }
  msg('news', 'Clubes promovidos', `Sobem da divisão de acesso: ${promoted.map(c => `${c.name} (fundado em ${c.founded})`).join(', ')}.`);
  // Reputação
  standings().forEach((c, i) => { if (S.relIds.includes(c.id)) return; c.rep = clamp(c.rep + (i === 0 ? 3 : i < 4 ? 1 : i > 13 ? -1 : 0), 40, 95); });
  // Envelhecimento, evolução de pré-temporada, declínio, aposentadoria, contratos.
  const retired = [], leftUser = [];
  for (const id of Object.keys(G.players)) {
    const p = G.players[id];
    p.age++;
    if (p.age <= 23 && p.pot > p.ovr) {
      const n = rng.int(0, Math.ceil((p.pot - p.ovr) / 10));
      for (let i = 0; i < n; i++) { const k = pickDevAttr(p, 'eq', rng); p.attrs[k] = Math.min(20, p.attrs[k] + 1); }
    }
    if (p.age >= 30) {
      const n = rng.int(0, Math.min(6, p.age - 28));
      for (let i = 0; i < n; i++) {
        const k = rng.chance(.7) ? rng.pick(PHYS) : rng.pick(Object.keys(POS_W[p.pos]));
        p.attrs[k] = Math.max(1, p.attrs[k] - 1);
      }
    }
    refreshPlayer(p);
    p.pot = p.age >= 28 ? p.ovr : Math.max(p.pot, p.ovr);
    const pr = p.age >= 34 ? 0.3 + (p.age - 34) * 0.2 : (p.age >= 32 && p.ovr < 58) ? 0.25 : 0;
    if (rng.next() < pr) {
      if (p.club != null) { const c = C(p.club); c.squad = c.squad.filter(x => x !== p.id); if (c.id === G.user) retired.push(displayName(p)); }
      delete G.players[id];
      continue;
    }
    if (p.club != null && p.contract <= G.year) {
      const c = C(p.club);
      if (c.id === G.user) { leftUser.push(displayName(p)); c.squad = c.squad.filter(x => x !== p.id); p.club = null; p.listed = false; }
      else {
        const med = c.squad.map(x => P(x)?.ovr || 0).sort((a, b) => a - b)[Math.floor(c.squad.length / 2)];
        if (p.age < 33 && p.ovr >= med - 4) { p.contract = G.year + 1 + rng.int(1, 3); p.wage = demandWage(p, c.rep); }
        else { c.squad = c.squad.filter(x => x !== p.id); p.club = null; }
      }
    }
    p.st = newPStats(); p.mins = 0; p.yc = 0; p.susp = 0; p.cond = 100; p.morale = clamp(Math.round(p.morale * 0.5 + 33), 30, 90);
  }
  G.year++; G.season++; G.round = 0;
  // Base: jovens promovidos em todos os clubes.
  for (const c of G.clubs) {
    const n = rng.int(2, 4), names = [];
    for (let i = 0; i < n; i++) {
      const p = genPlayer(rng, { pos: rng.pick(POS), target: clubLevel(c.rep) - 4 + rng.normal(0, 4), club: c.id, youth: true, age: rng.int(16, 18) });
      p.contract = G.year + 2; p.wage = niceRound(Math.max(500, p.wage * 0.5));
      if (rng.chance(0.08)) p.pot = clamp(p.pot + rng.int(6, 14), p.ovr, 95);   // joia rara
      c.squad.push(p.id); names.push(`${displayName(p)} (${p.pos}, ${p.age})`);
    }
    if (c.id === G.user) msg('youth', 'Jovens da base promovidos', `A base subiu ${n} jogadores para o profissional: ${names.join(', ')}. Confira o potencial na ficha de cada um.`);
    c.st = newTable();
  }
  // IA: ajusta tamanho do elenco
  for (const c of G.clubs) {
    if (c.id === G.user) continue;
    while (c.squad.length > 30) {
      const worst = c.squad.slice().sort((a, b) => (P(a).ovr - P(a).age * .3) - (P(b).ovr - P(b).age * .3))[0];
      c.squad = c.squad.filter(x => x !== worst); P(worst).club = null;
    }
    while (c.squad.length < 22) {
      const need = POS.slice().sort((a, b) => c.squad.filter(x => P(x).pos === a).length - SQUAD_TEMPLATE[a] - (c.squad.filter(x => P(x).pos === b).length - SQUAD_TEMPLATE[b]))[0];
      const fa = Object.values(G.players).filter(p => p.club == null && p.pos === need).sort((a, b) => b.ovr - a.ovr)[0];
      const p = fa || genPlayer(rng, { pos: need, target: clubLevel(c.rep) - 8, club: c.id });
      p.club = c.id; p.contract = G.year + rng.int(1, 3); p.wage = demandWage(p, c.rep);
      if (!c.squad.includes(p.id)) c.squad.push(p.id);
    }
    c.wageBudget = niceRound(Math.min(Math.max(c.wageBudget, squadWages(c) * 1.05), aiWageCap(c)));
    if (c.balance < 800000) c.balance += niceRound(c.rep * 25000);
  }
  // Pool de livres
  const fas = Object.values(G.players).filter(p => p.club == null).sort((a, b) => b.ovr - a.ovr);
  fas.forEach((p, i) => { if (i >= 90 || p.age >= 35) delete G.players[p.id]; });
  for (const p of Object.values(G.players)) { p.value = computeValue(p); if (p.club == null) p.wage = demandWage(p, 55); }
  G.fixtures = genFixtures(rng, G.clubs.map(c => c.id));
  for (const c of G.clubs) if (c.id !== G.user) { c.tactic.formation = c.tactic.formation || '4-4-2'; autoPick(c); }
  G.offers = []; G.blocked = {};
  G.fin.prev = G.fin.cur; G.fin.cur = newFinSeason(); G.fin.hist = [];
  G.phase = 'season'; G.summary = null;
  if (retired.length) msg('news', 'Aposentadorias no elenco', `Encerraram a carreira: ${retired.join(', ')}.`);
  if (leftUser.length) msg('contract', 'Contratos encerrados', `Deixaram o clube ao fim do contrato: ${leftUser.join(', ')}.`);
  ensureUserSquad(userClub());
  autoPickKeep(userClub());
  if (fired) {
    G.fired = { reason: S.verdict, offers: jobOffers() };
  } else {
    const u = userClub();
    u.wageBudget = niceRound(Math.max(u.wageBudget, squadWages(u) * 1.05) * (S.userPos <= S.target ? 1.1 : 1));
    G.board.target = boardTargetFor(u);
    G.board.conf = clamp(Math.round(G.board.conf * 0.5 + 32), 30, 80); G.board.warned = 0;
    msg('board', `Temporada ${G.year}: objetivo da diretoria`, `Para esta temporada, a diretoria espera ${boardGoalText()}. Orçamento para contratações: ${money(u.balance)}. Teto salarial: ${money(u.wageBudget)}/semana.`);
  }
  msg('transfer', 'Janela de transferências aberta', `A janela de pré-temporada fica aberta até a rodada ${WINDOWS[0][1] + 1}.`);
}
const aiWageCap = c => Math.max(90000, c.rep * c.rep * 65);
/** Elenco do usuário nunca fica injogável: completa com juniores e garante 2 goleiros. */
function ensureUserSquad(c) {
  const added = [];
  const need = () => c.squad.filter(id => P(id).pos === 'GOL').length < 2 ? 'GOL' : c.squad.length < 18 ? WR.pick(POS.slice(1)) : null;
  for (let pos = need(); pos; pos = need()) {
    const p = genPlayer(WR, { pos, target: clubLevel(c.rep) - 8, club: c.id, youth: true, age: WR.int(17, 19) });
    p.contract = G.year + 2; p.wage = niceRound(Math.max(500, p.wage * 0.5));
    c.squad.push(p.id); added.push(`${displayName(p)} (${p.pos})`);
  }
  if (added.length) msg('youth', 'Juniores promovidos às pressas', `Com o elenco curto, a diretoria subiu da base: ${added.join(', ')}. Considere contratar reforços.`);
}
/** Mantém a escalação do usuário, preenchendo buracos de quem saiu. */
function autoPickKeep(c) {
  if (!c.lineup.length) return autoPick(c);
  fixLineup(c);
}

/* ============================================================================
   7. MERCADO — propostas, negociação e IA de transferências
   ============================================================================ */
function noise(pid, salt, a, b) { const r = new RNG(seedOf(G.seed, pid, G.season, salt)); return r.range(a, b); }

function transfer(p, toId, fee, wage, years) {
  const fromId = p.club;
  if (fromId != null) {
    const f = C(fromId);
    f.squad = f.squad.filter(x => x !== p.id);
    f.lineup = f.lineup.map(x => x === p.id ? null : x);
    f.bench = f.bench.filter(x => x !== p.id);
    f.balance += fee;
    if (fromId === G.user) finLog(`Venda de ${displayName(p)}`, fee, 'sales');
    else autoPick(f);
  }
  const t = C(toId);
  t.squad.push(p.id); t.balance -= fee;
  if (toId === G.user && fee > 0) finLog(`Contratação de ${displayName(p)}`, -fee, 'buys');
  p.club = toId; p.wage = wage; p.contract = G.year + years; p.listed = false; p.morale = 72; p.yc = 0;
  p.value = computeValue(p);
  if (toId !== G.user) autoPick(t);
}

/** Preço pedido pelo clube vendedor (escondido do usuário). */
function askingPrice(p) {
  if (p.club == null) return 0;
  const c = C(p.club);
  const key = c.lineup.includes(p.id);
  const depth = c.squad.filter(x => P(x).pos === p.pos).length;
  let ask = p.value * (key ? 1.4 : 1.12);
  if (depth <= STARTERS[p.pos] + 1) ask *= 1.25;
  if (p.listed) ask *= 0.85;
  if (p.age <= 21 && p.pot - p.ovr > 10) ask *= 1.15;
  return niceRound(ask * noise(p.id, 'ask', 0.92, 1.12));
}
function wageDemandFor(p, toClub) {
  const fromRep = p.club != null ? C(p.club).rep : 50;
  let w = demandWage(p, toClub.rep) * (1 + Math.max(0, fromRep - toClub.rep) / 150);
  if (p.club == null) w *= 1.1;
  return niceRound(w * noise(p.id, 'wage', 0.95, 1.1));
}
/** Jogador topa conversar? Estrelas não aceitam clubes muito menores. */
function playerInterested(p, toClub) {
  if (p.club != null && toClub.rep >= C(p.club).rep) return true;
  return p.ovr <= clubLevel(toClub.rep) + 12;
}
function evaluateBid(p, fee) {
  const ask = askingPrice(p);
  if (fee >= ask) return { res: 'accept' };
  if (fee >= ask * 0.8) return { res: 'counter', counter: ask };
  return { res: 'reject' };
}
function evaluateContract(p, wage, demand) {
  if (wage >= demand * 0.97) return { res: 'accept' };
  if (wage >= demand * 0.82) return { res: 'counter', counter: demand };
  return { res: 'reject' };
}
const isBlocked = pid => (G.blocked[pid] || 0) > G.season * 100 + G.round;
function blockPlayer(pid, rounds = 4) { G.blocked[pid] = G.season * 100 + G.round + rounds; }

function aiTransfers() {
  const moves = [];
  for (const c of G.clubs) {
    if (c.id === G.user || !WR.chance(0.12)) continue;
    const roles = FORMATIONS[c.tactic.formation].map(s => s[0]);
    let worst = -1, wv = 999;
    c.lineup.forEach((id, i) => { const v = id != null ? ovrAt(P(id), roles[i]) : 0; if (v < wv) { wv = v; worst = i; } });
    if (worst < 0) continue;
    const role = roles[worst];
    const budget = c.balance * 0.7;
    const cands = Object.values(G.players).filter(p => p.pos === role && p.club !== c.id && p.club !== G.user && p.ovr >= wv + 3 && p.age <= 31 && p.value * 1.2 <= budget && !(p.club != null && C(p.club).lineup.includes(p.id) && C(p.club).rep > c.rep));
    if (!cands.length) continue;
    cands.sort((a, b) => b.ovr - a.ovr);
    const p = WR.pick(cands.slice(0, 4));
    const fee = p.club == null ? 0 : niceRound(p.value * WR.range(1.05, 1.3));
    if (fee > c.balance || squadWages(c) + demandWage(p, c.rep) > c.wageBudget) continue;
    const from = p.club != null ? C(p.club).name : null;
    transfer(p, c.id, fee, demandWage(p, c.rep), WR.int(2, 4));
    if (c.squad.length > 30) {
      const out = c.squad.slice().sort((a, b) => P(a).ovr - P(b).ovr)[0];
      const op = P(out); c.squad = c.squad.filter(x => x !== out); op.club = null; autoPick(c);
    }
    if (p.ovr >= 66 || moves.length < 2) moves.push(`${displayName(p)} (${p.pos}, ${p.ovr}) ${from ? `do ${from}` : 'livre'} → ${c.name}${fee ? ` por ${money(fee)}` : ''}`);
  }
  if (moves.length) msg('transfer', 'Movimentações do mercado', moves.slice(0, 6).join('\n'));
}

function incomingOffers() {
  const u = userClub();
  if (!WR.chance(0.38)) return;
  const listed = u.squad.map(P).filter(p => p.listed);
  const pool = listed.length && WR.chance(0.7) ? listed : u.squad.map(P).filter(p => p.ovr >= 60);
  if (!pool.length) return;
  const p = WR.weighted(pool, x => x.listed ? 4 : Math.pow(x.ovr / 60, 4));
  if (G.offers.some(o => o.pid === p.id && o.status === 'open')) return;
  const clubs = G.clubs.filter(c => c.id !== G.user && c.balance >= p.value * 0.9 && c.squad.length < 30 && clubLevel(c.rep) + 10 >= p.ovr);
  if (!clubs.length) return;
  const c = WR.pick(clubs);
  const fee = niceRound(p.value * (p.listed ? WR.range(0.8, 1.1) : WR.range(0.9, 1.3)));
  const o = { id: G.nextMsg + 1000, pid: p.id, club: c.id, fee, exp: G.round + 2, status: 'open' };
  G.offers.push(o);
  msg('offer', `Proposta por ${displayName(p)}`, `${c.name} oferece ${money(fee)} por ${displayName(p)} (${p.pos}, ${p.ovr}). Valor de mercado: ${money(p.value)}. A proposta vale por 2 rodadas.`, { offer: o.id, pid: p.id });
}
function offerById(id) { return G.offers.find(o => o.id === id); }
function acceptOffer(o) {
  const p = P(o.pid), c = C(o.club);
  if (!p || p.club !== G.user || o.status !== 'open') return 'Proposta indisponível.';
  if (c.balance < o.fee) { o.status = 'expired'; return `${c.name} não tem mais dinheiro para a compra.`; }
  transfer(p, c.id, o.fee, demandWage(p, c.rep), 3);
  o.status = 'done';
  msg('transfer', `${displayName(p)} vendido`, `${displayName(p)} foi vendido ao ${c.name} por ${money(o.fee)}.`);
  return `${displayName(p)} vendido por ${money(o.fee)}.`;
}
function counterOffer(o, amount) {
  const p = P(o.pid), c = C(o.club);
  if (o.status !== 'open') return 'Proposta indisponível.';
  const r = new RNG(seedOf(G.seed, o.id, amount));
  const pAccept = clamp(1.45 - amount / (p.value * 1.1), 0, 1);
  if (amount <= c.balance && r.next() < pAccept) { o.fee = amount; return acceptOffer(o); }
  if (r.chance(0.5)) { o.status = 'rejected'; return `${c.name} recusou a contraproposta e desistiu do negócio.`; }
  return `${c.name} recusou ${money(amount)}, mas a proposta original continua de pé.`;
}

/* ============================================================================
   8. TESTES DO MOTOR (rodam em ?test=1 ou no menu)
   ============================================================================ */
function runEngineTests() {
  const saved = G, savedWR = WR;
  const out = [], ok = (c, m) => out.push((c ? '✔ ' : '✘ ') + m);
  try {
    genWorld(424242);
    const cfg = c => ({ id: c.id, name: c.name, short: c.short, tactic: c.tactic, lineup: c.lineup, bench: c.bench, ai: true, aiTac: true });
    const a = simulateMatch(cfg(G.clubs[3]), cfg(G.clubs[8]), 777), b = simulateMatch(cfg(G.clubs[3]), cfg(G.clubs[8]), 777);
    ok(JSON.stringify(a.events) === JSON.stringify(b.events) && a.score.join() === b.score.join(), `Determinismo: mesma semente → mesmo jogo (${a.score.join('×')})`);
    const c2 = simulateMatch(cfg(G.clubs[3]), cfg(G.clubs[8]), 778);
    ok(JSON.stringify(a.events) !== JSON.stringify(c2.events), 'Sementes diferentes → jogos diferentes');
    let goals = 0, n = 0, hw = 0, aw = 0, shots = 0;
    for (let i = 0; i < 20; i++) for (let j = 0; j < 20; j++) if (i !== j) {
      const e = simulateMatch(cfg(G.clubs[i]), cfg(G.clubs[j]), i * 97 + j);
      goals += e.score[0] + e.score[1]; shots += e.stats.shots[0] + e.stats.shots[1]; n++;
      if (e.score[0] > e.score[1]) hw++; else if (e.score[0] < e.score[1]) aw++;
    }
    ok(goals / n > 2 && goals / n < 3.4, `Média de gols plausível: ${(goals / n).toFixed(2)} por jogo (${n} jogos)`);
    ok(hw > aw, `Fator casa: ${(hw / n * 100).toFixed(0)}% vitórias do mandante × ${(aw / n * 100).toFixed(0)}% do visitante`);
    ok(shots / n / 2 > 8 && shots / n / 2 < 18, `Finalizações por time: ${(shots / n / 2).toFixed(1)}`);
    let strong = 0;
    for (let k = 0; k < 200; k++) { const e = simulateMatch(cfg(G.clubs[19]), cfg(G.clubs[0]), 5000 + k); if (e.score[1] > e.score[0]) strong++; }
    ok(strong / 200 > 0.5, `Mais forte vence fora de casa: ${(strong / 2).toFixed(0)}% (${G.clubs[0].short} ${squadRating(G.clubs[0])} × ${G.clubs[19].short} ${squadRating(G.clubs[19])})`);
    const t1 = { ...G.clubs[5].tactic, mentality: 2, tempo: 2 }, t0 = { ...G.clubs[5].tactic, mentality: 0, tempo: 0 };
    let g2 = 0, g0 = 0;
    for (let k = 0; k < 200; k++) {
      const x = simulateMatch({ ...cfg(G.clubs[5]), tactic: t1, aiTac: false }, cfg(G.clubs[6]), 9000 + k); g2 += x.score[0] + x.score[1];
      const y = simulateMatch({ ...cfg(G.clubs[5]), tactic: t0, aiTac: false }, cfg(G.clubs[6]), 9000 + k); g0 += y.score[0] + y.score[1];
    }
    ok(g2 > g0, `Tática importa: ofensiva+rápido ${(g2 / 200).toFixed(2)} gols/jogo × defensiva+lento ${(g0 / 200).toFixed(2)}`);
  } catch (err) { ok(false, 'Erro: ' + err.message); }
  G = saved; WR = savedWR;
  return out;
}

const UI = {
  view: 'inbox', sort: 'pos', sortDir: 1, filter: 'ALL', sel: null, ligaTab: 'tabela', ligaRound: null, openMsg: null,
  mkt: { pos: '', age: 40, ovr: 0, val: 0, free: false, listed: false, q: '' },

/* ---------- Cores do clube ---------- */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lum(h) { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; }
function mix(h, w, t) { const a = hexRgb(h), b = hexRgb(w); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function applyTheme(club) {
  const r = document.documentElement.style;
  if (!club) { r.setProperty('--c1', '#3fa7ff'); r.setProperty('--c2', '#fff'); r.setProperty('--c1ink', '#08121c'); return; }
  let [a, b] = club.colors;
  // Cor de destaque precisa ser legível sobre o fundo escuro.
  let acc = lum(a) < 0.08 ? (lum(b) > 0.08 && lum(b) < 0.85 ? b : mix(a, '#ffffff', lum(a) < 0.02 ? 0.62 : 0.45)) : a;
  if (lum(acc) < 0.08) acc = mix(acc, '#ffffff', 0.4);
  r.setProperty('--c1', acc);
  r.setProperty('--c2', b);
  r.setProperty('--c1ink', lum(acc) > 0.4 ? '#08121c' : '#ffffff');
  document.querySelector('meta[name=theme-color]').setAttribute('content', mix(a, '#0b0f14', .55));
}

let badgeN = 0;
function badge(c, size = 30) {
  if (!c) return '';
  const [a, b] = c.colors, id = 'bg' + (badgeN++), pat = c.id % 4;
  const shape = 'M20 1 L38 7 V22 C38 34 30 41 20 45 C10 41 2 34 2 22 V7 Z';
  const fill = pat === 0 ? `<rect x="20" width="20" height="46" fill="${b}"/>` : pat === 1 ? `<rect y="15" width="40" height="11" fill="${b}"/>`
    : pat === 2 ? `<path d="M0 0 L40 46 L40 28 L16 0Z" fill="${b}"/>` : `<rect x="8" width="6" height="46" fill="${b}"/><rect x="26" width="6" height="46" fill="${b}"/>`;
  return `<svg class="badge" width="${size}" height="${Math.round(size * 1.15)}" viewBox="0 0 40 46" aria-hidden="true"><defs><clipPath id="${id}"><path d="${shape}"/></clipPath></defs>
<g clip-path="url(#${id})"><rect width="40" height="46" fill="${a}"/>${fill}</g><path d="${shape}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.6"/>
<text x="20" y="${c.short.length > 2 ? 27 : 28}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${c.short.length > 2 ? 11 : 13}" font-weight="900" fill="#fff" stroke="#000" stroke-width="2.4" paint-order="stroke">${esc(c.short)}</text></svg>`;
}
const posChip = pos => `<span class="pos ${POS_CLS[pos]}">${pos}</span>`;
const ovrColor = v => v >= 80 ? '#2ecc71' : v >= 70 ? '#a3d977' : v >= 60 ? '#f1c40f' : v >= 50 ? '#f39c12' : '#ff6b5b';
const attrCls = v => v <= 5 ? 'a1' : v <= 10 ? 'a2' : v <= 15 ? 'a3' : 'a4';
const condColor = v => v >= 85 ? 'var(--good)' : v >= 70 ? 'var(--ok)' : v >= 55 ? 'var(--warn)' : 'var(--bad)';
const moraleTxt = m => m >= 80 ? ['Excelente', 'good'] : m >= 62 ? ['Boa', 'good'] : m >= 42 ? ['Normal', ''] : m >= 25 ? ['Baixa', 'warn'] : ['Péssima', 'bad'];
const moraleEmoji = m => m >= 80 ? '😄' : m >= 62 ? '🙂' : m >= 42 ? '😐' : m >= 25 ? '😕' : '😠';
function stars(v) { const n = Math.round(clamp(v, 0.5, 5) * 2) / 2; return '★'.repeat(Math.floor(n)) + (n % 1 ? '½' : '') + '<span class="dim">' + '☆'.repeat(5 - Math.ceil(n)) + '</span>'; }
const potStars = p => stars((p.pot + p.potErr - 40) / 11);
const curStars = p => stars((p.ovr - 40) / 11);
const repStars = rep => stars((rep - 38) / 11);
const flag = p => NAT_BY[p.nat]?.f || '';
function pTags(p) {
  let t = '';
  if (p.inj > 0) t += ` <span class="tag bad">🩹 ${p.inj}s</span>`;
  if (p.susp > 0) t += ' <span class="tag bad">SUSP</span>';

}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheetWrap').classList.add('open'); $('#sheet').scrollTop = 0; }

/* ---------- Casca do app ---------- */

/* ---------- Caixa de entrada (início) ---------- */
function nextMatchCard() {

  const probs = lineupProblems(userClub());
  return `<div class="card"><div class="hd"><h3>Próxima partida · Rodada ${G.round + 1}</h3>${inWindow() ? '<span class="tag info">JANELA ABERTA</span>' : ''}</div>
    <div class="nextm"><div>${badge(h, 46)}<div class="small" style="font-weight:800;margin-top:4px">${esc(h.name)}</div><div class="tiny muted">${posOf(h.id)}º · ${formHtml(h)}</div></div>
    <div class="vs">×</div><div>${badge(a, 46)}<div class="small" style="font-weight:800;margin-top:4px">${esc(a.name)}</div><div class="tiny muted">${posOf(a.id)}º · ${formHtml(a)}</div></div></div>
    <div class="row between small muted" style="margin:12px 0 10px"><span>Força: você <b class="num" style="color:var(--text)">${teamOvr(userClub())}</b></span><span>${esc(opp.short)} <b class="num" style="color:var(--text)">${teamOvr(opp)}</b></span></div>

/* ---------- Tática ---------- */
function viewTactic() {
  const c = userClub(), t = c.tactic, slots = FORMATIONS[t.formation];
  const sel = UI.sel;
  const pitch = slots.map(([role, label, x, y], i) => {
    const id = c.lineup[i], p = id != null ? P(id) : null;
    const fit = p ? fitLevel(p, role) : 0;

function teamStrength(c) {
  const cfg = { ...sideCfg(c, false), lineup: c.lineup.map(id => id != null && available(P(id)) ? id : null), bench: [] };
  const e = new MatchEngine(cfg, cfg, 1);
  return e.calc(e.sides[1]);
}
function tacSlotTap(i) {
  const c = userClub(), sel = UI.sel;

  if (sel.t === 's') {
    if (sel.i !== i) [c.lineup[i], c.lineup[sel.i]] = [c.lineup[sel.i], c.lineup[i]];

function placeInSlot(c, id, i) {
  const old = c.lineup[i];

}
function tacPlayerTap(id) {

}
