  openSheet(`<h2>Menu</h2><p class="small muted">${esc(G.manager)} · ${esc(userClub().name)} · ${DIFFICULTY[G.difficulty].name} · semente ${G.seed}</p>
    <div class="list card flat">
      <div class="li tap" data-act="saveNow">💾 <span class="grow">Salvar agora</span><span class="tiny muted">salvamento automático ativo</span></div>
      <div class="li tap" data-act="exportSave">⬇️ <span class="grow">Exportar save (JSON)</span></div>
      <div class="li tap" data-act="importSave">⬆️ <span class="grow">Importar save</span></div>
      <div class="li tap" data-act="install">📲 <span class="grow">Instalar como app</span></div>
      <div class="li tap" data-act="tests">🧪 <span class="grow">Testar motor de simulação</span></div>
      <div class="li tap" data-act="home">🏠 <span class="grow">Menu inicial</span></div>
      <div class="li tap" data-act="wipe">🗑️ <span class="grow bad">Apagar carreira</span></div></div>
    <p class="tiny dim center">Rafael Football Manager · v${VERSION} · funciona offline</p>`);
}
function showTests() {
  openSheet(`<h2>Testes do motor</h2><p class="small muted">Rodando…</p>`);
  setTimeout(() => {
    const t0 = performance.now(), out = runEngineTests();
    openSheet(`<h2>Testes do motor</h2><pre class="out">${esc(out.join('\n'))}</pre><p class="tiny muted">${Math.round(performance.now() - t0)} ms · ${out.filter(x => x[0] === '✔').length}/${out.length} ok</p><button class="btn block" data-act="closeSheet">Fechar</button>`);
  }, 30);
}
function installHelp() {
  if (UI.installEvt) { UI.installEvt.prompt(); UI.installEvt = null; return closeSheet(); }
  openSheet(`<h2>Instalar o app</h2><p class="small"><b>iPhone / iPad (Safari):</b> toque em <b>Compartilhar</b> (quadrado com seta) e depois em <b>Adicionar à Tela de Início</b>.</p>
    <p class="small"><b>Android / Chrome:</b> menu ⋮ → <b>Instalar app</b> (ou “Adicionar à tela inicial”).</p>
    <p class="small muted">Depois de instalado, o jogo abre em tela cheia e funciona sem internet. O save fica salvo neste aparelho — use “Exportar save” para fazer backup.</p>
    <button class="btn block" data-act="closeSheet">Entendi</button>`);
}

/* ---------- Tela inicial ---------- */
function newPreview(seed) {
  UI.start.seed = seed || Math.floor(Math.random() * 1e9);
  UI.start.club = null;
  genWorld(UI.start.seed);
}
function renderStart() {
  if (!G || UI.start.seed !== G.seed) newPreview(UI.start.seed);
  const saved = peekSave();
  const s = UI.start;
  const clubs = G.clubs.slice().sort((a, b) => b.rep - a.rep);
  const sel = s.club != null ? C(s.club) : null;
  const detail = sel ? `<div class="card fadein" id="clubDetail" style="border-color:#3fa7ff"><div class="row" style="gap:12px">${badge(sel, 48)}<div class="grow"><h2>${esc(sel.name)}</h2><div class="stars">${repStars(sel.rep)}</div></div></div>
      <div class="grid2" style="margin:12px 0"><div class="stat"><div class="l">Orçamento</div><div class="v num" style="font-size:1rem">${money(niceRound(sel.balance * DIFFICULTY[s.diff].money))}</div></div>
      <div class="stat"><div class="l">Força do elenco</div><div class="v num">${squadRating(sel)}</div></div>
      <div class="stat"><div class="l">Estádio</div><div class="v num" style="font-size:1rem">${sel.stadium.toLocaleString('pt-BR')}</div></div>
      <div class="stat"><div class="l">Objetivo</div><div class="v" style="font-size:.82rem">${boardGoalText(boardTargetFor(sel))}</div></div></div>
      <div class="small muted" style="margin-bottom:12px">Destaques: ${sel.squad.map(P).sort((a, b) => b.ovr - a.ovr).slice(0, 3).map(p => `${esc(displayName(p))} (${p.pos} ${p.ovr})`).join(', ')}</div>
      <button class="btn pri block" data-act="startCareer" style="background:#3fa7ff;color:#08121c">Começar carreira</button></div>` : '';
  $('#root').innerHTML = `<div class="start"><div class="wrapw" style="max-width:820px">
    <div class="logo"><div style="font-size:2.6rem">⚽</div><div class="t">RAFAEL <em>FOOTBALL</em><br>MANAGER</div><div class="s">SEJA O TÉCNICO</div></div>
    ${saved ? `<div class="card"><div class="row between"><div><div class="tiny muted">CARREIRA SALVA</div><b>${esc(saved.manager)} · ${esc(saved.club)}</b><div class="small muted">${saved.year} · rodada ${saved.round}</div></div><button class="btn pri" data-act="continueSave" style="background:#3fa7ff;color:#08121c">Continuar</button></div></div>` : ''}
    <div class="card"><h2>Nova carreira</h2>
      <div class="field"><label>Nome do técnico</label><input class="input" maxlength="28" placeholder="Rafael" value="${esc(s.name)}" data-input="startName"></div>
      <div class="field"><label>Dificuldade</label><div class="seg">${Object.entries(DIFFICULTY).map(([k, d]) => `<button class="${s.diff === k ? 'on' : ''}" data-act="startDiff" data-v="${k}" style="${s.diff === k ? 'background:#3fa7ff;color:#08121c' : ''}">${d.name}</button>`).join('')}</div>
        <div class="tiny muted">${{ facil: 'Mais dinheiro e uma diretoria paciente.', normal: 'Equilíbrio entre orçamento e cobrança.', dificil: 'Pouco dinheiro, rivais mais fortes e diretoria exigente.' }[s.diff]}</div></div>
      <div class="field"><label>Semente do mundo</label><div class="row"><input class="input grow num" inputmode="numeric" value="${s.seed}" data-change="startSeed"><button class="iconbtn" data-act="reseed" aria-label="Novo mundo">🎲</button></div>
        <div class="tiny muted">A mesma semente gera os mesmos clubes e jogadores.</div></div></div>
    <div class="sec-title">Escolha seu clube</div>
    <div class="clubgrid" style="margin-bottom:12px">${clubs.map(c => `<button class="clubpick ${s.club === c.id ? 'on' : ''}" data-act="pickClub" data-id="${c.id}">${badge(c, 40)}<b>${esc(c.name)}</b><span class="stars">${repStars(c.rep)}</span><span class="tiny muted">Força ${squadRating(c)}</span></button>`).join('')}</div>
    ${detail}
    <button class="btn block ghost" data-act="importSave">⬆️ Importar save (JSON)</button>
  </div></div>`;
  if (sel) setTimeout(() => $('#clubDetail')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 30);
}
function startCareer() {
  const s = UI.start;
  if (s.club == null) return toast('Escolha um clube.');
  G.manager = (s.name || '').trim() || 'Rafael';
  G.difficulty = s.diff;
  G.user = s.club;
  const c = userClub();
  c.balance = niceRound(c.balance * DIFFICULTY[s.diff].money);
  c.training = { intensity: 1, focus: 'eq' };
  G.fin = { cur: newFinSeason(), log: [], hist: [] };
  G.board = { conf: 60, target: boardTargetFor(c), warned: 0 };
  msg('news', 'Dicas do auxiliar técnico', 'Confira a escalação na aba Tática (toque numa vaga e depois em outra vaga ou jogador para trocar). No Mercado você busca reforços; nas Finanças ajusta o preço do ingresso. Quando estiver pronto, toque em “Jogar”.');
  msg('transfer', 'Janela de transferências aberta', `A janela de pré-temporada fica aberta até a rodada ${WINDOWS[0][1] + 1}.`);
  msg('board', `Bem-vindo, ${G.manager}!`, `A diretoria do ${c.name} apresenta você como novo técnico. Objetivo da temporada: ${boardGoalText()}. Orçamento para contratações: ${money(c.balance)}. Teto salarial: ${money(c.wageBudget)} por semana. Boa sorte!`);
  WR = new RNG(G.rngState);
  UI.view = 'inbox'; UI.openMsg = null;
  $('#root').innerHTML = '';
  save(); render();
}

/* ---------- Delegação de eventos ---------- */
const ACT = {
  tab: d => setView(d.v),
  continue: () => onContinue(),
  menu: () => openMenu(),
  closeSheet: () => closeSheet(),
  msg: d => { const m = G.inbox.find(x => x.id === +d.id); if (!m) return; m.read = true; UI.openMsg = UI.openMsg === m.id ? null : m.id; renderView(); renderTabs(); autosave(); },
  readAll: () => { G.inbox.forEach(m => m.read = true); renderView(); renderTabs(); autosave(); },
  player: d => openPlayer(+d.id),
  club: d => openClub(+d.id),
  fixture: d => openFixture(+d.r, +d.i),
  ligaTab: d => { UI.ligaTab = d.v; renderView(); },
  ligaRound: d => { UI.ligaRound = clamp(+d.v, 0, ROUNDS - 1); renderView(); },
  sqFilter: d => { UI.filter = d.v; renderView(); },
  sqDir: () => { UI.sortDir *= -1; renderView(); },
  slot: d => tacSlotTap(+d.i),
  tacPlayer: d => tacPlayerTap(+d.id),
  clearSel: () => { UI.sel = null; renderView(); },
  toggleBench: d => {
    const c = userClub(), id = +d.id;
    if (c.bench.includes(id)) c.bench = c.bench.filter(x => x !== id);
    else if (c.bench.length >= BENCH_SIZE) return toast(`O banco já tem ${BENCH_SIZE} jogadores.`);
    else c.bench.push(id);
    autosave(); renderView();
  },
  formation: d => { const c = userClub(); c.tactic.formation = d.v; reshapeLineup(c); UI.sel = null; autosave(); renderView(); },
  tac: d => { userClub().tactic[d.k] = +d.v; autosave(); renderView(); },
  train: d => { userClub().training[d.k] = d.k === 'intensity' ? +d.v : d.v; autosave(); renderView(); },
  autoPick: () => { autoPick(userClub()); UI.sel = null; autosave(); renderView(); toast('Escalação automática aplicada.'); },
  mktPos: d => { UI.mkt.pos = d.v; renderView(); },
  mktToggle: d => { UI.mkt[d.k] = !UI.mkt[d.k]; renderView(); },
  gotoOffer: d => { const m = G.inbox.find(x => x.data && x.data.offer === +d.id); if (m) { m.read = true; UI.openMsg = m.id; } setView('inbox'); },
  negotiate: d => openNegotiation(+d.id),
  renew: d => openNegotiation(+d.id, 'renew'),
  toggleList: d => { const p = P(+d.id); p.listed = !p.listed; autosave(); toast(p.listed ? 'Jogador colocado à venda.' : 'Jogador retirado da venda.'); openPlayer(p.id); },
  release: d => {
    const p = P(+d.id), c = userClub();
    if (c.squad.length <= 16) return toast('Elenco mínimo de 16 jogadores.');
    const weeks = Math.max(0, (p.contract - G.year) * ROUNDS + (ROUNDS - G.round));
    UI.releaseCost = niceRound(p.wage * weeks * 0.5); UI.releaseId = p.id;
    confirmSheet('Rescindir contrato?', `${esc(displayName(p))} será dispensado. A multa rescisória é de <b>${money(UI.releaseCost)}</b> (metade dos salários restantes).`, 'doRelease', 'Rescindir', true);
  },
  doRelease: () => {
    const p = P(UI.releaseId), c = userClub();
    c.balance -= UI.releaseCost; finLog(`Rescisão de ${displayName(p)}`, -UI.releaseCost, 'wages');
    c.squad = c.squad.filter(x => x !== p.id); c.lineup = c.lineup.map(x => x === p.id ? null : x); c.bench = c.bench.filter(x => x !== p.id);
    p.club = null; p.listed = false; p.wage = demandWage(p, 55);
    closeSheet(); autosave(); render(); toast('Contrato rescindido.');
  },
  negSet: d => { UI.neg.fee = +d.v; renderNeg(); },
  negWageSet: d => { UI.neg.wage = +d.v; renderNeg(); },
  negYears: d => { UI.neg.years = +d.v; renderNeg(); },
  negBid: () => negBid(),
  negContract: () => negContract(),
  offerAccept: d => { toast(acceptOffer(offerById(+d.id))); autosave(); render(); },
  offerCounter: d => { const o = offerById(+d.id); toast(counterOffer(o, niceRound(o.fee * +d.k))); autosave(); render(); },
  offerReject: d => { const o = offerById(+d.id); o.status = 'rejected'; toast('Proposta recusada.'); autosave(); renderView(); },
  ticket: d => { const c = userClub(); c.ticket = clamp(c.ticket + +d.v, 10, 150); autosave(); renderView(); },
  // pré-jogo
  fixLineup: () => { fixLineup(userClub()); autosave(); openPreMatch(); toast('Escalação corrigida.'); },
  goTactic: () => { closeSheet(); setView('tactic'); },
  watch: () => { closeSheet(); openMatch(prepareUserMatch()); },
  quick: () => {
    const e = prepareUserMatch(), u = e.sides[0].id === G.user ? 0 : 1;
    e.sides[u].ai = true;
    while (!e.done) e.step();
    closeSheet();
    const { r, i } = finishUserMatch(e);
    if (!G.fired) openFixture(r, i);
  },
  // partida
  mPlay: () => matchPlay(),
  mPause: () => matchPause(),
  mSpeed: () => { const M = UI.match; M.speed = (M.speed + 1) % SPEEDS.length; if (M.running) matchPlay(); else renderMatchCtl(); },
  mSubs: () => { matchPause(); openSubs(); },
  mTac: () => { matchPause(); openMatchTactic(); },
  mSkip: () => matchSkip(),
  mOut: d => { UI.match.selOut = +d.id; renderSubs(); },
  mIn: d => {
    const M = UI.match;
    if (!M.selOut) return toast('Escolha primeiro quem sai.');
    if (M.e.sub(M.u, M.selOut, +d.id)) { M.selOut = null; M.forced = false; flushEvents(); renderMatchSb(); renderMatchCtl(); closeSheet(); toast('Substituição feita.'); }
  },
  mSubsClose: () => {
    const M = UI.match;
    if (M.e.pendingInjury && M.e.pendingInjury.side === M.u) { M.e.pendingInjury = null; }
    closeSheet(); flushEvents(); renderMatchSb(); renderMatchCtl();
  },
  mTacSet: d => { const M = UI.match; M.e.setTactic(M.u, d.k, +d.v); flushEvents(); openMatchTactic(); },
  mForm: d => { const M = UI.match; M.e.setFormation(M.u, d.v); flushEvents(); openMatchTactic(); },
  mRatings: () => showRatings(),
  mDone: () => { const M = UI.match; clearInterval(M.timer); $('#match').classList.remove('open'); $('#match').innerHTML = ''; UI.match = null; finishUserMatch(M.e); },
  // temporada
  startNewSeason: () => { newSeason(); closeSheet(); UI.view = 'inbox'; UI.openMsg = null; save(); render(); if (G.fired) openFired(); else toast(`Temporada ${G.year} começou!`); },
  takeJob: d => { takeJob(+d.id); closeSheet(); UI.view = 'inbox'; save(); render(); toast(`Você é o novo técnico do ${userClub().name}!`); },
  // menu
  saveNow: () => { save(); toast('Jogo salvo.'); closeSheet(); },
  exportSave: () => exportSave(),
  importSave: () => $('#importFile').click(),
  install: () => installHelp(),
  tests: () => showTests(),
  home: () => { save(); closeSheet(); G = null; UI.start.seed = 0; $('#root').innerHTML = ''; render(); },
  wipe: () => confirmSheet('Apagar carreira?', 'O save deste aparelho será apagado. Exporte antes se quiser guardar uma cópia.', 'doWipe', 'Apagar', true),
  doWipe: () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } closeSheet(); G = null; UI.start.seed = 0; $('#root').innerHTML = ''; render(); toast('Carreira apagada.'); },
  // início
  startDiff: d => { UI.start.diff = d.v; renderStart(); },
  pickClub: d => { UI.start.club = +d.id; renderStart(); },
  reseed: () => { newPreview(); renderStart(); },
  startCareer: () => startCareer(),
  continueSave: () => { const g = loadSave(); if (!g) return toast('Save inválido.'); setGame(g); $('#root').innerHTML = ''; UI.view = 'inbox'; render(); },
};
const CHANGE = {
  sqSort: el => { UI.sort = el.value; renderView(); },
  mktAge: el => { UI.mkt.age = +el.value; renderView(); },
  mktOvr: el => { UI.mkt.ovr = +el.value; renderView(); },
  mktVal: el => { UI.mkt.val = +el.value; renderView(); },
  negFee: el => { UI.neg.fee = +el.value; renderNeg(); },
  negWage: el => { UI.neg.wage = +el.value; renderNeg(); },
  startSeed: el => { const v = parseInt(el.value, 10); if (v > 0) { newPreview(v); renderStart(); } },
};
/* Atualização ao vivo enquanto o dedo arrasta o slider (sem re-renderizar tudo). */
const LIVE = {
  negFee: el => { UI.neg.fee = +el.value; $('#negFee').textContent = money(+el.value); },
  negWage: el => { UI.neg.wage = +el.value; $('#negWage').textContent = money(+el.value); },
  mktAge: el => { $('#lblAge').textContent = +el.value < 40 ? el.value : 'qualquer'; },
  mktOvr: el => { $('#lblOvr').textContent = +el.value || 'qualquer'; },
};
const INPUT = {
  startName: el => { UI.start.name = el.value; },
  mktQ: el => { UI.mkt.q = el.value; clearTimeout(INPUT.h); INPUT.h = setTimeout(() => { const pos = el.selectionStart; renderView(); const n = $('[data-input=mktQ]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }, 450); },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { ev.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('change', ev => { const el = ev.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el); });
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.input && INPUT[el.dataset.input]) INPUT[el.dataset.input](el);
  if (el.dataset.change && LIVE[el.dataset.change]) LIVE[el.dataset.change](el);
});

/* ============================================================================
   10. SAVE (localStorage + exportar/importar JSON) E PWA
   ============================================================================ */
function validSave(g) {
  return g && g.v === VERSION && Array.isArray(g.clubs) && g.clubs.length === 20 && g.players && typeof g.players === 'object'
    && Array.isArray(g.fixtures) && g.fixtures.length === ROUNDS && typeof g.user === 'number' && g.fin && g.board;
}
function setGame(g) { G = g; WR = new RNG(G.rngState); }
function save() {
  if (!G || G.user == null) return;
  G.rngState = WR.s; G.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }
  catch (e) { toast('Não foi possível salvar: armazenamento cheio ou bloqueado.'); }
}
let saveTimer = null;
function autosave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }
function loadSave() {
  try { const s = localStorage.getItem(SAVE_KEY); if (!s) return null; const g = JSON.parse(s); return validSave(g) ? g : null; }
  catch (e) { return null; }
}
function peekSave() {
  const g = loadSave();
  return g ? { manager: g.manager, club: g.clubs[g.user]?.name || '—', year: g.year, round: Math.min(g.round + 1, ROUNDS) } : null;
}
function exportSave() {
  save();
  const data = JSON.stringify(G);
  const name = `rafael-fm-${G.year}-r${G.round + 1}.json`;
  const blob = new Blob([data], { type: 'application/json' });
  const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && /iP(hone|ad|od)/.test(navigator.userAgent)) {
    navigator.share({ files: [file], title: 'Save — Rafael Football Manager' }).catch(() => { });
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  toast('Save exportado.');
}
$('#importFile').addEventListener('change', ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const g = JSON.parse(rd.result);
      if (!validSave(g)) throw new Error('formato');
      setGame(g); save(); closeSheet(); $('#root').innerHTML = ''; UI.view = 'inbox'; render(); toast('Save importado!');
    } catch (e) { toast('Arquivo inválido: não é um save do Rafael Football Manager.'); }
  };
  rd.readAsText(f);
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); UI.installEvt = e; });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}

/* ---------- Início ---------- */
render();
if (/[?&]test=1/.test(location.search)) showTests();
</script>
