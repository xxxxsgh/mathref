<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rafael FM">
<meta name="description" content="Rafael Football Manager — gerencie um clube de futebol fictício: elenco, tática, mercado e finanças.">
<title>Rafael Football Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ==========================================================================
   ESTILO — tema escuro estilo painel esportivo.
   As cores do clube escolhido entram por --c1 / --c2 (definidas em JS).
   ========================================================================== */
:root{
  --bg:#0b0f14; --bg2:#10161e; --card:#151d28; --card2:#1b2633; --line:#243244;
  --text:#e8eef5; --muted:#8a9bb0; --dim:#5d6d82;
  --good:#2ecc71; --ok:#a3d977; --warn:#f1c40f; --orange:#f39c12; --bad:#e74c3c; --info:#3fa7ff;
  --c1:#3fa7ff; --c2:#ffffff; --c1ink:#08121c;
  --r:14px; --gap:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.35}
html,body{overflow:hidden}
body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
#root{height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem} h3{font-size:1rem}
a{color:var(--c1)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:8px} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.between{justify-content:space-between} .center{text-align:center}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}

/* ---------- Estrutura ---------- */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 8px) 12px 8px;background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 22%,var(--bg2)),var(--bg2));border-bottom:1px solid var(--line)}
.top .club{min-width:0;flex:1}
.top .club b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .club span{font-size:.76rem;color:var(--muted)}
#view{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px;scroll-padding:12px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.68rem;font-weight:600;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--c1)}
.tabs button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--c1)}
.tabs .dot{position:absolute;top:5px;right:calc(50% - 16px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px}
.wrapw{max-width:980px;margin:0 auto}
@media (min-width:900px){
  #app{grid-template-columns:96px 1fr;grid-template-rows:auto 1fr}
  .top{grid-column:1/3}
  .tabs{grid-row:2;grid-column:1;grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding-top:10px;align-content:start}
  .tabs button{padding:12px 4px;font-size:.74rem}
  .tabs button.on::before{top:20%;bottom:20%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  #view{grid-row:2;grid-column:2;padding:18px 22px 40px}
}

/* ---------- Componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:var(--gap)}
.card.flat{padding:0;overflow:hidden}
.card h2,.card h3{margin-bottom:10px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card .hd h2,.card .hd h3{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:700px){.cols2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:700;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--c1);color:var(--c1ink);border-color:transparent}
.btn.good{background:var(--good);color:#06210f;border-color:transparent}
.btn.bad{background:color-mix(in srgb,var(--bad) 85%,#000);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 11px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:700;font-size:.85rem;color:var(--muted);min-height:38px}
.seg button.on{background:var(--c1);color:var(--c1ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font-size:.82rem;font-weight:700;color:var(--muted)}
.chip.on{background:color-mix(in srgb,var(--c1) 20%,var(--card));border-color:var(--c1);color:var(--text)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.input,select.input{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:16px}
input[type=range]{width:100%;accent-color:var(--c1);height:32px}
.pos{display:inline-grid;place-items:center;min-width:38px;height:22px;padding:0 5px;border-radius:6px;font-size:.7rem;font-weight:800;letter-spacing:.02em;color:#08121c}
.pos.g{background:#f1c40f}.pos.d{background:#3fa7ff}.pos.m{background:#2ecc71}.pos.a{background:#ff6b5b}
.ovr{font-weight:900;font-size:1.15rem;min-width:34px;text-align:center}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--good)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.tag.bad{color:#fff;background:var(--bad);border-color:transparent}
.tag.warn{color:#000;background:var(--warn);border-color:transparent}
.tag.info{color:#fff;background:#2f6fb0;border-color:transparent}
.big{font-size:2rem;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.stat .l{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:1.35rem;font-weight:900;margin-top:2px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);min-height:52px}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--card2)}
.li.me{background:color-mix(in srgb,var(--c1) 14%,transparent)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.sec-title{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin:16px 2px 8px}
.fadein{animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Escudo ---------- */
.badge{flex:none;display:inline-block;vertical-align:middle}

/* ---------- Tabela ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 4px;text-align:center;position:sticky;top:0;background:var(--card)}
.tbl td{padding:8px 4px;text-align:center;border-top:1px solid var(--line)}
.tbl td.l,.tbl th.l{text-align:left}
.tbl tr.me td{background:color-mix(in srgb,var(--c1) 16%,transparent)}
.tbl .zone{width:4px;padding:0}
.z-champ{background:#f1c40f}.z-cont{background:#3fa7ff}.z-rel{background:#e74c3c}
.form{display:inline-flex;gap:2px}
.form i{width:14px;height:14px;border-radius:3px;font-size:.55rem;font-style:normal;font-weight:900;display:grid;place-items:center;color:#000}
.form .W{background:var(--good)}.form .D{background:#9aa7b6}.form .L{background:var(--bad);color:#fff}

/* ---------- Campo tático ---------- */
.pitch{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:68/96;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#1f6b3a 0 12.5%,#1b6034 12.5% 25%);border:2px solid #2e8a4f;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.pitch .ln{position:absolute;border:2px solid rgba(255,255,255,.35)}
.pitch .mid{left:0;right:0;top:50%;height:0;border-width:2px 0 0}
.pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box1{left:22%;right:22%;top:-2px;height:15%;border-top:0}
.pitch .box2{left:22%;right:22%;bottom:-2px;height:15%;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:23%;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0}
.slot .shirt{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1rem;background:var(--c1);color:var(--c1ink);border:3px solid var(--c2);box-shadow:0 3px 8px rgba(0,0,0,.45);transition:transform .15s}
.slot .nm{font-size:.68rem;font-weight:800;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .rl{font-size:.58rem;font-weight:800;color:rgba(255,255,255,.75)}
.slot.sel .shirt{transform:scale(1.15);box-shadow:0 0 0 4px #fff,0 0 22px var(--c1)}
.slot.empty .shirt{background:rgba(0,0,0,.35);color:#fff;border-style:dashed}
.slot.fit1 .shirt{border-color:var(--warn)} .slot.fit2 .shirt{border-color:var(--bad)}
.slot.inj .shirt{background:var(--bad);color:#fff}
.legend{display:flex;gap:12px;justify-content:center;font-size:.72rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ---------- Atributos ---------- */
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.attrs .grp h4{margin:0 0 6px;font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.attr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.attr b{min-width:26px;text-align:center;border-radius:5px;font-weight:900}
.a1{color:#ff6b5b}.a2{color:#f39c12}.a3{color:#c8e06b}.a4{color:#2ecc71}

/* ---------- Bottom sheet / modal ---------- */
#sheetWrap{position:fixed;inset:0;z-index:50;display:none}
#sheetWrap.open{display:block}
#sheetWrap .bk{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;max-height:92vh;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:8px 14px calc(18px + var(--safe-b));animation:up .22s ease-out}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
@media (min-width:700px){#sheet{left:50%;right:auto;bottom:50%;transform:translate(-50%,50%);width:min(620px,94vw);border-radius:20px;max-height:88vh;animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:#fff;color:#000;font-weight:700;padding:10px 16px;border-radius:12px;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ---------- Partida ---------- */
#match{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#match.open{display:flex}
.sb{padding:calc(var(--safe-t) + 10px) 14px 12px;background:linear-gradient(180deg,#121a24,var(--bg));border-bottom:1px solid var(--line)}
.sb .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sb .tm{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-weight:800;font-size:.86rem;min-width:0}
.sb .tm span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .score{font-size:3rem;font-weight:900;letter-spacing:-.02em;line-height:1;text-align:center}
.sb .clock{font-size:.85rem;font-weight:800;color:var(--good);text-align:center;margin-top:4px}
.sb .score.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.25);color:var(--warn)}}
.mstats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:.8rem;margin-top:10px}
.mstats .v{font-weight:900;font-size:1rem;min-width:30px;text-align:center}
.mstats .lb{text-align:center;color:var(--muted);font-size:.7rem;text-transform:uppercase;font-weight:700}
.dbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:2px}
.dbar i{display:block;height:100%}
#feed{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.ev{display:flex;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:var(--card);border-left:4px solid transparent;font-size:.9rem;animation:fadein .25s}
.ev .m{font-weight:900;min-width:34px;color:var(--muted)}
.ev.goal{background:color-mix(in srgb,var(--good) 18%,var(--card));border-left-color:var(--good);font-weight:700}
.ev.card-y{border-left-color:var(--warn)} .ev.card-r{border-left-color:var(--bad)}
.ev.inj{border-left-color:#c27cff} .ev.sub{border-left-color:var(--info)}
.ev.big{border-left-color:var(--orange)} .ev.info{background:transparent;color:var(--muted);justify-content:center;font-weight:700}
.mctl{display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.mctl .btn{flex:1;min-width:0;padding:10px 8px}

/* ---------- Tela inicial ---------- */
.start{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 24px) 16px calc(var(--safe-b) + 30px);background:radial-gradient(circle at 50% -10%,#1d3550 0,var(--bg) 60%)}
.logo{text-align:center;margin:10px 0 22px}
.logo .t{font-size:2.3rem;font-weight:900;letter-spacing:-.03em;line-height:1}
.logo .t em{font-style:normal;color:#3fa7ff}
.logo .s{color:var(--muted);font-weight:700;letter-spacing:.3em;font-size:.72rem;margin-top:6px}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.clubpick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:center}
.clubpick.on{border-color:#3fa7ff;background:#14263a}
.clubpick b{font-size:.86rem;line-height:1.15}
.stars{color:#f1c40f;letter-spacing:1px;font-size:.8rem}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:1.1rem;background:var(--card2)}
.msg.unread .t{font-weight:800}
.msg .t{font-size:.92rem}
.udot{width:8px;height:8px;border-radius:50%;background:var(--c1);flex:none;margin-top:6px}
.nextm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.nextm .vs{font-weight:900;color:var(--muted)}
.pbars .r{display:grid;grid-template-columns:44px 1fr 34px;align-items:center;gap:8px;font-size:.78rem;font-weight:700;margin:5px 0}
.chart{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:6px}
.chart i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
pre.out{white-space:pre-wrap;font-size:.78rem;background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--line);max-height:50vh;overflow:auto}
</style>

<div id="root"></div>
<div id="sheetWrap"><div class="bk" data-act="closeSheet"></div><div id="sheet"></div></div>
<div id="match"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<script>
'use strict';
/* ============================================================================
   RAFAEL FOOTBALL MANAGER
   Arquivo único: HTML + CSS + JS puro. Seções:
     1. Utilitários e RNG com semente
     2. Dados e constantes (posições, atributos, formações, nomes)
     3. Geração procedural (jogadores, clubes, mundo, calendário)
     4. Regras de jogador (overall, valor, salário, escalação automática)
     5. Motor de simulação (MatchEngine / simulateMatch — sem DOM)
     6. Temporada (rodadas, tabela, diretoria, finanças, evolução, fim de ano)
     7. Mercado (propostas, negociação, IA de transferências)
     8. Testes do motor
     9. UI (telas, componentes, partida ao vivo)
    10. Save (localStorage, exportar/importar) e PWA
   ============================================================================ */

/* ============================================================================
   1. UTILITÁRIOS E RNG
   ============================================================================ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + f(x), 0);

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
const seedOf = (...parts) => hashStr(parts.join('|'));

/** Gerador determinístico (mulberry32). O estado `s` é serializável. */
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() {
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  range(a, b) { return a + this.next() * (b - a); }
  chance(p) { return this.next() < p; }
  pick(a) { return a[Math.floor(this.next() * a.length)]; }
  normal(m = 0, sd = 1) {
    const u = 1 - this.next(), v = this.next();
    return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  weighted(items, w) {
    let tot = 0;
    const ws = items.map(it => { const x = Math.max(0, w(it)); tot += x; return x; });
    if (tot <= 0) return items[Math.floor(this.next() * items.length)];
    let r = this.next() * tot;
    for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  }
  shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
}

function money(n) {

  if (kind === 'youth') return rng.int(16, 18);
  const r = rng.next();
  if (r < .15) return rng.int(18, 21);
  if (r < .55) return rng.int(22, 26);

  return rng.int(31, 35);
}

/** Gera atributos 1–20 coerentes com a posição e um overall-alvo. */
function genAttrs(rng, pos, target) {
  const w = POS_W[pos], base = target / 5, a = {};
  for (const k of ALL_ATTRS) {
    let v;
    if (ATTR_GROUPS[3].keys.includes(k)) v = pos === 'GOL' ? base + rng.normal(0, 1.4) + (w[k] - 2) * .4 : rng.int(1, 5);
    else if (w[k]) v = base + rng.normal(0, 1.5) + (w[k] - 2) * .45;
    else v = base * .72 + rng.normal(0, 2.2) - (pos === 'GOL' ? 3 : 0);
    a[k] = clamp(Math.round(v), 1, 20);
  }
  // Ajuste fino para o overall bater com o alvo.
  for (let it = 0; it < 3; it++) {
    const diff = target - ovrFor(a, pos);
    if (Math.abs(diff) < 1) break;
    const step = Math.round(diff / 5) || Math.sign(diff);
    for (const k in w) a[k] = clamp(a[k] + step, 1, 20);
  }
  return a;
}

function genPlayer(rng, { pos, age, target, nat, club, youth }) {
  nat = nat || rng.weighted(NATS, n => n.w).c;
  age = age || genAge(rng, youth ? 'youth' : '');
  const { fn, ln } = genName(rng, nat);
  // Jovens ficam abaixo do alvo e ganham potencial; veteranos podem ter passado do auge.
  let t = target + (age <= 20 ? -(21 - age) * 2.2 : 0);
  t = clamp(Math.round(t + rng.normal(0, 2)), 25, 92);
  const attrs = genAttrs(rng, pos, t);
  const ovr = ovrFor(attrs, pos);
  let pot;
  if (age <= 23) pot = ovr + Math.max(0, rng.normal((24 - age) * 2.6, 6));
  else if (age <= 27) pot = ovr + Math.max(0, rng.normal(2, 2));
  else pot = ovr;
  pot = clamp(Math.round(pot), ovr, 95);
  const foot = rng.chance(.72) ? 'D' : rng.chance(.85) ? 'E' : 'A';
  const p = {
    id: G.nextPid++, fn, ln, age, pos, foot, nat, attrs, ovr, pot,
    potErr: rng.int(-6, 6),                      // erro fixo da estimativa de potencial
    morale: rng.int(55, 75), cond: 100, club: club ?? null,
    wage: 0, contract: G.year + rng.int(0, 3) + (age < 24 ? 1 : 0), value: 0,
    inj: 0, injName: '', susp: 0, yc: 0, listed: false, youth: !!youth, mins: 0,
    st: newPStats(), car: { apps: 0, goals: 0, ast: 0 },
  };
  p.value = computeValue(p);
  p.wage = demandWage(p, club != null ? G.clubs[club].rep : 50);
  G.players[p.id] = p;
  return p;
}

function genSquad(rng, club) {
  const lvl = clubLevel(club.rep);
  for (const pos of POS) {
    for (let i = 0; i < SQUAD_TEMPLATE[pos]; i++) {
      const starter = i < STARTERS[pos];
      const target = lvl + rng.normal(0, 3.5) - (starter ? 0 : 6 + rng.int(0, 5));
      const p = genPlayer(rng, { pos, target, club: club.id, age: starter ? undefined : (rng.chance(.4) ? rng.int(18, 22) : undefined) });
      club.squad.push(p.id);
    }
  }
}

/** Calendário em turno e returno (método do círculo). */
function genFixtures(rng, ids) {
  const n = ids.length, arr = rng.shuffle(ids.slice()), half = [];
  for (let r = 0; r < n - 1; r++) {
    const games = [];
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n - 1 - i];
      games.push((r + i) % 2 === 0 ? { h: a, a: b } : { h: b, a: a });
    }
    half.push(games);
    arr.splice(1, 0, arr.pop());
  }
  const second = half.map(g => g.map(x => ({ h: x.a, a: x.h })));
  return half.concat(second).map(rd => rd.map(x => ({ ...x, hg: null, ag: null, sc: [] })));
}
